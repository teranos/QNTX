<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@qntx/glyphs — placement</title>
  <style>
    /* The package's own identity: black and white. Structure follows the
       working consumer in sbvh.nl/src/GlyphTray.svelte — the tray is a fixed
       right-edge column, the dots carry the pointer events, and a window is
       reached through [data-window-state]. */
    :root {
      --border: #fff;
      --border-radius: 0;
      --font-size-sm: 12px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #000;
      color: #fff;
      font: 13px/1.4 var(--font-mono);
      min-height: 100vh;
    }

    /* Tray — fixed right edge, vertically centred */
    .glyph-run {
      position: fixed;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      width: fit-content;
    }

    .glyph-run-indicators {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      width: fit-content;
      height: fit-content;
    }

    /* Pointer events on the dots only */
    .glyph-run-glyph {
      pointer-events: auto;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      overflow: hidden;
      border: 1px solid #fff;
      border-radius: var(--border-radius);
    }

    .glyph-run-glyph:hover { filter: brightness(1.6); }

    /* Position and stacking during a morph are written inline by
       prepareMorphTo; the morph class leaves the element at morph commit,
       and a settled window wears .glyph-window. */
    .glyph-morphing-to-window,
    .glyph-window {
      pointer-events: auto;
    }

    /* The engine writes the dot colour inline, so the window surface has to
       win against it. */
    [data-window-state="true"] {
      background-color: #000 !important;
      border: 1px solid #fff;
    }

    .glyph-title-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      height: 32px;
      width: 100%;
      background-color: #000;
      border-bottom: 1px solid #fff;
      flex-shrink: 0;
      user-select: none;
      cursor: move;
      font-size: var(--font-size-sm);
      color: #fff;
    }

    .glyph-title-bar button {
      width: 22px;
      height: 22px;
      padding: 1px 2px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin-left: 2px;
    }

    .glyph-title-bar button:hover { background: #fff; color: #000; }

    .glyph-content-area {
      flex: 1 1 auto;
      overflow: auto;
      padding: 8px;
    }

    .glyph-content {
      font-family: var(--font-mono);
      font-size: var(--font-size-sm);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
