[workspace]
resolver = "2"
members = [
    "crates/ats",
    "crates/ats-duckdb",
    "crates/ats-id",
    "crates/ats-indexeddb",
    "crates/ats-sqlite",
    "crates/ats-wasm",
    "crates/qntx-ffi-common",
    "crates/qntx-grpc",
    "crates/qntx-proto",
    "qntx-plugins/pty-glyph",
    "qntx-plugins/qntx-meili",
    "qntx-plugins/qntx-reduce",   # PyO3 — build only via Nix
    "web/src-tauri",
]
exclude = [
    "ats/ax/fuzzy-ax",      # CGO library for Go, not part of Rust ecosystem
]

[workspace.package]
version = "0.2.44"
edition = "2021"
license = "MIT"
repository = "https://github.com/teranos/QNTX"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
parking_lot = "0.12"
