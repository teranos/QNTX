[workspace]
resolver = "2"
members = [
    "crates/ats",
    "crates/ats-duckdb",
    "crates/ats-id",
    "crates/ats-indexeddb",
    "crates/ats-sqlite",
    "crates/ats-wasm",
    "crates/laye-error",
    "crates/laye-me",
    "crates/laye-net",
    "crates/laye-p2p",
    "crates/laye-protocol",
    "crates/qntx-ffi-common",
    "crates/qntx-grpc",
    "crates/qntx-proto",
    "qntx-plugins/pty-glyph",
    "qntx-plugins/qntx-meili",
    "qntx-plugins/qntx-reduce",   # PyO3 — build only via Nix
]
exclude = [
    "ats/ax/fuzzy-ax",      # CGO library for Go, not part of Rust ecosystem
]

[workspace.package]
version = "0.2.44"
edition = "2021"
license = "MIT"
repository = "https://github.com/teranos/QNTX"

[workspace.lints.rust]
# An unsafe fn body is not one big unsafe block: each operation answers for
# its own contract, which is what an FFI crate owes its caller.
unsafe_op_in_unsafe_fn = "deny"
# A discarded #[must_use] is a failure becoming a plausible value.
unused_must_use = "deny"

[workspace.lints.clippy]
# The two that panic. A panic already says where it happened.
unwrap_used = "deny"
expect_used = "deny"

# The ones that do not panic. A failure becomes a plausible value and the
# program carries on, which is the shape that costs a day to find.
let_underscore_must_use = "deny"   # let _ = <Result>
map_err_ignore = "deny"            # .map_err(|_| …) — the cause thrown away
unwrap_in_result = "deny"          # unwrap inside a fn that could have returned Err

# The remaining explicit ways to panic. These crates are loaded into the Go
# server over FFI, where a panic unwinding out of extern "C" aborts the whole
# node.
panic = "deny"
todo = "deny"
unimplemented = "deny"

# The implicit panics: s[a..b] and v[i] panic where get() answers, and
# byte-slicing UTF-8 can split a rune — the classes that carried real bugs on
# the Go side (an ID sliced shorter than its slice; a sample cut mid-rune
# into a persisted attestation). Tests keep them via each crate's
# cfg_attr(test, allow(...)) header: a fixture index that misses is the test
# failing loudly, which is its job.
indexing_slicing = "deny"
string_slice = "deny"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
parking_lot = "0.12"
