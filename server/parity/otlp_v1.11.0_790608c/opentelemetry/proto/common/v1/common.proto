syntax = "proto3";

package opentelemetry.proto.common.v1;

option csharp_namespace = "OpenTelemetry.Proto.Common.V1";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.common.v1";
option java_outer_classname = "CommonProto";
option go_package = "go.opentelemetry.io/proto/otlp/common/v1";

// 「[Fable 5.1] Represents any type of attribute value. AnyValue may contain a」
// 「[Fable 5.1] primitive value such as a string or integer or it may contain an arbitrary nested」
// 「[Fable 5.1] object containing arrays, key-value lists and primitives.」
message AnyValue {
  // 「[Fable 5.1] The value is one of the listed fields. It is valid for all values to be unspecified」
  // 「[Fable 5.1] in which case this AnyValue is considered to be "empty".」
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
    // 「[Fable 5.1] Reference to the string value in ProfilesDictionary.string_table.」
    //
    // 「[Fable 5.1] Note: This is currently used exclusively in the Profiling signal.」
    // 「[Fable 5.1] Implementers of OTLP receivers for signals other than Profiling should」
    // 「[Fable 5.1] treat the presence of this value as a non-fatal issue.」
    // 「[Fable 5.1] Log an error or warning indicating an unexpected field intended for the」
    // 「[Fable 5.1] Profiling signal and process the data as if this value were absent or」
    // 「[Fable 5.1] empty, ignoring its semantic content for the non-Profiling signal.」
    //
    // 「[Fable 5.1] Status: [Alpha]」
    int32 string_value_strindex = 8;
  }
}

// 「[Fable 5.1] ArrayValue is a list of AnyValue messages. We need ArrayValue as a message」
// 「[Fable 5.1] since oneof in AnyValue does not allow repeated fields.」
message ArrayValue {
  // 「[Fable 5.1] Array of values. The array may be empty (contain 0 elements).」
  repeated AnyValue values = 1;
}

// 「[Fable 5.1] KeyValueList is a list of KeyValue messages. We need KeyValueList as a message」
// 「[Fable 5.1] since `oneof` in AnyValue does not allow repeated fields. Everywhere else where we need」
// 「[Fable 5.1] a list of KeyValue messages (e.g. in Span) we use `repeated KeyValue` directly to」
// 「[Fable 5.1] avoid unnecessary extra wrapping (which slows down the protocol). The 2 approaches」
// 「[Fable 5.1] are semantically equivalent.」
message KeyValueList {
  // 「[Fable 5.1] A collection of key/value pairs of key-value pairs. The list may be empty (may」
  // 「[Fable 5.1] contain 0 elements).」
  //
  // 「[Fable 5.1] The keys MUST be unique (it is not allowed to have more than one」
  // 「[Fable 5.1] value with the same key).」
  // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
  repeated KeyValue values = 1;
}

// 「[Fable 5.1] Represents a key-value pair that is used to store Span attributes, Link」
// 「[Fable 5.1] attributes, etc.」
message KeyValue {
  // 「[Fable 5.1] The key name of the pair.」
  // 「[Fable 5.1] key_strindex MUST NOT be set if key is used.」
  string key = 1;

  // 「[Fable 5.1] The value of the pair.」
  AnyValue value = 2;

  // 「[Fable 5.1] Reference to the string key in ProfilesDictionary.string_table.」
  // 「[Fable 5.1] key MUST NOT be set if key_strindex is used.」
  //
  // 「[Fable 5.1] Note: This is currently used exclusively in the Profiling signal.」
  // 「[Fable 5.1] Implementers of OTLP receivers for signals other than Profiling should」
  // 「[Fable 5.1] treat the presence of this key as a non-fatal issue.」
  // 「[Fable 5.1] Log an error or warning indicating an unexpected field intended for the」
  // 「[Fable 5.1] Profiling signal and process the data as if this value were absent or」
  // 「[Fable 5.1] empty, ignoring its semantic content for the non-Profiling signal.」
  //
  // 「[Fable 5.1] Status: [Alpha]」
  int32 key_strindex = 3;
}

// 「[Fable 5.1] InstrumentationScope is a message representing the instrumentation scope information」
// 「[Fable 5.1] such as the fully qualified name and version.」
message InstrumentationScope {
  // 「[Fable 5.1] A name denoting the Instrumentation scope.」
  // 「[Fable 5.1] An empty instrumentation scope name means the name is unknown.」
  string name = 1;

  // 「[Fable 5.1] Defines the version of the instrumentation scope.」
  // 「[Fable 5.1] An empty instrumentation scope version means the version is unknown.」
  string version = 2;

  // 「[Fable 5.1] Additional attributes that describe the scope. [Optional].」
  // 「[Fable 5.1] Attribute keys MUST be unique (it is not allowed to have more than one」
  // 「[Fable 5.1] attribute with the same key).」
  // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
  repeated KeyValue attributes = 3;

  // 「[Fable 5.1] The number of attributes that were discarded. Attributes」
  // 「[Fable 5.1] can be discarded because their keys are too long or because there are too many」
  // 「[Fable 5.1] attributes. If this value is 0, then no attributes were dropped.」
  uint32 dropped_attributes_count = 4;
}

// 「[Fable 5.1] A reference to an Entity.」
// 「[Fable 5.1] Entity represents an object of interest associated with produced telemetry: e.g spans, metrics, profiles, or logs.」
//
// 「[Fable 5.1] Status: [Development]」
message EntityRef {
  // 「[Fable 5.1] The Schema URL, if known. This is the identifier of the Schema that the entity data」
  // 「[Fable 5.1] is recorded in. To learn more about Schema URL see」
  // 「[Fable 5.1] https://opentelemetry.io/docs/specs/otel/schemas/#schema-url」
  //
  // 「[Fable 5.1] This schema_url applies to the data in this message and to the Resource attributes」
  // 「[Fable 5.1] referenced by id_keys and description_keys.」
  // 「[Fable 5.1] TODO: discuss if we are happy with this somewhat complicated definition of what」
  // 「[Fable 5.1] the schema_url applies to.」
  //
  // 「[Fable 5.1] This field obsoletes the schema_url field in ResourceMetrics/ResourceSpans/ResourceLogs.」
  string schema_url = 1;

  // 「[Fable 5.1] Defines the type of the entity. MUST not change during the lifetime of the entity.」
  // 「[Fable 5.1] For example: "service" or "host". This field is required and MUST not be empty」
  // 「[Fable 5.1] for valid entities.」
  string type = 2;

  // 「[Fable 5.1] Attribute Keys that identify the entity.」
  // 「[Fable 5.1] MUST not change during the lifetime of the entity. The Id must contain at least one attribute.」
  // 「[Fable 5.1] These keys MUST exist in the containing {message}.attributes.」
  repeated string id_keys = 3;

  // 「[Fable 5.1] Descriptive (non-identifying) attribute keys of the entity.」
  // 「[Fable 5.1] MAY change over the lifetime of the entity. MAY be empty.」
  // 「[Fable 5.1] These attribute keys are not part of entity's identity.」
  // 「[Fable 5.1] These keys MUST exist in the containing {message}.attributes.」
  repeated string description_keys = 4;
}