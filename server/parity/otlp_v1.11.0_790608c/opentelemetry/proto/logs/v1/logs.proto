syntax = "proto3";

package opentelemetry.proto.logs.v1;

import "opentelemetry/proto/common/v1/common.proto";
import "opentelemetry/proto/resource/v1/resource.proto";

option csharp_namespace = "OpenTelemetry.Proto.Logs.V1";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.logs.v1";
option java_outer_classname = "LogsProto";
option go_package = "go.opentelemetry.io/proto/otlp/logs/v1";

// 「[Fable 5.1] LogsData represents the logs data that can be stored in a persistent storage,」
// 「[Fable 5.1] OR can be embedded by other protocols that transfer OTLP logs data but do not」
// 「[Fable 5.1] implement the OTLP protocol.」
//
// 「[Fable 5.1] The main difference between this message and collector protocol is that」
// 「[Fable 5.1] in this message there will not be any "control" or "metadata" specific to」
// 「[Fable 5.1] OTLP protocol.」
//
// 「[Fable 5.1] When new fields are added into this message, the OTLP request MUST be updated」
// 「[Fable 5.1] as well.」
message LogsData {
  // 「[Fable 5.1] An array of ResourceLogs.」
  // 「[Fable 5.1] For data coming from a single resource this array will typically contain」
  // 「[Fable 5.1] one element. Intermediary nodes that receive data from multiple origins」
  // 「[Fable 5.1] typically batch the data before forwarding further and in that case this」
  // 「[Fable 5.1] array will contain multiple elements.」
  repeated ResourceLogs resource_logs = 1;
}

// 「[Fable 5.1] A collection of ScopeLogs from a Resource.」
message ResourceLogs {
  reserved 1000;

  // 「[Fable 5.1] The resource for the logs in this message.」
  // 「[Fable 5.1] If this field is not set then resource info is unknown.」
  opentelemetry.proto.resource.v1.Resource resource = 1;

  // 「[Fable 5.1] A list of ScopeLogs that originate from a resource.」
  repeated ScopeLogs scope_logs = 2;

  // 「[Fable 5.1] The Schema URL, if known. This is the identifier of the Schema that the resource data」
  // 「[Fable 5.1] is recorded in. Notably, the last part of the URL path is the version number of the」
  // 「[Fable 5.1] schema: http[s]://server[:port]/path/<version>. To learn more about Schema URL see」
  // 「[Fable 5.1] https://opentelemetry.io/docs/specs/otel/schemas/#schema-url」
  // 「[Fable 5.1] This schema_url applies to the data in the "resource" field. It does not apply」
  // 「[Fable 5.1] to the data in the "scope_logs" field which have their own schema_url field.」
  string schema_url = 3;
}

// 「[Fable 5.1] A collection of Logs produced by a Scope.」
message ScopeLogs {
  // 「[Fable 5.1] The instrumentation scope information for the logs in this message.」
  // 「[Fable 5.1] Semantically when InstrumentationScope isn't set, it is equivalent with」
  // 「[Fable 5.1] an empty instrumentation scope name (unknown).」
  opentelemetry.proto.common.v1.InstrumentationScope scope = 1;

  // 「[Fable 5.1] A list of log records.」
  repeated LogRecord log_records = 2;

  // 「[Fable 5.1] The Schema URL, if known. This is the identifier of the Schema that the log data」
  // 「[Fable 5.1] is recorded in. Notably, the last part of the URL path is the version number of the」
  // 「[Fable 5.1] schema: http[s]://server[:port]/path/<version>. To learn more about Schema URL see」
  // 「[Fable 5.1] https://opentelemetry.io/docs/specs/otel/schemas/#schema-url」
  // 「[Fable 5.1] This schema_url applies to the data in the "scope" field and all logs in the」
  // 「[Fable 5.1] "log_records" field.」
  string schema_url = 3;
}

// 「[Fable 5.1] Possible values for LogRecord.SeverityNumber.」
enum SeverityNumber {
  SEVERITY_NUMBER_UNSPECIFIED = 0;
  SEVERITY_NUMBER_TRACE  = 1;
  SEVERITY_NUMBER_TRACE2 = 2;
  SEVERITY_NUMBER_TRACE3 = 3;
  SEVERITY_NUMBER_TRACE4 = 4;
  SEVERITY_NUMBER_DEBUG  = 5;
  SEVERITY_NUMBER_DEBUG2 = 6;
  SEVERITY_NUMBER_DEBUG3 = 7;
  SEVERITY_NUMBER_DEBUG4 = 8;
  SEVERITY_NUMBER_INFO   = 9;
  SEVERITY_NUMBER_INFO2  = 10;
  SEVERITY_NUMBER_INFO3  = 11;
  SEVERITY_NUMBER_INFO4  = 12;
  SEVERITY_NUMBER_WARN   = 13;
  SEVERITY_NUMBER_WARN2  = 14;
  SEVERITY_NUMBER_WARN3  = 15;
  SEVERITY_NUMBER_WARN4  = 16;
  SEVERITY_NUMBER_ERROR  = 17;
  SEVERITY_NUMBER_ERROR2 = 18;
  SEVERITY_NUMBER_ERROR3 = 19;
  SEVERITY_NUMBER_ERROR4 = 20;
  SEVERITY_NUMBER_FATAL  = 21;
  SEVERITY_NUMBER_FATAL2 = 22;
  SEVERITY_NUMBER_FATAL3 = 23;
  SEVERITY_NUMBER_FATAL4 = 24;
}

// 「[Fable 5.1] LogRecordFlags represents constants used to interpret the」
// 「[Fable 5.1] LogRecord.flags field, which is protobuf 'fixed32' type and is to」
// 「[Fable 5.1] be used as bit-fields. Each non-zero value defined in this enum is」
// 「[Fable 5.1] a bit-mask.  To extract the bit-field, for example, use an」
// 「[Fable 5.1] expression like:」
//
//   「[Fable 5.1] (logRecord.flags & LOG_RECORD_FLAGS_TRACE_FLAGS_MASK)」
//
enum LogRecordFlags {
  // 「[Fable 5.1] The zero value for the enum. Should not be used for comparisons.」
  // 「[Fable 5.1] Instead use bitwise "and" with the appropriate mask as shown above.」
  LOG_RECORD_FLAGS_DO_NOT_USE = 0;

  // 「[Fable 5.1] Bits 0-7 are used for trace flags.」
  LOG_RECORD_FLAGS_TRACE_FLAGS_MASK = 0x000000FF;

  // 「[Fable 5.1] Bits 8-31 are reserved for future use.」
}

// 「[Fable 5.1] A log record according to OpenTelemetry Log Data Model:」
// 「[Fable 5.1] https://github.com/open-telemetry/oteps/blob/main/text/logs/0097-log-data-model.md」
message LogRecord {
  reserved 4;

  // 「[Fable 5.1] time_unix_nano is the time when the event occurred.」
  // 「[Fable 5.1] Value is UNIX Epoch time in nanoseconds since 00:00:00 UTC on 1 January 1970.」
  // 「[Fable 5.1] Value of 0 indicates unknown or missing timestamp.」
  fixed64 time_unix_nano = 1;

  // 「[Fable 5.1] Time when the event was observed by the collection system.」
  // 「[Fable 5.1] For events that originate in OpenTelemetry (e.g. using OpenTelemetry Logging SDK)」
  // 「[Fable 5.1] this timestamp is typically set at the generation time and is equal to Timestamp.」
  // 「[Fable 5.1] For events originating externally and collected by OpenTelemetry (e.g. using」
  // 「[Fable 5.1] Collector) this is the time when OpenTelemetry's code observed the event measured」
  // 「[Fable 5.1] by the clock of the OpenTelemetry code. This field MUST be set once the event is」
  // 「[Fable 5.1] observed by OpenTelemetry.」
  //
  // 「[Fable 5.1] For converting OpenTelemetry log data to formats that support only one timestamp or」
  // 「[Fable 5.1] when receiving OpenTelemetry log data by recipients that support only one timestamp」
  // 「[Fable 5.1] internally the following logic is recommended:」
  //   「[Fable 5.1] - Use time_unix_nano if it is present, otherwise use observed_time_unix_nano.」
  //
  // 「[Fable 5.1] Value is UNIX Epoch time in nanoseconds since 00:00:00 UTC on 1 January 1970.」
  // 「[Fable 5.1] Value of 0 indicates unknown or missing timestamp.」
  fixed64 observed_time_unix_nano = 11;

  // 「[Fable 5.1] Numerical value of the severity, normalized to values described in Log Data Model.」
  // 「[Fable 5.1] [Optional].」
  SeverityNumber severity_number = 2;

  // 「[Fable 5.1] The severity text (also known as log level). The original string representation as」
  // 「[Fable 5.1] it is known at the source. [Optional].」
  string severity_text = 3;

  // 「[Fable 5.1] A value containing the body of the log record. Can be for example a human-readable」
  // 「[Fable 5.1] string message (including multi-line) describing the event in a free form or it can」
  // 「[Fable 5.1] be a structured data composed of arrays and maps of other values. [Optional].」
  opentelemetry.proto.common.v1.AnyValue body = 5;

  // 「[Fable 5.1] Additional attributes that describe the specific event occurrence. [Optional].」
  // 「[Fable 5.1] Attribute keys MUST be unique (it is not allowed to have more than one」
  // 「[Fable 5.1] attribute with the same key).」
  // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
  repeated opentelemetry.proto.common.v1.KeyValue attributes = 6;
  uint32 dropped_attributes_count = 7;

  // 「[Fable 5.1] Flags, a bit field. 8 least significant bits are the trace flags as」
  // 「[Fable 5.1] defined in W3C Trace Context specification. 24 most significant bits are reserved」
  // 「[Fable 5.1] and must be set to 0. Readers must not assume that 24 most significant bits」
  // 「[Fable 5.1] will be zero and must correctly mask the bits when reading 8-bit trace flag (use」
  // 「[Fable 5.1] flags & LOG_RECORD_FLAGS_TRACE_FLAGS_MASK). [Optional].」
  fixed32 flags = 8;

  // 「[Fable 5.1] A unique identifier for a trace. All logs from the same trace share」
  // 「[Fable 5.1] the same `trace_id`. The ID is a 16-byte array. An ID with all zeroes OR」
  // 「[Fable 5.1] of length other than 16 bytes is considered invalid (empty string in OTLP/JSON」
  // 「[Fable 5.1] is zero-length and thus is also invalid).」
  //
  // 「[Fable 5.1] This field is optional.」
  //
  // 「[Fable 5.1] The receivers SHOULD assume that the log record is not associated with a」
  // 「[Fable 5.1] trace if any of the following is true:」
  //   「[Fable 5.1] - the field is not present,」
  //   「[Fable 5.1] - the field contains an invalid value.」
  bytes trace_id = 9;

  // 「[Fable 5.1] A unique identifier for a span within a trace, assigned when the span」
  // 「[Fable 5.1] is created. The ID is an 8-byte array. An ID with all zeroes OR of length」
  // 「[Fable 5.1] other than 8 bytes is considered invalid (empty string in OTLP/JSON」
  // 「[Fable 5.1] is zero-length and thus is also invalid).」
  //
  // 「[Fable 5.1] This field is optional. If the sender specifies a valid span_id then it SHOULD also」
  // 「[Fable 5.1] specify a valid trace_id.」
  //
  // 「[Fable 5.1] The receivers SHOULD assume that the log record is not associated with a」
  // 「[Fable 5.1] span if any of the following is true:」
  //   「[Fable 5.1] - the field is not present,」
  //   「[Fable 5.1] - the field contains an invalid value.」
  bytes span_id = 10;

  // 「[Fable 5.1] A unique identifier of event category/type.」
  // 「[Fable 5.1] All events with the same event_name are expected to conform to the same」
  // 「[Fable 5.1] schema for both their attributes and their body.」
  //
  // 「[Fable 5.1] Recommended to be fully qualified and short (no longer than 256 characters).」
  //
  // 「[Fable 5.1] Presence of event_name on the log record identifies this record」
  // 「[Fable 5.1] as an event.」
  //
  // 「[Fable 5.1] [Optional].」
  string event_name = 12;
}
