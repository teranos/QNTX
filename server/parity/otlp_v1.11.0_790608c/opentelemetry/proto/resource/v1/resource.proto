syntax = "proto3";

package opentelemetry.proto.resource.v1;

import "opentelemetry/proto/common/v1/common.proto";

option csharp_namespace = "OpenTelemetry.Proto.Resource.V1";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.resource.v1";
option java_outer_classname = "ResourceProto";
option go_package = "go.opentelemetry.io/proto/otlp/resource/v1";

// 「[Fable 5.1] Resource information.」
message Resource {
  // 「[Fable 5.1] Set of attributes that describe the resource.」
  // 「[Fable 5.1] Attribute keys MUST be unique (it is not allowed to have more than one」
  // 「[Fable 5.1] attribute with the same key).」
  // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
  repeated opentelemetry.proto.common.v1.KeyValue attributes = 1;

  // 「[Fable 5.1] The number of dropped attributes. If the value is 0, then」
  // 「[Fable 5.1] no attributes were dropped.」
  uint32 dropped_attributes_count = 2;

  // 「[Fable 5.1] Set of entities that participate in this Resource.」
  //
  // 「[Fable 5.1] Note: keys in the references MUST exist in attributes of this message.」
  //
  // 「[Fable 5.1] Status: [Development]」
  repeated opentelemetry.proto.common.v1.EntityRef entity_refs = 3;
}
