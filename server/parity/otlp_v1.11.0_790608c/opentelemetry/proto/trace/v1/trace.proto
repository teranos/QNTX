syntax = "proto3";

package opentelemetry.proto.trace.v1;

import "opentelemetry/proto/common/v1/common.proto";
import "opentelemetry/proto/resource/v1/resource.proto";

option csharp_namespace = "OpenTelemetry.Proto.Trace.V1";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.trace.v1";
option java_outer_classname = "TraceProto";
option go_package = "go.opentelemetry.io/proto/otlp/trace/v1";

// 「[Fable 5.1] TracesData represents the traces data that can be stored in a persistent storage,」
// 「[Fable 5.1] OR can be embedded by other protocols that transfer OTLP traces data but do」
// 「[Fable 5.1] not implement the OTLP protocol.」
//
// 「[Fable 5.1] The main difference between this message and collector protocol is that」
// 「[Fable 5.1] in this message there will not be any "control" or "metadata" specific to」
// 「[Fable 5.1] OTLP protocol.」
//
// 「[Fable 5.1] When new fields are added into this message, the OTLP request MUST be updated」
// 「[Fable 5.1] as well.」
message TracesData {
  // 「[Fable 5.1] An array of ResourceSpans.」
  // 「[Fable 5.1] For data coming from a single resource this array will typically contain」
  // 「[Fable 5.1] one element. Intermediary nodes that receive data from multiple origins」
  // 「[Fable 5.1] typically batch the data before forwarding further and in that case this」
  // 「[Fable 5.1] array will contain multiple elements.」
  repeated ResourceSpans resource_spans = 1;
}

// 「[Fable 5.1] A collection of ScopeSpans from a Resource.」
message ResourceSpans {
  reserved 1000;

  // 「[Fable 5.1] The resource for the spans in this message.」
  // 「[Fable 5.1] If this field is not set then no resource info is known.」
  opentelemetry.proto.resource.v1.Resource resource = 1;

  // 「[Fable 5.1] A list of ScopeSpans that originate from a resource.」
  repeated ScopeSpans scope_spans = 2;

  // 「[Fable 5.1] The Schema URL, if known. This is the identifier of the Schema that the resource data」
  // 「[Fable 5.1] is recorded in. Notably, the last part of the URL path is the version number of the」
  // 「[Fable 5.1] schema: http[s]://server[:port]/path/<version>. To learn more about Schema URL see」
  // 「[Fable 5.1] https://opentelemetry.io/docs/specs/otel/schemas/#schema-url」
  // 「[Fable 5.1] This schema_url applies to the data in the "resource" field. It does not apply」
  // 「[Fable 5.1] to the data in the "scope_spans" field which have their own schema_url field.」
  string schema_url = 3;
}

// 「[Fable 5.1] A collection of Spans produced by an InstrumentationScope.」
message ScopeSpans {
  // 「[Fable 5.1] The instrumentation scope information for the spans in this message.」
  // 「[Fable 5.1] Semantically when InstrumentationScope isn't set, it is equivalent with」
  // 「[Fable 5.1] an empty instrumentation scope name (unknown).」
  opentelemetry.proto.common.v1.InstrumentationScope scope = 1;

  // 「[Fable 5.1] A list of Spans that originate from an instrumentation scope.」
  repeated Span spans = 2;

  // 「[Fable 5.1] The Schema URL, if known. This is the identifier of the Schema that the span data」
  // 「[Fable 5.1] is recorded in. Notably, the last part of the URL path is the version number of the」
  // 「[Fable 5.1] schema: http[s]://server[:port]/path/<version>. To learn more about Schema URL see」
  // 「[Fable 5.1] https://opentelemetry.io/docs/specs/otel/schemas/#schema-url」
  // 「[Fable 5.1] This schema_url applies to the data in the "scope" field and all spans and span」
  // 「[Fable 5.1] events in the "spans" field.」
  string schema_url = 3;
}

// 「[Fable 5.1] A Span represents a single operation performed by a single component of the system.」
//
// 「[Fable 5.1] The next available field id is 17.」
message Span {
  // 「[Fable 5.1] A unique identifier for a trace. All spans from the same trace share」
  // 「[Fable 5.1] the same `trace_id`. The ID is a 16-byte array. An ID with all zeroes OR」
  // 「[Fable 5.1] of length other than 16 bytes is considered invalid (empty string in OTLP/JSON」
  // 「[Fable 5.1] is zero-length and thus is also invalid).」
  //
  // 「[Fable 5.1] This field is required.」
  bytes trace_id = 1;

  // 「[Fable 5.1] A unique identifier for a span within a trace, assigned when the span」
  // 「[Fable 5.1] is created. The ID is an 8-byte array. An ID with all zeroes OR of length」
  // 「[Fable 5.1] other than 8 bytes is considered invalid (empty string in OTLP/JSON」
  // 「[Fable 5.1] is zero-length and thus is also invalid).」
  //
  // 「[Fable 5.1] This field is required.」
  bytes span_id = 2;

  // 「[Fable 5.1] trace_state conveys information about request position in multiple distributed tracing graphs.」
  // 「[Fable 5.1] It is a trace_state in w3c-trace-context format: https://www.w3.org/TR/trace-context/#tracestate-header」
  // 「[Fable 5.1] See also https://github.com/w3c/distributed-tracing for more details about this field.」
  string trace_state = 3;

  // 「[Fable 5.1] The `span_id` of this span's parent span. If this is a root span, then this」
  // 「[Fable 5.1] field must be empty. The ID is an 8-byte array.」
  bytes parent_span_id = 4;

  // 「[Fable 5.1] Flags, a bit field.」
  //
  // 「[Fable 5.1] Bits 0-7 (8 least significant bits) are the trace flags as defined in W3C Trace」
  // 「[Fable 5.1] Context specification. To read the 8-bit W3C trace flag, use」
  // 「[Fable 5.1] `flags & SPAN_FLAGS_TRACE_FLAGS_MASK`.」
  //
  // 「[Fable 5.1] See https://www.w3.org/TR/trace-context-2/#trace-flags for the flag definitions.」
  //
  // 「[Fable 5.1] Bits 8 and 9 represent the 3 states of whether a span's parent」
  // 「[Fable 5.1] is remote. The states are (unknown, is not remote, is remote).」
  // 「[Fable 5.1] To read whether the value is known, use `(flags & SPAN_FLAGS_CONTEXT_HAS_IS_REMOTE_MASK) != 0`.」
  // 「[Fable 5.1] To read whether the span is remote, use `(flags & SPAN_FLAGS_CONTEXT_IS_REMOTE_MASK) != 0`.」
  //
  // 「[Fable 5.1] When creating span messages, if the message is logically forwarded from another source」
  // 「[Fable 5.1] with an equivalent flags fields (i.e., usually another OTLP span message), the field SHOULD」
  // 「[Fable 5.1] be copied as-is. If creating from a source that does not have an equivalent flags field」
  // 「[Fable 5.1] (such as a runtime representation of an OpenTelemetry span), the high 22 bits MUST」
  // 「[Fable 5.1] be set to zero.」
  // 「[Fable 5.1] Readers MUST NOT assume that bits 10-31 (22 most significant bits) will be zero.」
  //
  // 「[Fable 5.1] [Optional].」
  fixed32 flags = 16;

  // 「[Fable 5.1] A description of the span's operation.」
  //
  // 「[Fable 5.1] For example, the name can be a qualified method name or a file name」
  // 「[Fable 5.1] and a line number where the operation is called. A best practice is to use」
  // 「[Fable 5.1] the same display name at the same call point in an application.」
  // 「[Fable 5.1] This makes it easier to correlate spans in different traces.」
  //
  // 「[Fable 5.1] This field is semantically required to be set to non-empty string.」
  // 「[Fable 5.1] Empty value is equivalent to an unknown span name.」
  //
  // 「[Fable 5.1] This field is required.」
  string name = 5;

  // 「[Fable 5.1] SpanKind is the type of span. Can be used to specify additional relationships between spans」
  // 「[Fable 5.1] in addition to a parent/child relationship.」
  enum SpanKind {
    // 「[Fable 5.1] Unspecified. Do NOT use as default.」
    // 「[Fable 5.1] Implementations MAY assume SpanKind to be INTERNAL when receiving UNSPECIFIED.」
    SPAN_KIND_UNSPECIFIED = 0;

    // 「[Fable 5.1] Indicates that the span represents an internal operation within an application,」
    // 「[Fable 5.1] as opposed to an operation happening at the boundaries. Default value.」
    SPAN_KIND_INTERNAL = 1;

    // 「[Fable 5.1] Indicates that the span covers server-side handling of an RPC or other」
    // 「[Fable 5.1] remote network request.」
    SPAN_KIND_SERVER = 2;

    // 「[Fable 5.1] Indicates that the span describes a request to some remote service.」
    SPAN_KIND_CLIENT = 3;

    // 「[Fable 5.1] Indicates that the span describes a producer sending a message to a broker.」
    // 「[Fable 5.1] Unlike CLIENT and SERVER, there is often no direct critical path latency relationship」
    // 「[Fable 5.1] between producer and consumer spans. A PRODUCER span ends when the message was accepted」
    // 「[Fable 5.1] by the broker while the logical processing of the message might span a much longer time.」
    SPAN_KIND_PRODUCER = 4;

    // 「[Fable 5.1] Indicates that the span describes consumer receiving a message from a broker.」
    // 「[Fable 5.1] Like the PRODUCER kind, there is often no direct critical path latency relationship」
    // 「[Fable 5.1] between producer and consumer spans.」
    SPAN_KIND_CONSUMER = 5;
  }

  // 「[Fable 5.1] Distinguishes between spans generated in a particular context. For example,」
  // 「[Fable 5.1] two spans with the same name may be distinguished using `CLIENT` (caller)」
  // 「[Fable 5.1] and `SERVER` (callee) to identify queueing latency associated with the span.」
  SpanKind kind = 6;

  // 「[Fable 5.1] The start time of the span. On the client side, this is the time」
  // 「[Fable 5.1] kept by the local machine where the span execution starts. On the server side, this」
  // 「[Fable 5.1] is the time when the server's application handler starts running.」
  // 「[Fable 5.1] Value is UNIX Epoch time in nanoseconds since 00:00:00 UTC on 1 January 1970.」
  //
  // 「[Fable 5.1] This field is semantically required and it is expected that end_time >= start_time.」
  fixed64 start_time_unix_nano = 7;

  // 「[Fable 5.1] The end time of the span. On the client side, this is the time」
  // 「[Fable 5.1] kept by the local machine where the span execution ends. On the server side, this」
  // 「[Fable 5.1] is the time when the server application handler stops running.」
  // 「[Fable 5.1] Value is UNIX Epoch time in nanoseconds since 00:00:00 UTC on 1 January 1970.」
  //
  // 「[Fable 5.1] This field is semantically required and it is expected that end_time >= start_time.」
  fixed64 end_time_unix_nano = 8;

  // 「[Fable 5.1] A collection of key/value pairs. Note, global attributes」
  // 「[Fable 5.1] like server name can be set using the resource API. Examples of attributes:」
  //
  //     「[Fable 5.1] "/http/user_agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_2) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36"」
  //     「[Fable 5.1] "/http/server_latency": 300」
  //     「[Fable 5.1] "example.com/myattribute": true」
  //     「[Fable 5.1] "example.com/score": 10.239」
  //
  // 「[Fable 5.1] Attribute keys MUST be unique (it is not allowed to have more than one」
  // 「[Fable 5.1] attribute with the same key).」
  // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
  repeated opentelemetry.proto.common.v1.KeyValue attributes = 9;

  // 「[Fable 5.1] The number of attributes that were discarded. Attributes」
  // 「[Fable 5.1] can be discarded because their keys are too long or because there are too many」
  // 「[Fable 5.1] attributes. If this value is 0, then no attributes were dropped.」
  uint32 dropped_attributes_count = 10;

  // 「[Fable 5.1] Event is a time-stamped annotation of the span, consisting of user-supplied」
  // 「[Fable 5.1] text description and key-value pairs.」
  message Event {
    // 「[Fable 5.1] The time the event occurred.」
    fixed64 time_unix_nano = 1;

    // 「[Fable 5.1] The name of the event.」
    // 「[Fable 5.1] This field is semantically required to be set to non-empty string.」
    string name = 2;

    // 「[Fable 5.1] A collection of attribute key/value pairs on the event.」
    // 「[Fable 5.1] Attribute keys MUST be unique (it is not allowed to have more than one」
    // 「[Fable 5.1] attribute with the same key).」
    // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
    repeated opentelemetry.proto.common.v1.KeyValue attributes = 3;

    // 「[Fable 5.1] The number of dropped attributes. If the value is 0,」
    // 「[Fable 5.1] then no attributes were dropped.」
    uint32 dropped_attributes_count = 4;
  }

  // 「[Fable 5.1] A collection of Event items.」
  repeated Event events = 11;

  // 「[Fable 5.1] The number of dropped events. If the value is 0, then no」
  // 「[Fable 5.1] events were dropped.」
  uint32 dropped_events_count = 12;

  // 「[Fable 5.1] A pointer from the current span to another span in the same trace or in a」
  // 「[Fable 5.1] different trace. For example, this can be used in batching operations,」
  // 「[Fable 5.1] where a single batch handler processes multiple requests from different」
  // 「[Fable 5.1] traces or when the handler receives a request from a different project.」
  message Link {
    // 「[Fable 5.1] A unique identifier of a trace that this linked span is part of. The ID is a」
    // 「[Fable 5.1] 16-byte array.」
    bytes trace_id = 1;

    // 「[Fable 5.1] A unique identifier for the linked span. The ID is an 8-byte array.」
    bytes span_id = 2;

    // 「[Fable 5.1] The trace_state associated with the link.」
    string trace_state = 3;

    // 「[Fable 5.1] A collection of attribute key/value pairs on the link.」
    // 「[Fable 5.1] Attribute keys MUST be unique (it is not allowed to have more than one」
    // 「[Fable 5.1] attribute with the same key).」
    // 「[Fable 5.1] The behavior of software that receives duplicated keys can be unpredictable.」
    repeated opentelemetry.proto.common.v1.KeyValue attributes = 4;

    // 「[Fable 5.1] The number of dropped attributes. If the value is 0,」
    // 「[Fable 5.1] then no attributes were dropped.」
    uint32 dropped_attributes_count = 5;

    // 「[Fable 5.1] Flags, a bit field.」
    //
    // 「[Fable 5.1] Bits 0-7 (8 least significant bits) are the trace flags as defined in W3C Trace」
    // 「[Fable 5.1] Context specification. To read the 8-bit W3C trace flag, use」
    // 「[Fable 5.1] `flags & SPAN_FLAGS_TRACE_FLAGS_MASK`.」
    //
    // 「[Fable 5.1] See https://www.w3.org/TR/trace-context-2/#trace-flags for the flag definitions.」
    //
    // 「[Fable 5.1] Bits 8 and 9 represent the 3 states of whether the link is remote.」
    // 「[Fable 5.1] The states are (unknown, is not remote, is remote).」
    // 「[Fable 5.1] To read whether the value is known, use `(flags & SPAN_FLAGS_CONTEXT_HAS_IS_REMOTE_MASK) != 0`.」
    // 「[Fable 5.1] To read whether the link is remote, use `(flags & SPAN_FLAGS_CONTEXT_IS_REMOTE_MASK) != 0`.」
    //
    // 「[Fable 5.1] Readers MUST NOT assume that bits 10-31 (22 most significant bits) will be zero.」
    // 「[Fable 5.1] When creating new spans, bits 10-31 (most-significant 22-bits) MUST be zero.」
    //
    // 「[Fable 5.1] [Optional].」
    fixed32 flags = 6;
  }

  // 「[Fable 5.1] A collection of Links, which are references from this span to a span」
  // 「[Fable 5.1] in the same or different trace.」
  repeated Link links = 13;

  // 「[Fable 5.1] The number of dropped links after the maximum size was」
  // 「[Fable 5.1] enforced. If this value is 0, then no links were dropped.」
  uint32 dropped_links_count = 14;

  // 「[Fable 5.1] An optional final status for this span. Semantically when Status isn't set, it means」
  // 「[Fable 5.1] span's status code is unset, i.e. assume STATUS_CODE_UNSET (code = 0).」
  Status status = 15;
}

// 「[Fable 5.1] The Status type defines a logical error model that is suitable for different」
// 「[Fable 5.1] programming environments, including REST APIs and RPC APIs.」
message Status {
  reserved 1;

  // 「[Fable 5.1] A developer-facing human readable error message.」
  string message = 2;

  // 「[Fable 5.1] For the semantics of status codes see」
  // 「[Fable 5.1] https://github.com/open-telemetry/opentelemetry-specification/blob/main/specification/trace/api.md#set-status」
  enum StatusCode {
    // 「[Fable 5.1] The default status.」
    STATUS_CODE_UNSET               = 0;
    // 「[Fable 5.1] The Span has been validated by an Application developer or Operator to」
    // 「[Fable 5.1] have completed successfully.」
    STATUS_CODE_OK                  = 1;
    // 「[Fable 5.1] The Span contains an error.」
    STATUS_CODE_ERROR               = 2;
  };

  // 「[Fable 5.1] The status code.」
  StatusCode code = 3;
}

// 「[Fable 5.1] SpanFlags represents constants used to interpret the」
// 「[Fable 5.1] Span.flags field, which is protobuf 'fixed32' type and is to」
// 「[Fable 5.1] be used as bit-fields. Each non-zero value defined in this enum is」
// 「[Fable 5.1] a bit-mask.  To extract the bit-field, for example, use an」
// 「[Fable 5.1] expression like:」
//
//   「[Fable 5.1] (span.flags & SPAN_FLAGS_TRACE_FLAGS_MASK)」
//
// 「[Fable 5.1] See https://www.w3.org/TR/trace-context-2/#trace-flags for the flag definitions.」
//
// 「[Fable 5.1] Note that Span flags were introduced in version 1.1 of the」
// 「[Fable 5.1] OpenTelemetry protocol.  Older Span producers do not set this」
// 「[Fable 5.1] field, consequently consumers should not rely on the absence of a」
// 「[Fable 5.1] particular flag bit to indicate the presence of a particular feature.」
enum SpanFlags {
  // 「[Fable 5.1] The zero value for the enum. Should not be used for comparisons.」
  // 「[Fable 5.1] Instead use bitwise "and" with the appropriate mask as shown above.」
  SPAN_FLAGS_DO_NOT_USE = 0;

  // 「[Fable 5.1] Bits 0-7 are used for trace flags.」
  SPAN_FLAGS_TRACE_FLAGS_MASK = 0x000000FF;

  // 「[Fable 5.1] Bits 8 and 9 are used to indicate that the parent span or link span is remote.」
  // 「[Fable 5.1] Bit 8 (`HAS_IS_REMOTE`) indicates whether the value is known.」
  // 「[Fable 5.1] Bit 9 (`IS_REMOTE`) indicates whether the span or link is remote.」
  SPAN_FLAGS_CONTEXT_HAS_IS_REMOTE_MASK = 0x00000100;
  SPAN_FLAGS_CONTEXT_IS_REMOTE_MASK = 0x00000200;

  // 「[Fable 5.1] Bits 10-31 are reserved for future use.」
}
