<!doctype html>
<meta charset="utf-8">
<title>Link an account</title>
<style>
  body { background:#12111a; color:#e6e4ef; font:14px ui-monospace,monospace; margin:0; padding:24px; }
  h1 { font-size:15px; font-weight:normal; opacity:.7; margin:0 0 16px; }
  input, button { font:inherit; padding:8px 10px; border-radius:6px; box-sizing:border-box; }
  input { width:100%; background:rgba(255,255,255,.06); color:#e6e4ef; border:1px solid #5c5488; }
  button { margin-top:12px; width:100%; background:#4a4470; color:#e6e4ef; border:1px solid #5c5488; cursor:pointer; }
  #status { margin-top:16px; white-space:pre-wrap; word-break:break-word; user-select:text; }
  .bad { color:#e06060; }
  .good { color:#2ecc71; }
</style>

<h1>Link a Mastodon account</h1>
<form id="f"><input id="instance" placeholder="chaos.social" autocomplete="off" spellcheck="false"></form>
<button id="go">Continue</button>
<div id="status"></div>

<script type="module">
// The instance issues the token, this page never sees a password, and the
// token is posted once to the node that signs the binding.
const KEY_INSTANCE = 'qntx_link_instance';
const KEY_CLIENT = 'qntx_link_client';
const KEY_PEER = 'qntx_link_peer';
const REDIRECT = location.origin + location.pathname;

const status = document.getElementById('status');
const params = new URLSearchParams(location.search);

function say(text, cls) {
    status.textContent = text;
    status.className = cls ?? '';
}

function fail(text) {
    say(text, 'bad');
}

const peer = params.get('peer');
if (peer) {
    sessionStorage.setItem(KEY_PEER, peer);
}

const code = params.get('code');
if (params.get('error')) {
    fail('authorization refused: ' + params.get('error'));
} else if (code) {
    finish(code);
} else {
    const remembered = sessionStorage.getItem(KEY_INSTANCE);
    if (remembered) {
        document.getElementById('instance').value = remembered;
    }
}

document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); start(); });
document.getElementById('go').addEventListener('click', start);

function normalize(raw) {
    let host = raw.trim().toLowerCase();
    if (host.startsWith('https://')) host = host.slice(8);
    if (host.startsWith('http://')) host = host.slice(7);
    const slash = host.indexOf('/');
    if (slash !== -1) host = host.slice(0, slash);
    return host;
}

async function start() {
    const host = normalize(document.getElementById('instance').value);
    if (!host) {
        fail('an instance host is required');
        return;
    }
    say('registering with ' + host + '...');
    try {
        const body = new FormData();
        body.append('client_name', 'QNTX');
        body.append('redirect_uris', REDIRECT);
        body.append('scopes', 'read:accounts');
        const res = await fetch('https://' + host + '/api/v1/apps', { method: 'POST', body });
        if (!res.ok) {
            fail('registering with ' + host + ' returned HTTP ' + res.status);
            return;
        }
        const app = await res.json();
        sessionStorage.setItem(KEY_INSTANCE, host);
        sessionStorage.setItem(KEY_CLIENT, JSON.stringify(app));
        const q = new URLSearchParams({
            client_id: app.client_id,
            redirect_uri: REDIRECT,
            response_type: 'code',
            scope: 'read:accounts',
        });
        location.href = 'https://' + host + '/oauth/authorize?' + q.toString();
    } catch (e) {
        fail('could not reach ' + host + ': ' + (e instanceof Error ? e.message : String(e)));
    }
}

async function finish(code) {
    const host = sessionStorage.getItem(KEY_INSTANCE);
    const app = JSON.parse(sessionStorage.getItem(KEY_CLIENT) ?? 'null');
    const peerHex = sessionStorage.getItem(KEY_PEER);
    if (!host || !app || !peerHex) {
        fail('the callback arrived without an in-progress ceremony');
        return;
    }

    say('exchanging the code...');
    const form = new FormData();
    form.append('grant_type', 'authorization_code');
    form.append('client_id', app.client_id);
    form.append('client_secret', app.client_secret);
    form.append('redirect_uri', REDIRECT);
    form.append('code', code);
    form.append('scope', 'read:accounts');

    const tokenRes = await fetch('https://' + host + '/oauth/token', { method: 'POST', body: form });
    if (!tokenRes.ok) {
        fail('token exchange returned HTTP ' + tokenRes.status);
        return;
    }
    const { access_token } = await tokenRes.json();

    const who = await fetch('https://' + host + '/api/v1/accounts/verify_credentials', {
        headers: { Authorization: 'Bearer ' + access_token },
    });
    if (!who.ok) {
        fail('verify_credentials returned HTTP ' + who.status);
        return;
    }
    const account = await who.json();

    say('asking this node to sign...');
    const signed = await fetch('/auth/binding/sign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
            peer_pubkey_hex: peerHex,
            provider: 'mastodon',
            canonical_id: account.url,
            handle: '@' + account.username + '@' + host,
            instance: host,
            token: access_token,
        }),
    });
    if (!signed.ok) {
        fail('signing refused (' + signed.status + '): ' + await signed.text());
        return;
    }

    const binding = await signed.json();
    if (window.opener) {
        window.opener.postMessage({ type: 'laye/identity/link', signed: binding }, location.origin);
    }
    say('linked as ' + binding.claim.handle + ' — you can close this window', 'good');
}
</script>
