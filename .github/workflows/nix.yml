{
  "concurrency": {
    "cancel-in-progress": true,
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  "jobs": {
    "build-docker": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Build ${{ matrix.image }}",
          "run": "nix build --show-trace ./ci#${{ matrix.image }}-amd64"
        }
      ],
      "strategy": {
        "matrix": {
          "image": [
            "ci-image"
          ]
        }
      }
    },
    "build-go": {
      "if": "!(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'sbvh-qntx[bot]' && github.head_ref == 'docs-pr')",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Build ${{ matrix.package }}",
          "run": "nix build .#${{ matrix.package }} --show-trace"
        },
        {
          "name": "Push to Cachix",
          "run": "nix build .#${{ matrix.package }} --print-out-paths --no-link | cachix push qntx"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest"
          ],
          "package": [
            "qntx"
          ]
        }
      }
    },
    "lint": {
      "if": "!(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'sbvh-qntx[bot]' && github.head_ref == 'docs-pr')",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Check Nix formatting",
          "run": "nix run nixpkgs#nixpkgs-fmt -- --check *.nix"
        },
        {
          "name": "Run pre-commit checks",
          "run": "nix build --show-trace .#checks.${{ matrix.os == 'ubuntu-latest' && 'x86_64-linux' || 'aarch64-darwin' }}.pre-commit"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest"
          ]
        }
      }
    }
  },
  "name": "Nix",
  "on": {
    "pull_request": {
      "paths": [
        "**.nix",
        "flake.lock",
        ".github/workflows/nix.yml"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  }
}
