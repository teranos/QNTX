{
  "concurrency": {
    "cancel-in-progress": true,
    "group": "${{ github.workflow }}-${{ github.ref }}"
  },
  "jobs": {
    "build": {
      "name": "Go Build",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "go.mod"
          }
        },
        {
          "name": "Cache Go modules",
          "uses": "actions/cache@v4",
          "with": {
            "key": "${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}",
            "path": "~/go/pkg/mod",
            "restore-keys": "${{ runner.os }}-go-\n"
          }
        },
        {
          "name": "Download dependencies",
          "run": "go mod download"
        },
        {
          "name": "Install Rust toolchain",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Cache Rust dependencies",
          "uses": "swatinem/rust-cache@v2"
        },
        {
          "name": "Install wasm-pack",
          "run": "cargo install wasm-pack --locked"
        },
        {
          "name": "Build WASM module",
          "run": "make ats"
        },
        {
          "name": "Build Rust SQLite library",
          "run": "make rust-sqlite"
        },
        {
          "name": "Build",
          "run": "go build ./..."
        }
      ]
    },
    "integration": {
      "name": "Go Integration Tests",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "go.mod"
          }
        },
        {
          "name": "Cache Go modules",
          "uses": "actions/cache@v4",
          "with": {
            "key": "${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}",
            "path": "~/go/pkg/mod",
            "restore-keys": "${{ runner.os }}-go-\n"
          }
        },
        {
          "name": "Download dependencies",
          "run": "go mod download"
        },
        {
          "name": "Install Rust toolchain",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Cache Rust dependencies",
          "uses": "swatinem/rust-cache@v2"
        },
        {
          "name": "Install wasm-pack",
          "run": "cargo install wasm-pack --locked"
        },
        {
          "name": "Build WASM module",
          "run": "make ats"
        },
        {
          "name": "Build Rust SQLite library",
          "run": "make rust-sqlite"
        },
        {
          "name": "Run integration tests",
          "run": "export LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH\ngo test -tags=\"rustsqlite,qntxwasm,integration\" ./...\n"
        }
      ]
    },
    "test": {
      "name": "Go Tests",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Set up Go",
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "go.mod"
          }
        },
        {
          "name": "Cache Go modules",
          "uses": "actions/cache@v4",
          "with": {
            "key": "${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}",
            "path": "~/go/pkg/mod",
            "restore-keys": "${{ runner.os }}-go-\n"
          }
        },
        {
          "name": "Download dependencies",
          "run": "go mod download"
        },
        {
          "name": "Install Rust toolchain",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Cache Rust dependencies",
          "uses": "swatinem/rust-cache@v2"
        },
        {
          "name": "Install wasm-pack",
          "run": "cargo install wasm-pack --locked"
        },
        {
          "name": "Build WASM module",
          "run": "make ats"
        },
        {
          "name": "Build Rust SQLite library",
          "run": "make rust-sqlite"
        },
        {
          "name": "Run tests",
          "run": "export LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH\ngo test -tags \"rustsqlite,qntxwasm\" ./...\n"
        }
      ]
    }
  },
  "name": "Go",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ],
      "paths": [
        "**/*.go",
        "go.mod",
        "go.sum",
        ".github/workflows/go.yml"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "**/*.go",
        "go.mod",
        "go.sum"
      ]
    },
    "workflow_dispatch": null
  }
}
