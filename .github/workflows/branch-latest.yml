{
  "jobs": {
    "build": {
      "permissions": {
        "contents": "write"
      },
      "runs-on": "${{ matrix.runner }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "id": "branch",
          "name": "Compute branch name",
          "run": "# Sanitize the ref for use in a git tag: replace '/' with '-'.\nBRANCH_NAME=\"${GITHUB_REF#refs/heads/}\"\nSAFE_NAME=\"${BRANCH_NAME//\\//-}\"\necho \"name=$SAFE_NAME\" >> $GITHUB_OUTPUT\necho \"tag=branch-${SAFE_NAME}-latest\" >> $GITHUB_OUTPUT\necho \"Branch: $BRANCH_NAME  Tag: branch-${SAFE_NAME}-latest\"\n"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v26",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Build QNTX binary",
          "run": "echo \"Building QNTX for Linux ${{ matrix.arch }}...\"\nnix build .#qntx --print-build-logs\n"
        },
        {
          "name": "Cache binary to Cachix",
          "run": "nix build .#qntx --print-out-paths --no-link | cachix push qntx"
        },
        {
          "name": "Package binary with bundled libduckdb",
          "run": "mkdir -p release/lib\ncp result/bin/qntx release/qntx\nchmod +w release/qntx\nDUCKDB_SO=$(ldd result/bin/qntx | awk '/libduckdb/ {print $3}')\nif [ -z \"$DUCKDB_SO\" ]; then\n  echo \"libduckdb not found in qntx dependencies\"\n  ldd result/bin/qntx\n  exit 1\nfi\ncp -L \"$DUCKDB_SO\" release/lib/\nif [ \"${{ matrix.arch }}\" = \"arm64\" ]; then\n  INTERP=/lib/ld-linux-aarch64.so.1\nelse\n  INTERP=/lib64/ld-linux-x86-64.so.2\nfi\nnix run nixpkgs#patchelf -- \\\n  --set-interpreter \"$INTERP\" \\\n  --set-rpath '$ORIGIN/lib' \\\n  release/qntx\nchmod +x release/qntx\ncd release\ntar -czf qntx-${{ steps.branch.outputs.name }}-linux-${{ matrix.arch }}.tar.gz qntx lib/\nsha256sum qntx-${{ steps.branch.outputs.name }}-linux-${{ matrix.arch }}.tar.gz \\\n  > qntx-${{ steps.branch.outputs.name }}-linux-${{ matrix.arch }}.tar.gz.sha256\n"
        },
        {
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "if": "matrix.arch == 'amd64'",
          "name": "Reset rolling release (first arch only)",
          "run": "gh release delete ${{ steps.branch.outputs.tag }} \\\n  --cleanup-tag --yes 2>/dev/null || true\ngh release create ${{ steps.branch.outputs.tag }} \\\n  --prerelease \\\n  --title \"Branch ${{ steps.branch.outputs.name }} (rolling)\" \\\n  --target ${{ github.sha }} \\\n  --notes \"Rolling pre-release for the tip of \\`${{ steps.branch.outputs.name }}\\`.\n\n**URL scheme (stable across pushes):**\n\\`\\`\\`\nhttps://github.com/teranos/QNTX/releases/download/${{ steps.branch.outputs.tag }}/qntx-${{ steps.branch.outputs.name }}-linux-<arch>.tar.gz\n\\`\\`\\`\n\n**Commit:** \\`${{ github.sha }}\\`\n\nNot a stable release — for deployment tracking only. Use a \\`v*\\` tag for production.\"\n"
        },
        {
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "name": "Upload arch asset to rolling release",
          "run": "gh release upload ${{ steps.branch.outputs.tag }} \\\n  release/qntx-${{ steps.branch.outputs.name }}-linux-${{ matrix.arch }}.tar.gz \\\n  release/qntx-${{ steps.branch.outputs.name }}-linux-${{ matrix.arch }}.tar.gz.sha256 \\\n  --clobber\n"
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "arch": "amd64",
              "runner": "ubuntu-latest"
            },
            {
              "arch": "arm64",
              "runner": "ubuntu-24.04-arm"
            }
          ]
        },
        "max-parallel": 1
      }
    }
  },
  "name": "Branch Latest",
  "on": {
    "push": {
      "branches": [
        "**"
      ]
    },
    "workflow_dispatch": null
  }
}
