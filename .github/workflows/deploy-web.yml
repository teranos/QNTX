{
  "jobs": {
    "build-and-deploy": {
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout QNTX",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ inputs.branch }}",
            "repository": "teranos/QNTX"
          }
        },
        {
          "id": "target",
          "name": "Compute target",
          "run": "BRANCH=\"${{ inputs.branch }}\"\nif [ \"$BRANCH\" = \"main\" ]; then\n  PREFIX=\"\"\n  INVAL=\"/*\"\nelse\n  PREFIX=\"branch/${BRANCH}/\"\n  INVAL=\"/branch/${BRANCH}/*\"\nfi\necho \"prefix=$PREFIX\"      >> \"$GITHUB_OUTPUT\"\necho \"invalidation=$INVAL\" >> \"$GITHUB_OUTPUT\"\necho \"url=https://${{ inputs.static_bucket }}/${PREFIX}\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "id": "rust",
          "name": "Setup Rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Cache wasm build",
          "uses": "actions/cache@v4",
          "with": {
            "key": "target-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'crates/**') }}",
            "path": "target\n~/.cargo/registry/index\n~/.cargo/registry/cache\n~/.cargo/git/db\n"
          }
        },
        {
          "name": "Setup wasm-pack",
          "uses": "jetli/wasm-pack-action@v0.4.0",
          "with": {
            "version": "${{ inputs.wasm_pack_version }}"
          }
        },
        {
          "name": "Setup Bun",
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "${{ inputs.bun_version }}"
          }
        },
        {
          "env": {
            "BACKEND_URL": "${{ inputs.backend_url }}",
            "SENTRY_DSN": "${{ inputs.sentry_dsn }}"
          },
          "name": "Build web bundle",
          "run": "make web"
        },
        {
          "if": "inputs.branch != 'main'",
          "name": "Prefix asset paths for branch bundles",
          "run": "BRANCH=\"${{ inputs.branch }}\"\nsed -i \"s|src=\\\"/|src=\\\"/branch/${BRANCH}/|g; s|href=\\\"/|href=\\\"/branch/${BRANCH}/|g\" \\\n  internal/server/dist/index.html\n"
        },
        {
          "name": "Verify bundle contents",
          "run": "test -f internal/server/dist/index.html || { echo \"index.html missing\"; exit 1; }\ntest -f internal/server/dist/js/main.js || { echo \"js/main.js missing\"; exit 1; }\nfor W in internal/server/dist/js/*.wasm; do\n  test -s \"$W\" || { echo \"empty wasm: $W\"; exit 1; }\ndone\nls -la internal/server/dist/js/\n"
        },
        {
          "name": "Assume deploy role",
          "uses": "aws-actions/configure-aws-credentials@v4",
          "with": {
            "aws-region": "${{ inputs.aws_region }}",
            "role-to-assume": "${{ inputs.deploy_role_arn }}"
          }
        },
        {
          "name": "Sync bundle to S3",
          "run": "PREFIX=\"${{ steps.target.outputs.prefix }}\"\nEXTRA=()\nif [ -z \"$PREFIX\" ]; then\n  EXTRA+=(--exclude \"branch/*\")\nfi\naws s3 sync internal/server/dist/ \"s3://${{ inputs.static_bucket }}/${PREFIX}\" \\\n  --delete \\\n  --cache-control \"public, max-age=300\" \\\n  --exclude \"index.html\" \\\n  \"${EXTRA[@]}\"\naws s3 cp internal/server/dist/index.html \"s3://${{ inputs.static_bucket }}/${PREFIX}index.html\" \\\n  --cache-control \"public, max-age=60, must-revalidate\" \\\n  --content-type \"text/html; charset=utf-8\"\n"
        },
        {
          "name": "Regenerate versions.json",
          "run": "aws s3api list-objects-v2 --bucket \"${{ inputs.static_bucket }}\" \\\n  --prefix \"branch/\" \\\n  --delimiter '/' \\\n  --query 'CommonPrefixes[].Prefix' \\\n  --output json | jq '(. // []) | map(sub(\"^branch/\"; \"\") | rtrimstr(\"/\"))' > versions.json\naws s3 cp versions.json \"s3://${{ inputs.static_bucket }}/versions.json\" \\\n  --cache-control \"public, max-age=60, must-revalidate\" \\\n  --content-type \"application/json\"\n"
        },
        {
          "if": "inputs.branch != 'main'",
          "name": "Register branch in KVS",
          "run": "KVS_ARN=$(aws cloudfront list-key-value-stores \\\n  --query \"KeyValueStoreList.Items[?Name=='${{ inputs.kvs_name }}'] | [0].ARN\" \\\n  --output text)\ntest -n \"$KVS_ARN\" && test \"$KVS_ARN\" != \"None\" || { echo \"no KVS named ${{ inputs.kvs_name }}\"; exit 1; }\nETAG=$(aws cloudfront-keyvaluestore describe-key-value-store \\\n  --kvs-arn \"$KVS_ARN\" \\\n  --query ETag --output text)\naws cloudfront-keyvaluestore put-key \\\n  --kvs-arn \"$KVS_ARN\" \\\n  --key \"${{ inputs.branch }}\" \\\n  --value 1 \\\n  --if-match \"$ETAG\"\n"
        },
        {
          "id": "cf",
          "name": "Resolve CloudFront distribution",
          "run": "DIST_ID=$(aws cloudfront list-distributions \\\n  --query \"DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '${{ inputs.cloudfront_alias }}')] | [0].Id\" \\\n  --output text)\ntest -n \"$DIST_ID\" && test \"$DIST_ID\" != \"None\" || { echo \"no distribution for ${{ inputs.cloudfront_alias }}\"; exit 1; }\necho \"dist_id=$DIST_ID\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Invalidate CloudFront",
          "run": "INVALIDATION_ID=$(aws cloudfront create-invalidation \\\n  --distribution-id \"${{ steps.cf.outputs.dist_id }}\" \\\n  --paths \"${{ steps.target.outputs.invalidation }}\" \"/versions.json\" \\\n  --query 'Invalidation.Id' \\\n  --output text)\naws cloudfront wait invalidation-completed \\\n  --distribution-id \"${{ steps.cf.outputs.dist_id }}\" \\\n  --id \"$INVALIDATION_ID\"\necho \"Invalidation $INVALIDATION_ID completed.\"\n"
        },
        {
          "name": "Summarize",
          "run": "{\n  echo \"## Deploy complete\"\n  echo \"\"\n  echo \"- QNTX branch: ${{ inputs.branch }}\"\n  echo \"- QNTX rev:    $(git rev-parse HEAD)\"\n  echo \"- Bucket:      ${{ inputs.static_bucket }}\"\n  echo \"- Live at:     ${{ steps.target.outputs.url }}\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
        }
      ],
      "timeout-minutes": 20
    }
  },
  "name": "deploy-web",
  "on": {
    "workflow_call": {
      "inputs": {
        "aws_region": {
          "default": "eu-central-1",
          "type": "string"
        },
        "backend_url": {
          "description": "API origin baked into the bundle",
          "required": true,
          "type": "string"
        },
        "branch": {
          "description": "QNTX branch to build and deploy",
          "required": true,
          "type": "string"
        },
        "bun_version": {
          "default": "1.3.3",
          "type": "string"
        },
        "cloudfront_alias": {
          "description": "Distribution alias to resolve and invalidate",
          "required": true,
          "type": "string"
        },
        "deploy_role_arn": {
          "description": "IAM role assumed via OIDC",
          "required": true,
          "type": "string"
        },
        "kvs_name": {
          "description": "CloudFront key-value store holding known branch prefixes",
          "required": true,
          "type": "string"
        },
        "sentry_dsn": {
          "default": "",
          "description": "Where the frontend logger leaves to; empty is off",
          "required": false,
          "type": "string"
        },
        "static_bucket": {
          "description": "S3 bucket serving the SPA",
          "required": true,
          "type": "string"
        },
        "wasm_pack_version": {
          "default": "v0.13.1",
          "type": "string"
        }
      }
    }
  }
}
