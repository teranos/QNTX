{
  "concurrency": {
    "cancel-in-progress": true,
    "group": "pages"
  },
  "jobs": {
    "build-and-deploy": {
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v30",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "name": "Build documentation site",
          "run": "# Try to build\nif ! nix build .#docs-site 2>&1 | tee build.log; then\n  # Check if it's a hash mismatch for releases\n  if grep -q \"hash mismatch\" build.log && grep -q \"qntx-releases.json\" build.log; then\n    echo \"GitHub releases hash mismatch detected\"\n\n    # Extract new hash\n    NEW_HASH=$(grep \"got:\" build.log | tail -1 | awk '{print $2}')\n\n    # Validate hash was extracted\n    if [ -z \"$NEW_HASH\" ] || [[ ! \"$NEW_HASH\" =~ ^sha256- ]]; then\n      echo \"ERROR: Failed to extract valid hash from build log\"\n      cat build.log\n      exit 1\n    fi\n\n    echo \"New hash: $NEW_HASH\"\n\n    # Update sitegen.nix\n    sed -i \"s|outputHash = \\\"sha256-[^\\\"]*\\\";|outputHash = \\\"$NEW_HASH\\\";|\" sitegen.nix\n\n    # Commit the hash update\n    git config user.name \"github-actions[bot]\"\n    git config user.email \"github-actions[bot]@users.noreply.github.com\"\n    git add sitegen.nix\n    git commit -m \"Update GitHub releases hash for docs build\"\n    git push\n\n    # Retry build\n    echo \"Retrying build with updated hash...\"\n    nix build .#docs-site --show-trace\n  else\n    echo \"Build failed for reason other than releases hash\"\n    cat build.log\n    exit 1\n  fi\nfi\n"
        },
        {
          "name": "Setup Pages",
          "uses": "actions/configure-pages@v4"
        },
        {
          "name": "Upload artifact",
          "uses": "actions/upload-pages-artifact@v3",
          "with": {
            "path": "./result"
          }
        },
        {
          "id": "deployment",
          "name": "Deploy to GitHub Pages",
          "uses": "actions/deploy-pages@v4"
        }
      ]
    }
  },
  "name": "Deploy Docs to GitHub Pages",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "docs/**",
        "sitegen/**",
        "web/css/**",
        "types/generated/**",
        ".github/workflows/docs-deploy.yml"
      ]
    },
    "release": {
      "types": [
        "published"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write",
    "id-token": "write",
    "pages": "write"
  }
}
