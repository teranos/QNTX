{
  "jobs": {
    "build-push": {
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Cache Nix store",
          "uses": "actions/cache@v4",
          "with": {
            "key": "nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}",
            "path": "/nix/store",
            "restore-keys": "nix-${{ runner.os }}-\n"
          }
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v26",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "id": "version",
          "name": "Extract version from tag",
          "run": "if [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n  VERSION=${GITHUB_REF#refs/tags/v}\n  # Replace + with - for OCI tag compatibility\n  VERSION=${VERSION//+/-}\n  echo \"version=$VERSION\" >> $GITHUB_OUTPUT\n  echo \"has_version=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"has_version=false\" >> $GITHUB_OUTPUT\nfi\n"
        },
        {
          "env": {
            "VERSION_TAG": "${{ steps.version.outputs.has_version == 'true' && format('v{0}', steps.version.outputs.version) || 'dev' }}"
          },
          "name": "Build image with Nix",
          "run": "nix build ${{ matrix.image.path }}#${{ matrix.image.name }}-${{ matrix.arch }} --impure"
        },
        {
          "env": {
            "VERSION_TAG": "${{ steps.version.outputs.has_version == 'true' && format('v{0}', steps.version.outputs.version) || 'dev' }}"
          },
          "name": "Cache image",
          "run": "nix build ${{ matrix.image.path }}#${{ matrix.image.name }}-${{ matrix.arch }} --impure --print-out-paths --no-link | cachix push qntx"
        },
        {
          "name": "Load image into Docker",
          "run": "docker load < result"
        },
        {
          "name": "Log in to GHCR",
          "uses": "docker/login-action@v3",
          "with": {
            "password": "${{ secrets.GITHUB_TOKEN }}",
            "registry": "ghcr.io",
            "username": "${{ github.actor }}"
          }
        },
        {
          "env": {
            "VERSION_TAG": "${{ steps.version.outputs.has_version == 'true' && format('v{0}', steps.version.outputs.version) || 'dev' }}"
          },
          "name": "Verify reproducible build",
          "run": "echo \"Building twice to verify reproducibility...\"\nnix build .#${{ matrix.image.name }}-${{ matrix.arch }} --impure --rebuild --out-link result-1\nHASH1=$(nix-hash --type sha256 result-1)\nrm result-1\n\nnix build .#${{ matrix.image.name }}-${{ matrix.arch }} --impure --rebuild --out-link result-2\nHASH2=$(nix-hash --type sha256 result-2)\n\nif [ \"$HASH1\" = \"$HASH2\" ]; then\n  echo \"✓ Build is reproducible - hashes match: $HASH1\"\nelse\n  echo \"✗ Build is NOT reproducible\"\n  echo \"First build:  $HASH1\"\n  echo \"Second build: $HASH2\"\n  exit 1\nfi\n"
        },
        {
          "name": "Tag and push",
          "run": "# Tag with architecture\ndocker tag ${{ matrix.image.registry }}:latest ${{ matrix.image.registry }}:latest-${{ matrix.arch }}\ndocker push ${{ matrix.image.registry }}:latest-${{ matrix.arch }}\n\n# Push versioned tag if this is a tag push\nif [[ \"${{ steps.version.outputs.has_version }}\" == \"true\" ]]; then\n  docker tag ${{ matrix.image.registry }}:latest ${{ matrix.image.registry }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}\n  docker push ${{ matrix.image.registry }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}\nfi\n"
        }
      ],
      "strategy": {
        "matrix": {
          "arch": [
            "amd64",
            "arm64"
          ],
          "image": [
            {
              "name": "qntx-image",
              "path": ".",
              "registry": "ghcr.io/teranos/qntx"
            }
          ]
        }
      }
    },
    "create-manifest": {
      "needs": "build-push",
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Log in to GHCR",
          "uses": "docker/login-action@v3",
          "with": {
            "password": "${{ secrets.GITHUB_TOKEN }}",
            "registry": "ghcr.io",
            "username": "${{ github.actor }}"
          }
        },
        {
          "id": "version",
          "name": "Extract version from tag",
          "run": "if [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n  VERSION=${GITHUB_REF#refs/tags/v}\n  # Replace + with - for OCI tag compatibility\n  VERSION=${VERSION//+/-}\n  echo \"version=$VERSION\" >> $GITHUB_OUTPUT\n  echo \"has_version=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"has_version=false\" >> $GITHUB_OUTPUT\nfi\n"
        },
        {
          "name": "Create and push multi-arch manifest for latest",
          "run": "docker manifest create ${{ matrix.image.registry }}:latest \\\n  ${{ matrix.image.registry }}:latest-amd64 \\\n  ${{ matrix.image.registry }}:latest-arm64\n\ndocker manifest push ${{ matrix.image.registry }}:latest\n"
        },
        {
          "if": "steps.version.outputs.has_version == 'true'",
          "name": "Create and push multi-arch manifest for version tag",
          "run": "docker manifest create ${{ matrix.image.registry }}:${{ steps.version.outputs.version }} \\\n  ${{ matrix.image.registry }}:${{ steps.version.outputs.version }}-amd64 \\\n  ${{ matrix.image.registry }}:${{ steps.version.outputs.version }}-arm64\n\ndocker manifest push ${{ matrix.image.registry }}:${{ steps.version.outputs.version }}\n"
        }
      ],
      "strategy": {
        "matrix": {
          "image": [
            {
              "name": "qntx-image",
              "registry": "ghcr.io/teranos/qntx"
            }
          ]
        }
      }
    }
  },
  "name": "Build Image",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    },
    "workflow_dispatch": null
  }
}
