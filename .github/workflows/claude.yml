{
  "jobs": {
    "claude": {
      "if": "(github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||\n(github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||\n(github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||\n(github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))\n",
      "permissions": {
        "actions": "read",
        "contents": "read",
        "id-token": "write",
        "issues": "read",
        "pull-requests": "read"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 1
          }
        },
        {
          "id": "claude",
          "name": "Run Claude Code",
          "uses": "anthropics/claude-code-action@v1",
          "with": {
            "additional_permissions": "actions: read\n",
            "claude_code_oauth_token": "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
          }
        }
      ]
    }
  },
  "name": "Claude Code",
  "on": {
    "issue_comment": {
      "types": [
        "created"
      ]
    },
    "issues": {
      "types": [
        "opened",
        "assigned"
      ]
    },
    "pull_request_review": {
      "types": [
        "submitted"
      ]
    },
    "pull_request_review_comment": {
      "types": [
        "created"
      ]
    }
  }
}
