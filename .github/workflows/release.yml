{
  "jobs": {
    "build-linux": {
      "if": "always()",
      "needs": "create-release",
      "permissions": {
        "contents": "write"
      },
      "runs-on": "${{ matrix.runner }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "id": "version",
          "name": "Extract version",
          "run": "# For tags, extract version from tag name\nif [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n  VERSION=${GITHUB_REF#refs/tags/v}\nelse\n  # For branch testing, use test version\n  VERSION=\"test-$(git rev-parse --short HEAD)\"\nfi\necho \"version=$VERSION\" >> $GITHUB_OUTPUT\necho \"Building version: $VERSION\"\n"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v26",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Setup Cachix",
          "uses": "cachix/cachix-action@v14",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "qntx"
          }
        },
        {
          "env": {
            "VERSION_TAG": "v${{ steps.version.outputs.version }}"
          },
          "name": "Build QNTX binary",
          "run": "echo \"Building QNTX for Linux ${{ matrix.arch }} @ $VERSION_TAG...\"\nnix build .#qntx --impure --print-build-logs\n"
        },
        {
          "env": {
            "VERSION_TAG": "v${{ steps.version.outputs.version }}"
          },
          "name": "Cache binary to Cachix",
          "run": "nix build .#qntx --impure --print-out-paths --no-link | cachix push qntx"
        },
        {
          "name": "Package binary with bundled libduckdb",
          "run": "mkdir -p release/lib\ncp result/bin/qntx release/qntx\nchmod +w release/qntx\nDUCKDB_SO=$(ldd result/bin/qntx | awk '/libduckdb/ {print $3}')\nif [ -z \"$DUCKDB_SO\" ]; then\n  echo \"libduckdb not found in qntx dependencies\"\n  ldd result/bin/qntx\n  exit 1\nfi\ncp -L \"$DUCKDB_SO\" release/lib/\nif [ \"${{ matrix.arch }}\" = \"arm64\" ]; then\n  INTERP=/lib/ld-linux-aarch64.so.1\nelse\n  INTERP=/lib64/ld-linux-x86-64.so.2\nfi\nnix run nixpkgs#patchelf -- \\\n  --set-interpreter \"$INTERP\" \\\n  --set-rpath '$ORIGIN/lib' \\\n  release/qntx\nchmod +x release/qntx\ncd release\ntar -czf qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz qntx lib/\nsha256sum qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz > qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256\n# A name with no version in it, so /releases/latest/download/<name>\n# resolves forever and the docs site needs no build-time API call.\ncp qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz qntx-linux-${{ matrix.arch }}.tar.gz\nsha256sum qntx-linux-${{ matrix.arch }}.tar.gz > qntx-linux-${{ matrix.arch }}.tar.gz.sha256\n"
        },
        {
          "if": "startsWith(github.ref, 'refs/tags/')",
          "name": "Upload Release Asset (tags only)",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "files": "release/qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz\nrelease/qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256\nrelease/qntx-linux-${{ matrix.arch }}.tar.gz\nrelease/qntx-linux-${{ matrix.arch }}.tar.gz.sha256\n",
            "tag_name": "${{ github.ref_name }}"
          }
        },
        {
          "if": "!startsWith(github.ref, 'refs/tags/')",
          "name": "Upload artifacts (testing only)",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "qntx-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}",
            "path": "release/*"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "arch": "amd64",
              "runner": "ubuntu-latest"
            },
            {
              "arch": "arm64",
              "runner": "ubuntu-24.04-arm"
            }
          ]
        }
      }
    },
    "build-macos": {
      "if": "always()",
      "needs": "create-release",
      "permissions": {
        "contents": "write"
      },
      "runs-on": "${{ matrix.runner }}",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "id": "version",
          "name": "Extract version",
          "run": "# For tags, extract version from tag name\nif [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n  VERSION=${GITHUB_REF#refs/tags/v}\nelse\n  # For branch testing, use test version\n  VERSION=\"test-$(git rev-parse --short HEAD)\"\nfi\necho \"version=$VERSION\" >> $GITHUB_OUTPUT\necho \"Building version: $VERSION\"\n"
        },
        {
          "name": "Setup Rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "wasm32-unknown-unknown"
          }
        },
        {
          "name": "Setup Go",
          "uses": "actions/setup-go@v5",
          "with": {
            "go-version-file": "go.mod"
          }
        },
        {
          "name": "Install wasm-pack",
          "run": "cargo install wasm-pack"
        },
        {
          "name": "Build macOS binary",
          "run": "make cli"
        },
        {
          "name": "Package binary",
          "run": "mkdir -p release\ncp bin/qntx release/\ncd release\ntar -czf qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz qntx\nshasum -a 256 qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz > qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz.sha256\n# Version-free alias — see the linux job.\ncp qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz qntx-darwin-${{ matrix.arch }}.tar.gz\nshasum -a 256 qntx-darwin-${{ matrix.arch }}.tar.gz > qntx-darwin-${{ matrix.arch }}.tar.gz.sha256\n"
        },
        {
          "if": "startsWith(github.ref, 'refs/tags/')",
          "name": "Upload Release Asset (tags only)",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "files": "release/qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz\nrelease/qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}.tar.gz.sha256\nrelease/qntx-darwin-${{ matrix.arch }}.tar.gz\nrelease/qntx-darwin-${{ matrix.arch }}.tar.gz.sha256\n",
            "tag_name": "${{ github.ref_name }}"
          }
        },
        {
          "if": "!startsWith(github.ref, 'refs/tags/')",
          "name": "Upload artifacts (testing only)",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "qntx-${{ steps.version.outputs.version }}-darwin-${{ matrix.arch }}",
            "path": "release/*"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "arch": "amd64",
              "runner": "macos-13"
            },
            {
              "arch": "arm64",
              "runner": "macos-14"
            }
          ]
        }
      }
    },
    "create-release": {
      "if": "startsWith(github.ref, 'refs/tags/')",
      "outputs": {
        "upload_url": "${{ steps.create_release.outputs.upload_url }}",
        "version": "${{ steps.version.outputs.version }}"
      },
      "permissions": {
        "contents": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "id": "version",
          "name": "Extract version from tag",
          "run": "if [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n  VERSION=${GITHUB_REF#refs/tags/v}\n  echo \"version=$VERSION\" >> $GITHUB_OUTPUT\nfi\n"
        },
        {
          "id": "create_release",
          "name": "Create Release",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "body": "## QNTX ${{ steps.version.outputs.version }}\n\n### Installation\n\n**Nix (Recommended):**\n```bash\nnix profile install github:teranos/QNTX/${{ github.ref_name }}\n```\n\n**Docker:**\n```bash\ndocker pull ghcr.io/teranos/qntx:${{ steps.version.outputs.version }}\n```\n\n**Manual Download:**\nDownload the appropriate binary for your platform below, extract it, and add to your PATH.\n\n### Binaries\n\n**Linux:**\n- amd64: `qntx-${{ steps.version.outputs.version }}-linux-amd64.tar.gz`\n- arm64: `qntx-${{ steps.version.outputs.version }}-linux-arm64.tar.gz`\n\n**macOS:**\n- Intel (x64): `qntx-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz`\n- Apple Silicon (ARM): `qntx-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz`\n\n### Desktop App (Tauri)\n\n**macOS:** `QNTX-${{ steps.version.outputs.version }}-macos-arm64.tar.gz`\n",
            "draft": false,
            "generate_release_notes": true,
            "name": "QNTX ${{ steps.version.outputs.version }}",
            "prerelease": false,
            "tag_name": "${{ github.ref_name }}"
          }
        }
      ]
    }
  },
  "name": "Release",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    },
    "workflow_dispatch": null
  }
}
