{
  "jobs": {
    "claude-review": {
      "permissions": {
        "contents": "read",
        "issues": "write",
        "pull-requests": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "id": "app-token",
          "name": "Generate GitHub App token for Claude",
          "uses": "tibdex/github-app-token@v2",
          "with": {
            "app_id": "${{ secrets.QNTX_APP_ID }}",
            "private_key": "${{ secrets.QNTX_APP_PRIVATE_KEY }}"
          }
        },
        {
          "id": "qntx-fix-suggestions",
          "name": "Generate QNTX Fix Suggestions",
          "uses": "anthropics/claude-code-action@v1",
          "with": {
            "claude_args": "--allowed-tools \"Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)\"",
            "claude_code_oauth_token": "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}",
            "github_token": "${{ steps.app-token.outputs.token }}",
            "prompt": "REPO: ${{ github.repository }}\nPR NUMBER: ${{ inputs.pr_number }}\n\nYour task is to analyze this pull request and output a machine readable list of concrete code fixes for the `qntx code` CLI.\n\nUse `gh pr diff` and `gh pr view` with your Bash tool to inspect the pull request and identify high impact issues:\n- Potential bugs or correctness issues\n- Security concerns\n- Performance issues\n- Clear code quality problems\n\nThen post a single PR comment whose entire content is exactly one fenced block in this format:\n\n```qntx-fix\n[\n  {\n    \"id\": \"FIX-1\",\n    \"title\": \"Short human description of the issue\",\n    \"file\": \"path/from/repo/root.go\",\n    \"start_line\": 123,\n    \"end_line\": 130,\n    \"issue\": \"One sentence description of what is wrong.\",\n    \"severity\": \"low\" | \"medium\" | \"high\",\n    \"patch\": \"\"\n  }\n]\n```\n\nRequirements for the qntx-fix block:\n- The comment must contain only that fenced block and nothing else.\n- Always output a JSON array. Use [] if there are no suggestions.\n- Use ids FIX-1, FIX-2, FIX-3 in descending priority order.\n- Include at most 10 suggestions.\n- Use 1 based line numbers that match the current version in the PR.\n- Use `\"patch\": \"\"` unless you are very confident in a unified diff patch.\n- Do not write any text before or after the fenced block.\n\nFinally, use `gh pr comment` with your Bash tool to post that fenced block as a comment on the pull request.\n"
          }
        }
      ]
    }
  },
  "name": "Claude Code Review",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "pr_number": {
          "description": "Pull request number to analyze",
          "required": true,
          "type": "number"
        }
      }
    }
  }
}
