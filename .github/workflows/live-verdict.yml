{
  "jobs": {
    "say": {
      "name": "The live gate's verdict, on the commit it held",
      "permissions": {
        "statuses": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "RUN": "${{ github.event.client_payload.run }}",
            "SAID": "${{ github.event.client_payload.said }}",
            "SHA": "${{ github.event.client_payload.sha }}",
            "STATE": "${{ github.event.client_payload.state }}"
          },
          "name": "Say it as the live status",
          "run": "gh api \"repos/${{ github.repository }}/statuses/$SHA\" -f state=\"$STATE\" -f context=live -f description=\"$SAID\" -f target_url=\"$RUN\"\n"
        }
      ]
    }
  },
  "name": "live verdict",
  "on": {
    "repository_dispatch": {
      "types": [
        "live-verdict"
      ]
    }
  }
}
