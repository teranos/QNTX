{
  "jobs": {
    "build-push": {
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Install Nix",
          "uses": "cachix/install-nix-action@v26",
          "with": {
            "extra_nix_config": "experimental-features = nix-command flakes\n"
          }
        },
        {
          "name": "Build CI image",
          "run": "nix build ./ci#ci-image-${{ matrix.arch }}"
        },
        {
          "name": "Load image into Docker",
          "run": "docker load < result"
        },
        {
          "name": "Log in to GHCR",
          "uses": "docker/login-action@v3",
          "with": {
            "password": "${{ secrets.GITHUB_TOKEN }}",
            "registry": "ghcr.io",
            "username": "${{ github.actor }}"
          }
        },
        {
          "name": "Tag and push",
          "run": "docker tag ghcr.io/teranos/qntx-ci:latest ghcr.io/teranos/qntx-ci:latest-${{ matrix.arch }}\ndocker push ghcr.io/teranos/qntx-ci:latest-${{ matrix.arch }}\n"
        }
      ],
      "strategy": {
        "matrix": {
          "arch": [
            "amd64",
            "arm64"
          ]
        }
      }
    },
    "create-manifest": {
      "needs": "build-push",
      "permissions": {
        "contents": "read",
        "packages": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Log in to GHCR",
          "uses": "docker/login-action@v3",
          "with": {
            "password": "${{ secrets.GITHUB_TOKEN }}",
            "registry": "ghcr.io",
            "username": "${{ github.actor }}"
          }
        },
        {
          "name": "Create and push multi-arch manifest",
          "run": "docker manifest create ghcr.io/teranos/qntx-ci:latest \\\n  ghcr.io/teranos/qntx-ci:latest-amd64 \\\n  ghcr.io/teranos/qntx-ci:latest-arm64\n\ndocker manifest push ghcr.io/teranos/qntx-ci:latest\n"
        }
      ]
    }
  },
  "name": "Build CI Image",
  "on": {
    "push": {
      "paths": [
        "ci/**",
        ".github/workflows/ci-image.yml"
      ]
    },
    "workflow_dispatch": null
  }
}
