<!-- What the run taps and reads. The box sits high, where no keyboard covers it,
     so the page has no reason to move; the square says whether it did: green
     while the page is at its own scale, red from the moment it is not. -->
<style>
    #probe-says { position: fixed; left: 10%; width: 80%; top: 30%; height: 44px; font: 12px monospace; box-sizing: border-box; z-index: 2147483647; }
    #probe-light { position: fixed; left: calc(50% - 40px); top: calc(12% - 40px); width: 80px; height: 80px; background: #00c853; z-index: 2147483647; }
    #probe-light.zoomed { background: #d50000; }
</style>
<div id="probe-light"></div>
<textarea id="probe-says" placeholder="Say something to the ROOT agent"></textarea>
<script>
    (function () {
        function look() {
            if (window.visualViewport && window.visualViewport.scale > 1.01) document.getElementById('probe-light').classList.add('zoomed');
        }
        window.visualViewport.addEventListener('resize', look);
        window.visualViewport.addEventListener('scroll', look);
        setInterval(look, 100);
    })();
</script>
