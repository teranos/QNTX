# QNTX Configuration Example
# Copy this file to ~/.qntx/am.toml and change what is yours to change.
#
# A node runs on what its am.toml says and on nothing else: a key left out is
# not a value. What every node runs with is written out below, uncommented,
# and `qntx server` refuses a node whose am.toml leaves any of it out, naming
# every key at once. A commented key, left out, is something that does not run.

# ════════════════════════════════════════════════════════════════
# Storage Backend (ADR-023, ADR-024)
# Which store holds attestations. Backend chosen at startup.
# ════════════════════════════════════════════════════════════════

[storage]
# Accepted values: "sqlite" or "parquet".
backend = "sqlite"

# ── SQLite backend ──────────────────────────────────────────────

[storage.sqlite]
# SQLite database path (relative to working directory or absolute). Left out,
# with no --db-path or DB_PATH, no store is opened.
# Environment: QNTX_STORAGE_SQLITE_PATH
path = "qntx.db"

# Hot backup interval (seconds). 0, or left out, backs nothing up.
backup_interval_seconds = 3600

[storage.sqlite.bounded_storage]
# Bounded storage limits prevent unbounded database growth.
# Oldest attestations are deleted when a limit is exceeded.

# Maximum attestations per (actor, context) pair.
actor_context_limit = 32

# Maximum contexts per actor.
actor_contexts_limit = 64

# Maximum actors per entity (subject).
entity_actors_limit = 64

# ── Parquet backend (ADR-024) ───────────────────────────────────
# Uncomment when backend = "parquet". Location is a URL: "s3://..."
# or "file:///...". Credentials come from the AWS SDK default
# chain — no keys in this file.
#
# [storage.parquet]
# location = "s3://bucket/prefix"

# ════════════════════════════════════════════════════════════════
# Attestation Distillation (ADR-020)
# Folds old attestations into compressed summaries before deletion.
# ════════════════════════════════════════════════════════════════

[distill]
# How often the age-based distill cycle runs (seconds). Left out, nothing
# is distilled. Said, the two below are said with it.
# interval_seconds = 300

# Attestations older than this are candidates for distillation.
# max_age_hours = 720

# Maximum attestations to process per cycle.
# batch_size = 500

# ════════════════════════════════════════════════════════════════
# Sentry
# Where the logs and the numbers go when nobody is at the machine.
#
# This is a second sink, not a second logging API: it ships what the
# global logger already writes, so no line of code says "Sentry".
# The numbers the node emits are named in internal/measure.
# ════════════════════════════════════════════════════════════════

[node]
# What the node says of itself, through am node, and what the parity sigil
# holds to A2A's AgentCard.
# Default: "" (says nothing)
# name = "the-node"
# description = "What this node is for."

[agent.root]
# The ROOT agent (ADR-048): QNTX itself as ROOT talks to it.
# Named whole or not at all. Default: none, and the node has no ROOT agent.
# model = 'claude-opus-5-5'

# effort = 'low'

[sentry]
# The project logs and metrics are shipped to. Empty is off, and
# nothing else in this section is read. A DSN is an ingest key — it
# can only write, and it is meant to travel with the build.
#
# Metrics ride this same switch. min_level and the levels below are
# about log lines; the numbers are emitted whenever a DSN is set.
# Left out, nothing is shipped. Said, min_level, capture_errors,
# flush_seconds and debug are said with it.
# dsn = "https://<key>@<org>.ingest.<region>.sentry.io/<project>"

# Which node this is, in Sentry's own vocabulary. Where it runs, not
# the build — the build travels as the release, read from the binary.
# Default: "" (Sentry reads SENTRY_ENVIRONMENT, then nothing)
# environment = "production"

# Names the node inside the environment.
# Default: "" (the hostname)
# server_name = "the-node"

# The lowest level that leaves the process. Below it stays in the
# console and the log file. One of: debug, info, warn, error.
# min_level = "info"

# Raise an issue, and not only a log line, at error and above. An
# issue is grouped across occurrences and carries the error's stack;
# a log line is one entry in a stream.
# capture_errors = true

# Nothing is redacted on the way out. A value on a log line is
# already in the console, the file and journald, so replacing it at
# one sink stops one reader and leaves the node lying about itself.
# Keep it off the line.

# How long the process waits at exit for the batch to drain. The SDK
# buffers, and the error that ended the process is in that buffer.
# flush_seconds = 2

# Print what the SDK is doing to stderr. Answers "did the log leave"
# without guessing.
# debug = false

# The share of Pulse job executions shipped as spans, 0 to 1.
#
# A span carries the duration of one handler run as a number. The same
# duration is already written to task_logs as the words "Completed in
# 4821ms", which answers that one run and nothing else; as a span it
# answers p95 per handler across every node. Cost, retry count and
# outcome ride along as attributes on it.
#
# 0 ships none and tracing stays off in the SDK. 1 ships all.
# Default: 0
# traces_sample_rate = 1.0

# Reading back what was shipped, for the weekly report (ADR-042). All
# four, or the report leaves Sentry out and says which is missing.
# read_token is a token that may read events — never a literal.
# read_token   = "ssm:///path/to/sentry/read-token"
# api          = "https://<region>.sentry.io"
# organization = "<org slug>"
# project      = "<project id, the last segment of the DSN>"

# ════════════════════════════════════════════════════════════════
# Mail (ADR-041, ADR-042)
# ════════════════════════════════════════════════════════════════

[mail]
# The address every mail is sent from. Omitted, it is system@ the rp_id.
# Empty sends nothing, and every send says why.
# from = "Garden <mail@garden.test>"

[mail.ses]
# Send through Amazon SES, with the node's AWS credentials. Left out,
# nothing is sent through SES.
# enabled = true
# The region the SES account sends from.
# Default: "" (the AWS default chain's region)
# region = "eu-central-1"

[mail.report]
# How often the node's own report goes to the ROOT User.
# Default: 604800 (weekly). 0 is never.
# interval_seconds = 604800

# ════════════════════════════════════════════════════════════════
# Server Configuration (Web UI)
# ════════════════════════════════════════════════════════════════

[server]
# HTTP server port for QNTX backend API. The node listens on this port and
# on no other: a port already taken stops the node.
port = 8770

# Frontend dev server port (bun/vite hot-reload). Left out, there is no
# separate frontend and no origin stands for one.
# frontend_port = 8820

# Network interface to bind
# "127.0.0.1" = local only, "0.0.0.0" = all interfaces
# Non-loopback requires auth.enabled = true
# Environment: QNTX_BIND_ADDRESS
bind_address = "127.0.0.1"

# Allowed CORS origins for web UI access
# Default: localhost and 127.0.0.1 (HTTP and HTTPS), plus the App, which is at
# tauri://localhost on iOS and desktop and at tauri.localhost on Android.
# The web origins of auth.rp_origins and of every door are allowed beside what
# is written here; list only the origins that are not a door.
allowed_origins = [
    "http://localhost",
    "https://localhost",
    "http://127.0.0.1",
    "https://127.0.0.1",
    "tauri://localhost",
    "http://tauri.localhost",
    "https://tauri.localhost"
]

[server.rate_limit]
# Per-IP token bucket limits. A burst of 0 admits nothing.
auth_rate = 2        # /auth/* requests per second
auth_burst = 5
ws_rate = 2          # WebSocket upgrades per second
ws_burst = 10
write_rate = 20      # POST/PUT/DELETE per second
write_burst = 40
read_rate = 60       # GET per second
read_burst = 120
public_rate = 10     # /health, static per second
public_burst = 20
staand_rate = 20     # per staand, not per IP
staand_burst = 40
opened_rate = 1      # per caller per path a line opened to strangers
opened_burst = 1

# /debug/pprof, on its own listener bound to 127.0.0.1 whatever bind_address
# says. The public listener answers 404 for that path.
# Left out, or 0, there is no profiling listener.
# pprof_port = 8771

# ════════════════════════════════════════════════════════════════
# Auth (WebAuthn / Passkeys)
# ════════════════════════════════════════════════════════════════

[auth]
# Biometric passkey gate. Said, true or false: a node whose am.toml leaves it
# out does not start. Required true when server.bind_address is non-loopback.
enabled = false
# Said whenever enabled is true.
# session_expiry_hours = 168
#
# WebAuthn Relying Party ID and Origins. MUST be set for any public
# deployment.
#   rp_id      — single domain, no scheme, no port: "qntx.example.com"
#   rp_origins — full URLs the browser will present: ["https://qntx.example.com"]
# Omitted rp_origins is https:// and the rp_id; written, it overrides that.
# Empty rp_id falls back to "localhost", and then rp_origins falls back to
# http://localhost:<server.port> [+ frontend_port]. Startup fails fast if
# bind_address is non-loopback, auth.enabled is true, and rp_id is empty.
# rp_id = "qntx.example.com"
# rp_origins = ["https://qntx.example.com"]

# Who may log in as an identity laye holds. Empty admits nobody, and startup
# fails fast if bind_address is non-loopback and auth.enabled is true.

# A did:key is a public key — the login signature proves possession.
# root_identities = ["did:key:z6MkExampleExampleExampleExampleExampleExample"]

# An account stands on a binding, worth exactly the key that signed it. Each
# provider names accounts its own way: Mastodon by profile URL, atproto by DID.
# root_identities = ["https://social.example.com/@you", "did:plc:examplexamplexamplexampl"]

# So an account entry also needs that signer's hex ed25519 public key.
# binding_signers = ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]

# Listing several is how one deployment admits several people, and how one
# person is admitted from more than one place.

# Where this node answers, which the provider ceremony's redirect_uri is built
# from. Not rp_origins — that is where the page is, and a deployment can serve
# the page and the API on different hosts.

# Unset, it is this machine's loopback origin; it is never read off a request.
# public_origin = "https://api.qntx.example.com"

# ── Front doors (ADR-032) ───────────────────────────────────────
#
# A front door is a domain serving a UI against this node, and the namespace
# people arrive in. rp_id and rp_origins above are the door onto "default";
# every other namespace names its own here, keyed by that namespace.
#
# A passkey belongs to the domain it was made at, so a door is a relying party
# of its own. rp_id must be a registrable domain suffix of every origin under
# it — the browser's rule, which is why one rp_id stands behind several
# hostnames and a door with several origins is still one door. A door with
# one origin and no rp_id has that origin's host as its rp_id.
#
# The key is the namespace's name lowercased, which is the whole of the slug —
# the store keeps "Clean" and the door says "clean". TOML keys arrive
# lower-cased, so a key written any other way is refused at load. One origin
# reaches one namespace: an origin listed under two doors is refused at load.
# Two namespaces whose names differ only in case share one slug, and a door
# onto that slug is refused rather than sent to either.
#
# No trailing slash. A browser's Origin header carries a scheme and a host and
# no path, and an origin written with one matches nothing that ever arrives.
#
# [auth.door.garden]
# rp_id   = "garden.example"
# origins = ["https://portal.garden.example"]

# What a provider needs under [auth.provider.<name>], and under a door as
# [auth.door.<namespace>.provider.<name>], is on its page in docs/identity/.

# ════════════════════════════════════════════════════════════════
# Pulse Configuration (Async Job System)
# ════════════════════════════════════════════════════════════════

[pulse]
# Number of concurrent job workers. 0 is no workers.
workers = 1

# How often to check for scheduled jobs (seconds). 0 is no ticking.
ticker_interval_seconds = 1

# ════════════════════════════════════════════════════════════════
# LLM, fetch and watchers: the limits the node holds its services to
# ════════════════════════════════════════════════════════════════

[llm]
max_concurrent = 1         # inference runs at once; 0 serves none
max_calls_per_minute = 60  # sliding window
max_queue_depth = 20       # waiting requests beyond this are refused
cooldown_seconds = 3       # pause between inference runs

[fetch]
max_requests_per_window = 100  # 0 makes no requests
window_seconds = 300
# Left out, or 0, the fetch pulse does not log.
pulse_interval_seconds = 30

[watcher]
# For a watcher made without its own; 0 never fires.
max_fires_per_second = 3

# ════════════════════════════════════════════════════════════════
# Embeddings: how clusters and projections are made, once an embedding
# service arrives with a plugin
# ════════════════════════════════════════════════════════════════

[embeddings]
cluster_threshold = 0.5        # minimum cosine similarity for cluster prediction
min_cluster_size = 5           # HDBSCAN
cluster_match_threshold = 0.7  # cosine similarity for stable cluster matching
projection_methods = ["umap"]

# ════════════════════════════════════════════════════════════════
# Plugin Configuration
# ════════════════════════════════════════════════════════════════

[plugin]
# Plugins are added, configured and enabled in the plugin element.

# Where plugin binaries are looked for. Left out, nowhere: no plugin is found.
paths = ["~/.qntx/plugins"]

# The TypeScript plugin runtime. Left out, TypeScript plugins do not run.
# [plugin.runtime]
# typescript_runtime = "/path/to/QNTX/plugin/typescript/runtime/main.ts"

# Forge credentials, one per host, needed only for private repos.
# The host is a value, not a key — the config keyspace is dot-delimited and
# every forge host contains a dot, so a host used as a key reads as a nested
# table. As a value there is nothing to split.
#
# Values are references, never secrets: am.toml ships as a world-readable SSM
# String parameter, so a literal token here is disclosed, not configured.
# A literal is rejected at config load.
#
#   ssm:///qntx/github-token    read via the host's existing credentials
#   env:GITHUB_TOKEN            read from the environment
# [[plugin.access_token]]
# host = "github.com"
# ref  = "ssm:///qntx/github-token"
#
# [[plugin.access_token]]
# host = "codeberg.org"
# ref  = "env:CODEBERG_TOKEN"


