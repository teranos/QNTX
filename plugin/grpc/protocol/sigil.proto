syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// What the node does, in the shape that crosses a boundary (ADR-039). The
// browser reads these to name a sigil in a reach line, and a plugin hands the
// node a Signum to say what it can do.
//
// A signum is data the node holds rather than a service compiled in, because
// reach is governed at runtime and a plugin comes and goes while the node runs.

// A Signum holds the sigils of one subject: watchers is a signum, and list,
// create, read, update and delete are its sigils. On the Agent Card a signum
// is described as an AgentSkill.
message Signum {
  string name = 1;
  repeated Sigil sigils = 2;
  // The shapes this signum is held to, each by its name: "Staands will be
  // Umami, one reference and not a blend." The parity sigil reads these.
  repeated Follows follows = 3;
  // What it is for, in words, and the words it is found by. To A2A these are
  // a skill's description and tags.
  string description = 4;
  repeated string tags = 5;
}

// Node is the node about itself: what it is called, what it is for, and the
// signa it holds. It is what fills A2A's AgentCard, which am node answers, and
// the parity sigil holds it to that card.
message Node {
  string name = 1;
  string description = 2;
  repeated Signum signa = 3;
}

// Transcript is one agent session Ground recorded, derived from its hook
// events: transcripts read answers these.
message Transcript {
  // Its id.
  string session = 1;
  // The subjects it was about.
  repeated string subjects = 2;
  // When it started.
  string started = 3;
  // When it ended.
  string ended = 4;
  // Its turns, each naming the attestation it was read from.
  repeated Turn turns = 5;
  // Events the store folded into sigmas (ADR-020), counted and not read.
  uint32 folded = 6;
  // The model the session started on, as its SessionStart says.
  string model = 7;
  // The effort its last Stop ran at, as that Stop's effort.level says.
  string effort = 8;
}

// Turn is one thing said or done in a session, naming the attestation it was
// read from.
message Turn {
  // When it was said or done.
  string at = 1;
  // Who said or did it.
  string speaker = 2;
  // What was said or done.
  string text = 3;
  // The attestation it was read from.
  string of = 4;
}

// Transcripts is what transcripts read answers.
message Transcripts {
  // Each session: its id, the subjects it was about, when it started and
  // ended, and its turns, each naming the attestation it was read from.
  repeated Transcript transcripts = 1;
}

// SessionTranscript is what an agent harness's session sigil answers.
message SessionTranscript {
  // Its session as turns, each naming the attestation it was read from. Empty
  // before anything was said to it.
  Transcript transcript = 1;
}

// ClaudeSaid is what claude say answers.
message ClaudeSaid {
  // What it answered.
  string answer = 1;
  // Whether Claude Code reports the turn as failed, in the answer's words.
  bool is_error = 2;
  // How Claude Code says the turn ended.
  string subtype = 3;
  // The session it was said in.
  string session = 4;
  // The model that answered.
  string model = 5;
  // The Claude Code that ran.
  string claude_code = 6;
  // The permission mode it ran in.
  string permission_mode = 7;
  // Each tool it reached for and was not allowed.
  repeated string denied = 8;
  // What Claude Code says the turn cost.
  double cost_usd = 9;
  // How long the turn took.
  double took_ms = 10;
  // Why a row of the session was not written down, when one was not.
  string unwritten = 11;
}

// PiSaid is what pi say answers.
message PiSaid {
  // What it answered.
  string answer = 1;
  // Whether the turn ended in error, in the answer's words.
  bool is_error = 2;
  // Why Pi says the turn stopped.
  string stop = 3;
  // The session it was said in.
  string session = 4;
  // The model that answered.
  string model = 5;
  // The Pi that ran.
  string pi_version = 6;
  // What Pi says the turn's model calls cost.
  double cost_usd = 7;
  // How long the turn took.
  double took_ms = 8;
  // Why a row of the session was not written down, when one was not.
  string unwritten = 9;
}

// ClaudeAm is what claude am answers.
message ClaudeAm {
  // Its own DID, which signs what it writes down.
  string did = 1;
  // The model am.toml names.
  string model = 2;
  // The effort am.toml names.
  string effort = 3;
  // The permission mode it runs in when whoever speaks names none.
  string permission_mode = 4;
  // Every permission mode Claude Code has.
  repeated string permission_modes = 5;
  // The tools it may use without being asked.
  repeated string allow = 6;
  // The session it continues, or empty before anything was said to it.
  string session = 7;
  // Whether it is in a turn now.
  bool answering = 8;
  // Where the Claude Code it runs on is, or empty when the node has none.
  string claude_code = 9;
  // Why it cannot be spoken to, when it cannot.
  string not_ready = 10;
  // Whether Claude Code says it is signed in, by claude login.
  bool signed_in = 11;
  // How it is signed in, as Claude Code names it, or empty when it is not.
  string auth_method = 12;
}

// PiAm is what pi am answers.
message PiAm {
  // Its own DID, which signs what it writes down.
  string did = 1;
  // The model am.toml names for Pi.
  string model = 2;
  // The thinking level am.toml names for Pi.
  string thinking = 3;
  // The plugin every model call Pi makes goes through.
  string gateway = 4;
  // The session it continues in Pi, or empty before anything was said to it
  // there.
  string session = 5;
  // Whether it is in a turn in Pi now.
  bool answering = 6;
  // Where the Pi it runs is, or empty when the node has none yet.
  string pi = 7;
  // The Pi this build pins.
  string pi_version = 8;
  // Why it cannot be spoken to in Pi, when it cannot.
  string not_ready = 9;
}

// NamespaceAgentAm is what agents am and agents set answer: the namespace's
// agent, who opted the namespace into it, and who it is in Claude Code.
message NamespaceAgentAm {
  // The namespace it stands in.
  string namespace = 1;
  // Who opted the namespace into it.
  string set_by = 2;
  // Who the agent is and how it runs.
  ClaudeAm agent = 3;
}

// Follows says which column of a reference each of a signum's fields is. The
// reference is named, not described: its own schema says what its columns are.
message Follows {
  string reference = 1;
  repeated Corresponds columns = 2;
  repeated Fold folds = 3;
}

// Corresponds is one field and the column it is in the reference. The field is
// named in full, message and field, so a field no sigil answers with — what a
// signum keeps rather than what it gives — is named the same way.
message Corresponds {
  // protocol.Arrival.path
  string field = 1;
  // WebsiteEvent.urlPath
  string column = 2;
  reserved 3;
  reserved "keyed_by";
}

// Fold is a repeated field held as one object of a column, a property per
// element: protocol.Sigil.takes is Tool.inputSchema, a property per Param,
// keyed by name.
message Fold {
  // protocol.Sigil.takes
  string field = 1;
  // Tool.inputSchema
  string column = 2;
  // The element's field each property is named by: name.
  string key = 3;
}

// A Sigil is one thing the node does. The function that does it is not here:
// a function is not a shape.
message Sigil {
  string name = 1;
  // What it is for, in words, for somebody who has never seen the code.
  string does = 2;
  // What goes in.
  repeated Param takes = 3;
  // What comes out, by field.
  repeated Field gives = 4;
  // Where it answers on the HTTP API.
  Endpoint http = 5;
  // The message its answer is, named in full: protocol.VersionInfo. What it
  // gives is that message's fields, each in its .proto's words, and nothing
  // is said of them a second time.
  string answer = 6;
}

// A Param is one thing a sigil takes. It says nothing about how it travels:
// that is each surface's to decide.
message Param {
  string name = 1;
  string says = 2;
  bool required = 3;
  // Every value it takes, when it takes only some.
  repeated string one_of = 4;
  // What its value is: empty is text, "count" is a whole number, zero or more.
  string kind = 5;
}

// A Field is one thing a sigil's answer carries, at the top of the answer.
message Field {
  string name = 1;
  string says = 2;
  // The message it carries, named in full, when it carries one: protocol.Visit.
  string message = 3;
}

// An Endpoint is a sigil's form in the HTTP API: the method and the whole path.
message Endpoint {
  string method = 1;
  string path = 2;
}

// A Refusal is a sigil saying no, in its own terms. It names the param the
// caller has to change. Each surface gives it its form: the HTTP API a status,
// MCP a tool error.
message Refusal {
  // The kind of no: "missing", "not one of", "invalid", "not found",
  // "not allowed", "failed".
  string why = 1;
  string param = 2;
  string says = 3;
}
