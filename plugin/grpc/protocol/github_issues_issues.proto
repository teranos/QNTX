// License Simple
message GitHubIssuesIssuesLicenseSimple {
  string key = 1;
  string name = 2;
  string url = 3;
  string spdx_id = 4;
  string node_id = 5;
  string html_url = 6;
}

// GitHub app
message GitHubIssuesIssuesGitHubApp {
  int64 id = 1;
  string slug = 2;
  string node_id = 3;
  string client_id = 4;
  // One of Simple User or Enterprise.
  google.protobuf.Struct owner = 5;
  string name = 6;
  string description = 7;
  string external_url = 8;
  string html_url = 9;
  string created_at = 10;
  string updated_at = 11;
  map<string, string> permissions = 12;
  repeated string events = 13;
  int64 installations_count = 14;
}

// Reaction Rollup
message GitHubIssuesIssuesReactionRollup {
  string url = 1;
  int64 total_count = 2;
  int64 plus_1 = 3 [json_name = "+1"];
  int64 minus_1 = 4 [json_name = "-1"];
  int64 laugh = 5;
  int64 confused = 6;
  int64 heart = 7;
  int64 hooray = 8;
  int64 eyes = 9;
  int64 rocket = 10;
}

// Sub-issues Summary
message GitHubIssuesIssuesSubIssuesSummary {
  int64 total = 1;
  int64 completed = 2;
  int64 percent_completed = 3;
}

// Issue Comment
message GitHubIssuesIssuesIssueComment {
  int64 id = 1;
  string node_id = 2;
  string url = 3;
  string body = 4;
  string body_text = 5;
  string body_html = 6;
  string html_url = 7;
  GitHubIssuesIssuesSimpleUser user = 8;
  string created_at = 9;
  string updated_at = 10;
  string issue_url = 11;
  string author_association = 12;
  GitHubIssuesIssuesGitHubApp performed_via_github_app = 13;
  GitHubIssuesIssuesReactionRollup reactions = 14;
  GitHubIssuesIssuesPinnedIssueComment pin = 15;
  GitHubIssuesIssuesMinimizedIssueComment minimized = 16;
}

// Pinned Issue Comment
message GitHubIssuesIssuesPinnedIssueComment {
  string pinned_at = 1;
  GitHubIssuesIssuesSimpleUser pinned_by = 2;
}

// Minimized Issue Comment
message GitHubIssuesIssuesMinimizedIssueComment {
  string reason = 1;
}

// Issue Dependencies Summary
message GitHubIssuesIssuesIssueDependenciesSummary {
  int64 blocked_by = 1;
  int64 blocking = 2;
  int64 total_blocked_by = 3;
  int64 total_blocking = 4;
}

// Issue Field Value
message GitHubIssuesIssuesIssueFieldValue {
  message SelectOption {
    int64 id = 1;
    string name = 2;
    string color = 3;
  }

  int64 issue_field_id = 1;
  string issue_field_name = 2;
  string node_id = 3;
  string data_type = 4;
  // Any of string, number or integer.
  google.protobuf.Value value = 5;
  SelectOption single_select_option = 6;
  repeated SelectOption multi_select_options = 7;
}

// Issue Suggestion
message GitHubIssuesIssuesIssueSuggestion {
  int64 id = 1;
  int64 issue_id = 2;
  string action = 3;
  string state = 4;
  int64 target_id = 5;
  // One of string, number, boolean or array.
  google.protobuf.Value target_value = 6;
  string rationale = 7;
  string confidence = 8;
  int64 actor_id = 9;
  int64 issue_event_id = 10;
  int64 resolved_by = 11;
  string created_at = 12;
  string updated_at = 13;
}
