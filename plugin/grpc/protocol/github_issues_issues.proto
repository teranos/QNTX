syntax = "proto3";

package protocol;

import "google/protobuf/struct.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043
// https://docs.github.com/en/rest/issues/issues?apiVersion=2026-03-10

// GET /issues
message GitHubListIssuesAssignedToTheAuthenticatedUserRequest {
  string namespace = 1;
  string filter = 2;
  string state = 3;
  string labels = 4;
  string sort = 5;
  string direction = 6;
  string since = 7;
  bool collab = 8;
  bool orgs = 9;
  bool owned = 10;
  bool pulls = 11;
  int64 per_page = 12;
  int64 page = 13;
}

message GitHubListIssuesAssignedToTheAuthenticatedUserResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubIssuesIssuesIssue items = 3;
}

// GET /orgs/{org}/issues
// Response: same response schema as List issues assigned to the authenticated user.
message GitHubListOrganizationIssuesAssignedToTheAuthenticatedUserRequest {
  string namespace = 1;
  string org = 2;
  string filter = 3;
  string state = 4;
  string labels = 5;
  string type = 6;
  string sort = 7;
  string direction = 8;
  string since = 9;
  int64 per_page = 10;
  int64 page = 11;
}

// GET /repos/{owner}/{repo}/issues
// Response: same response schema as List issues assigned to the authenticated user.
message GitHubListRepositoryIssuesRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string milestone = 4;
  string state = 5;
  string assignee = 6;
  string type = 7;
  string creator = 8;
  string mentioned = 9;
  string issue_field_values = 10;
  string labels = 11;
  string sort = 12;
  string direction = 13;
  string since = 14;
  int64 per_page = 15;
  int64 page = 16;
}

// POST /repos/{owner}/{repo}/issues
message GitHubCreateAnIssueRequest {
  message IssueFieldValues {
    int64 field_id = 1;
    // string or number or array
    google.protobuf.Value value = 2;
  }

  string namespace = 1;
  string owner = 2;
  string repo = 3;
  // string or integer
  google.protobuf.Value title = 4;
  string body = 5;
  // null or string or integer
  google.protobuf.Value milestone = 6;
  // array; the page gives no item type
  repeated google.protobuf.Value labels = 7;
  repeated string assignees = 8;
  repeated IssueFieldValues issue_field_values = 9;
  string type = 10;
  int64 parent_issue_id = 11;
}

message GitHubCreateAnIssueResponse {
  bool success = 1;
  string error = 2;
  int64 id = 3;
  string node_id = 4;
  string url = 5;
  string repository_url = 6;
  string labels_url = 7;
  string comments_url = 8;
  string events_url = 9;
  string html_url = 10;
  int64 number = 11;
  string state = 12;
  string state_reason = 13;
  string title = 14;
  string body = 15;
  GitHubIssuesIssuesSimpleUser user = 16;
  repeated google.protobuf.Struct labels = 17;
  repeated GitHubIssuesIssuesSimpleUser assignees = 18;
  GitHubIssuesIssuesMilestone milestone = 19;
  bool locked = 20;
  string active_lock_reason = 21;
  int64 comments = 22;
  GitHubIssuesIssuesIssue.PullRequest pull_request = 23;
  string closed_at = 24;
  string created_at = 25;
  string updated_at = 26;
  bool draft = 27;
  GitHubIssuesIssuesSimpleUser closed_by = 28;
  string body_html = 29;
  string body_text = 30;
  string timeline_url = 31;
  GitHubIssuesIssuesIssueType type = 32;
  GitHubIssuesIssuesRepository repository = 33;
  GitHubIssuesIssuesGitHubApp performed_via_github_app = 34;
  string author_association = 35;
  GitHubIssuesIssuesReactionRollup reactions = 36;
  GitHubIssuesIssuesSubIssuesSummary sub_issues_summary = 37;
  string parent_issue_url = 38;
  GitHubIssuesIssuesIssueComment pinned_comment = 39;
  GitHubIssuesIssuesIssueDependenciesSummary issue_dependencies_summary = 40;
  repeated GitHubIssuesIssuesIssueFieldValue issue_field_values = 41;
}

// GET /repos/{owner}/{repo}/issues/{issue_number}
// Response: same response schema as Create an issue.
message GitHubGetAnIssueRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
}

// PATCH /repos/{owner}/{repo}/issues/{issue_number}
message GitHubUpdateAnIssueRequest {
  message IssueFieldValues {
    int64 field_id = 1;
    // string or number or array
    google.protobuf.Value value = 2;
    string rationale = 3;
    bool suggest = 4;
    string confidence = 5;
  }

  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  // null or string or integer
  google.protobuf.Value title = 5;
  string body = 6;
  string state = 7;
  string state_reason = 8;
  int64 duplicate_issue_id = 9;
  // null or string or integer
  google.protobuf.Value milestone = 10;
  // array; the page gives no item type
  repeated google.protobuf.Value labels = 11;
  // array; the page gives no item type
  repeated google.protobuf.Value assignees = 12;
  repeated IssueFieldValues issue_field_values = 13;
  // null or string or object
  google.protobuf.Value type = 14;
}

// All of Issue and an object with suggestions.
message GitHubUpdateAnIssueResponse {
  message Suggestions {
    message Type {
      string value = 1;
      string rationale = 2;
      bool suggest = 3;
      string confidence = 4;
      bool ignored = 5;
      string ignored_reason = 6;
    }

    message IssueFieldValues {
      int64 field_id = 1;
      // One of string, number or array.
      google.protobuf.Value value = 2;
      string rationale = 3;
      bool suggest = 4;
      string confidence = 5;
      bool ignored = 6;
      string ignored_reason = 7;
    }

    message Labels {
      string name = 1;
      string rationale = 2;
      bool suggest = 3;
      string confidence = 4;
      bool ignored = 5;
      string ignored_reason = 6;
    }

    message Assignees {
      string login = 1;
      string rationale = 2;
      bool suggest = 3;
      string confidence = 4;
      bool ignored = 5;
      string ignored_reason = 6;
    }

    message State {
      string value = 1;
      string state_reason = 2;
      int64 duplicate_issue_id = 3;
      string rationale = 4;
      bool suggest = 5;
      string confidence = 6;
      bool ignored = 7;
      string ignored_reason = 8;
    }

    repeated Type type = 1;
    repeated IssueFieldValues issue_field_values = 2;
    repeated Labels labels = 3;
    repeated Assignees assignees = 4;
    repeated State state = 5;
  }

  bool success = 1;
  string error = 2;
  int64 id = 3;
  string node_id = 4;
  string url = 5;
  string repository_url = 6;
  string labels_url = 7;
  string comments_url = 8;
  string events_url = 9;
  string html_url = 10;
  int64 number = 11;
  string state = 12;
  string state_reason = 13;
  string title = 14;
  string body = 15;
  GitHubIssuesIssuesSimpleUser user = 16;
  repeated google.protobuf.Struct labels = 17;
  repeated GitHubIssuesIssuesSimpleUser assignees = 18;
  GitHubIssuesIssuesMilestone milestone = 19;
  bool locked = 20;
  string active_lock_reason = 21;
  int64 comments = 22;
  GitHubIssuesIssuesIssue.PullRequest pull_request = 23;
  string closed_at = 24;
  string created_at = 25;
  string updated_at = 26;
  bool draft = 27;
  GitHubIssuesIssuesSimpleUser closed_by = 28;
  string body_html = 29;
  string body_text = 30;
  string timeline_url = 31;
  GitHubIssuesIssuesIssueType type = 32;
  GitHubIssuesIssuesRepository repository = 33;
  GitHubIssuesIssuesGitHubApp performed_via_github_app = 34;
  string author_association = 35;
  GitHubIssuesIssuesReactionRollup reactions = 36;
  GitHubIssuesIssuesSubIssuesSummary sub_issues_summary = 37;
  string parent_issue_url = 38;
  GitHubIssuesIssuesIssueComment pinned_comment = 39;
  GitHubIssuesIssuesIssueDependenciesSummary issue_dependencies_summary = 40;
  repeated GitHubIssuesIssuesIssueFieldValue issue_field_values = 41;
  Suggestions suggestions = 42;
}

// PUT /repos/{owner}/{repo}/issues/{issue_number}/lock
message GitHubLockAnIssueRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  string lock_reason = 5;
}

message GitHubLockAnIssueResponse {
  bool success = 1;
  string error = 2;
}

// DELETE /repos/{owner}/{repo}/issues/{issue_number}/lock
message GitHubUnlockAnIssueRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
}

message GitHubUnlockAnIssueResponse {
  bool success = 1;
  string error = 2;
}

// GET /repos/{owner}/{repo}/issues/{issue_number}/suggestions
message GitHubListIssueSuggestionsRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  string state = 5;
  string action = 6;
  int64 per_page = 7;
  int64 page = 8;
}

message GitHubListIssueSuggestionsResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubIssuesIssuesIssueSuggestion items = 3;
}

// POST /repos/{owner}/{repo}/issues/{issue_number}/suggestions/{suggestion_id}/approve
message GitHubApproveAnIssueSuggestionRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  int64 suggestion_id = 5;
}

message GitHubApproveAnIssueSuggestionResponse {
  bool success = 1;
  string error = 2;
  int64 id = 3;
  int64 issue_id = 4;
  string action = 5;
  string state = 6;
  int64 target_id = 7;
  // One of string, number, boolean or array.
  google.protobuf.Value target_value = 8;
  string rationale = 9;
  string confidence = 10;
  int64 actor_id = 11;
  int64 issue_event_id = 12;
  int64 resolved_by = 13;
  string created_at = 14;
  string updated_at = 15;
}

// POST /repos/{owner}/{repo}/issues/{issue_number}/suggestions/{suggestion_id}/dismiss
// Response: same response schema as Approve an issue suggestion.
message GitHubDismissAnIssueSuggestionRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  int64 suggestion_id = 5;
}

// GET /user/issues
// Response: same response schema as List issues assigned to the authenticated user.
message GitHubListUserAccountIssuesAssignedToTheAuthenticatedUserRequest {
  string namespace = 1;
  string filter = 2;
  string state = 3;
  string labels = 4;
  string sort = 5;
  string direction = 6;
  string since = 7;
  int64 per_page = 8;
  int64 page = 9;
}

// Issue
message GitHubIssuesIssuesIssue {
  message PullRequest {
    string merged_at = 1;
    string diff_url = 2;
    string html_url = 3;
    string patch_url = 4;
    string url = 5;
  }

  int64 id = 1;
  string node_id = 2;
  string url = 3;
  string repository_url = 4;
  string labels_url = 5;
  string comments_url = 6;
  string events_url = 7;
  string html_url = 8;
  int64 number = 9;
  string state = 10;
  string state_reason = 11;
  string title = 12;
  string body = 13;
  GitHubIssuesIssuesSimpleUser user = 14;
  repeated google.protobuf.Struct labels = 15;
  repeated GitHubIssuesIssuesSimpleUser assignees = 16;
  GitHubIssuesIssuesMilestone milestone = 17;
  bool locked = 18;
  string active_lock_reason = 19;
  int64 comments = 20;
  PullRequest pull_request = 21;
  string closed_at = 22;
  string created_at = 23;
  string updated_at = 24;
  bool draft = 25;
  GitHubIssuesIssuesSimpleUser closed_by = 26;
  string body_html = 27;
  string body_text = 28;
  string timeline_url = 29;
  GitHubIssuesIssuesIssueType type = 30;
  GitHubIssuesIssuesRepository repository = 31;
  GitHubIssuesIssuesGitHubApp performed_via_github_app = 32;
  string author_association = 33;
  GitHubIssuesIssuesReactionRollup reactions = 34;
  GitHubIssuesIssuesSubIssuesSummary sub_issues_summary = 35;
  string parent_issue_url = 36;
  GitHubIssuesIssuesIssueComment pinned_comment = 37;
  GitHubIssuesIssuesIssueDependenciesSummary issue_dependencies_summary = 38;
  repeated GitHubIssuesIssuesIssueFieldValue issue_field_values = 39;
}

