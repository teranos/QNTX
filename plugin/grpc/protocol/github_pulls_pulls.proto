syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043
// https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10

// GET /repos/{owner}/{repo}/pulls
message GitHubListPullRequestsRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string state = 4;
  string head = 5;
  string base = 6;
  string sort = 7;
  string direction = 8;
  int64 per_page = 9;
  int64 page = 10;
}

message GitHubListPullRequestsResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubPullsPullsPullRequestSimple items = 3;
}

// POST /repos/{owner}/{repo}/pulls
message GitHubCreateAPullRequestRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string title = 4;
  string head = 5;
  string head_repo = 6;
  string base = 7;
  string body = 8;
  bool maintainer_can_modify = 9;
  bool draft = 10;
  int64 issue = 11;
}

message GitHubCreateAPullRequestResponse {
  bool success = 1;
  string error = 2;
  string url = 3;
  int64 id = 4;
  string node_id = 5;
  string html_url = 6;
  string diff_url = 7;
  string patch_url = 8;
  string issue_url = 9;
  string commits_url = 10;
  string review_comments_url = 11;
  string review_comment_url = 12;
  string comments_url = 13;
  string statuses_url = 14;
  int64 number = 15;
  string state = 16;
  bool locked = 17;
  string title = 18;
  GitHubPullsPullsSimpleUser user = 19;
  string body = 20;
  repeated GitHubPullsPullsPullRequestSimple.Labels labels = 21;
  GitHubPullsPullsMilestone milestone = 22;
  string active_lock_reason = 23;
  string created_at = 24;
  string updated_at = 25;
  string closed_at = 26;
  string merged_at = 27;
  repeated GitHubPullsPullsSimpleUser assignees = 28;
  repeated GitHubPullsPullsSimpleUser requested_reviewers = 29;
  repeated GitHubPullsPullsTeamSimple requested_teams = 30;
  GitHubPullsPullsPullRequestSimple.Head head = 31;
  GitHubPullsPullsPullRequestSimple.Base base = 32;
  GitHubPullsPullsPullRequestSimple.Links _links = 33;
  string author_association = 34;
  GitHubPullsPullsAutoMerge auto_merge = 35;
  GitHubPullsPullsPullRequestStack stack = 36;
  bool draft = 37;
  bool merged = 38;
  bool mergeable = 39;
  bool rebaseable = 40;
  string mergeable_state = 41;
  GitHubPullsPullsSimpleUser merged_by = 42;
  int64 comments = 43;
  int64 review_comments = 44;
  bool maintainer_can_modify = 45;
  int64 commits = 46;
  int64 additions = 47;
  int64 deletions = 48;
  int64 changed_files = 49;
}

// GET /repos/{owner}/{repo}/pulls/{pull_number}
// Response: same response schema as Create a pull request.
message GitHubGetAPullRequestRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
}

// PATCH /repos/{owner}/{repo}/pulls/{pull_number}
// Response: same response schema as Create a pull request.
message GitHubUpdateAPullRequestRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  string title = 5;
  string body = 6;
  string state = 7;
  string base = 8;
  bool maintainer_can_modify = 9;
}

// GET /repos/{owner}/{repo}/pulls/{pull_number}/commits
message GitHubListCommitsOnAPullRequestRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  int64 per_page = 5;
  int64 page = 6;
}

message GitHubListCommitsOnAPullRequestResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubPullsPullsCommit items = 3;
}

// GET /repos/{owner}/{repo}/pulls/{pull_number}/files
message GitHubListPullRequestsFilesRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  int64 per_page = 5;
  int64 page = 6;
}

message GitHubListPullRequestsFilesResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubPullsPullsDiffEntry items = 3;
}

// GET /repos/{owner}/{repo}/pulls/{pull_number}/merge
message GitHubCheckIfAPullRequestHasBeenMergedRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
}

message GitHubCheckIfAPullRequestHasBeenMergedResponse {
  bool success = 1;
  string error = 2;
}

// PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge
message GitHubMergeAPullRequestRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  string commit_title = 5;
  string commit_message = 6;
  string sha = 7;
  string merge_method = 8;
}

message GitHubMergeAPullRequestResponse {
  bool success = 1;
  string error = 2;
  string sha = 3;
  bool merged = 4;
  string message = 5;
}

// PUT /repos/{owner}/{repo}/pulls/{pull_number}/merge-async
message GitHubMergeAPullRequestAsynchronouslyRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  string commit_title = 5;
  string commit_message = 6;
  string sha = 7;
  string merge_method = 8;
  string merge_action = 9;
}

message GitHubMergeAPullRequestAsynchronouslyResponse {
  // details is one of three objects on the page; their fields are listed together here.
  message Details {
    string message = 1;
    string uuid = 2;
    string merge_method = 3;
    string merge_action = 4;
    string expected_head_sha = 5;
    string sha = 6;
  }

  bool success = 1;
  string error = 2;
  string status = 3;
  Details details = 4;
}

// GET /repos/{owner}/{repo}/pulls/{pull_number}/merge-async/{uuid}
// Response: same response schema as Merge a pull request asynchronously.
message GitHubGetTheResultOfAnAsynchronousMergeRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  string uuid = 5;
}

// PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch
message GitHubUpdateAPullRequestBranchRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 pull_number = 4;
  string expected_head_sha = 5;
}

message GitHubUpdateAPullRequestBranchResponse {
  bool success = 1;
  string error = 2;
  string message = 3;
  string url = 4;
}

// Pull Request Simple
message GitHubPullsPullsPullRequestSimple {
  message Labels {
    int64 id = 1;
    string node_id = 2;
    string url = 3;
    string name = 4;
    string description = 5;
    string color = 6;
    bool default = 7;
    GitHubPullsPullsSimpleUser archived_by = 8;
  }

  message Head {
    string label = 1;
    string ref = 2;
    GitHubPullsPullsRepository repo = 3;
    string sha = 4;
    GitHubPullsPullsSimpleUser user = 5;
  }

  message Base {
    string label = 1;
    string ref = 2;
    GitHubPullsPullsRepository repo = 3;
    string sha = 4;
    GitHubPullsPullsSimpleUser user = 5;
  }

  message Links {
    GitHubPullsPullsLink comments = 1;
    GitHubPullsPullsLink commits = 2;
    GitHubPullsPullsLink statuses = 3;
    GitHubPullsPullsLink html = 4;
    GitHubPullsPullsLink issue = 5;
    GitHubPullsPullsLink review_comments = 6;
    GitHubPullsPullsLink review_comment = 7;
    GitHubPullsPullsLink self = 8;
  }

  string url = 1;
  int64 id = 2;
  string node_id = 3;
  string html_url = 4;
  string diff_url = 5;
  string patch_url = 6;
  string issue_url = 7;
  string commits_url = 8;
  string review_comments_url = 9;
  string review_comment_url = 10;
  string comments_url = 11;
  string statuses_url = 12;
  int64 number = 13;
  string state = 14;
  bool locked = 15;
  string title = 16;
  GitHubPullsPullsSimpleUser user = 17;
  string body = 18;
  repeated Labels labels = 19;
  GitHubPullsPullsMilestone milestone = 20;
  string active_lock_reason = 21;
  string created_at = 22;
  string updated_at = 23;
  string closed_at = 24;
  string merged_at = 25;
  repeated GitHubPullsPullsSimpleUser assignees = 26;
  repeated GitHubPullsPullsSimpleUser requested_reviewers = 27;
  repeated GitHubPullsPullsTeam requested_teams = 28;
  Head head = 29;
  Base base = 30;
  Links _links = 31;
  string author_association = 32;
  GitHubPullsPullsAutoMerge auto_merge = 33;
  GitHubPullsPullsPullRequestStack stack = 34;
  bool draft = 35;
}

// Simple User
message GitHubPullsPullsSimpleUser {
  string name = 1;
  string email = 2;
  string login = 3;
  int64 id = 4;
  string node_id = 5;
  string avatar_url = 6;
  string gravatar_id = 7;
  string url = 8;
  string html_url = 9;
  string followers_url = 10;
  string following_url = 11;
  string gists_url = 12;
  string starred_url = 13;
  string subscriptions_url = 14;
  string organizations_url = 15;
  string repos_url = 16;
  string events_url = 17;
  string received_events_url = 18;
  string type = 19;
  bool site_admin = 20;
  string starred_at = 21;
  string user_view_type = 22;
}

// Milestone
message GitHubPullsPullsMilestone {
  string url = 1;
  string html_url = 2;
  string labels_url = 3;
  int64 id = 4;
  string node_id = 5;
  int64 number = 6;
  string state = 7;
  string title = 8;
  string description = 9;
  GitHubPullsPullsSimpleUser creator = 10;
  int64 open_issues = 11;
  int64 closed_issues = 12;
  string created_at = 13;
  string updated_at = 14;
  string closed_at = 15;
  string due_on = 16;
}

// Team
message GitHubPullsPullsTeam {
  message Permissions {
    bool pull = 1;
    bool triage = 2;
    bool push = 3;
    bool maintain = 4;
    bool admin = 5;
  }

  int64 id = 1;
  string node_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  string privacy = 6;
  string notification_setting = 7;
  string permission = 8;
  Permissions permissions = 9;
  string url = 10;
  string html_url = 11;
  string members_url = 12;
  string repositories_url = 13;
  string type = 14;
  string access_source = 15;
  int64 organization_id = 16;
  int64 enterprise_id = 17;
  GitHubPullsPullsTeamSimple parent = 18;
}

// Team Simple
message GitHubPullsPullsTeamSimple {
  int64 id = 1;
  string node_id = 2;
  string url = 3;
  string members_url = 4;
  string name = 5;
  string description = 6;
  string permission = 7;
  string privacy = 8;
  string notification_setting = 9;
  string html_url = 10;
  string repositories_url = 11;
  string slug = 12;
  string ldap_dn = 13;
  string type = 14;
  int64 organization_id = 15;
  int64 enterprise_id = 16;
}

// Repository
message GitHubPullsPullsRepository {
  message Permissions {
    bool admin = 1;
    bool pull = 2;
    bool triage = 3;
    bool push = 4;
    bool maintain = 5;
  }

  message CodeSearchIndexStatus {
    bool lexical_search_ok = 1;
    string lexical_commit_sha = 2;
  }

  int64 id = 1;
  string node_id = 2;
  string name = 3;
  string full_name = 4;
  GitHubPullsPullsLicenseSimple license = 5;
  int64 forks = 6;
  Permissions permissions = 7;
  GitHubPullsPullsSimpleUser owner = 8;
  bool private = 9;
  string html_url = 10;
  string description = 11;
  bool fork = 12;
  string url = 13;
  string archive_url = 14;
  string assignees_url = 15;
  string blobs_url = 16;
  string branches_url = 17;
  string collaborators_url = 18;
  string comments_url = 19;
  string commits_url = 20;
  string compare_url = 21;
  string contents_url = 22;
  string contributors_url = 23;
  string deployments_url = 24;
  string downloads_url = 25;
  string events_url = 26;
  string forks_url = 27;
  string git_commits_url = 28;
  string git_refs_url = 29;
  string git_tags_url = 30;
  string git_url = 31;
  string issue_comment_url = 32;
  string issue_events_url = 33;
  string issues_url = 34;
  string keys_url = 35;
  string labels_url = 36;
  string languages_url = 37;
  string merges_url = 38;
  string milestones_url = 39;
  string notifications_url = 40;
  string pulls_url = 41;
  string releases_url = 42;
  string ssh_url = 43;
  string stargazers_url = 44;
  string statuses_url = 45;
  string subscribers_url = 46;
  string subscription_url = 47;
  string tags_url = 48;
  string teams_url = 49;
  string trees_url = 50;
  string clone_url = 51;
  string mirror_url = 52;
  string hooks_url = 53;
  string svn_url = 54;
  string homepage = 55;
  string language = 56;
  int64 forks_count = 57;
  int64 stargazers_count = 58;
  int64 watchers_count = 59;
  int64 size = 60;
  string default_branch = 61;
  int64 open_issues_count = 62;
  bool is_template = 63;
  repeated string topics = 64;
  bool has_issues = 65;
  bool has_projects = 66;
  bool has_wiki = 67;
  bool has_pages = 68;
  bool has_discussions = 69;
  bool has_pull_requests = 70;
  string pull_request_creation_policy = 71;
  bool archived = 72;
  bool disabled = 73;
  string visibility = 74;
  string pushed_at = 75;
  string created_at = 76;
  string updated_at = 77;
  bool allow_rebase_merge = 78;
  string temp_clone_token = 79;
  bool allow_squash_merge = 80;
  bool allow_auto_merge = 81;
  bool delete_branch_on_merge = 82;
  bool allow_update_branch = 83;
  string squash_merge_commit_title = 84;
  string squash_merge_commit_message = 85;
  string merge_commit_title = 86;
  string merge_commit_message = 87;
  bool allow_merge_commit = 88;
  bool allow_forking = 89;
  bool web_commit_signoff_required = 90;
  int64 open_issues = 91;
  int64 watchers = 92;
  string starred_at = 93;
  bool anonymous_access_enabled = 94;
  CodeSearchIndexStatus code_search_index_status = 95;
}

// License Simple
message GitHubPullsPullsLicenseSimple {
  string key = 1;
  string name = 2;
  string url = 3;
  string spdx_id = 4;
  string node_id = 5;
  string html_url = 6;
}

// Link
message GitHubPullsPullsLink {
  string href = 1;
}

// Auto merge
message GitHubPullsPullsAutoMerge {
  GitHubPullsPullsSimpleUser enabled_by = 1;
  string merge_method = 2;
  string commit_title = 3;
  string commit_message = 4;
}

// Pull Request Stack
message GitHubPullsPullsPullRequestStack {
  message Base {
    string ref = 1;
    string sha = 2;
  }

  Base base = 1;
  int64 size = 2;
  int64 position = 3;
  int64 id = 4;
  int64 number = 5;
}

// Commit
message GitHubPullsPullsCommit {
  message Commit {
    message Tree {
      string sha = 1;
      string url = 2;
    }

    string url = 1;
    GitHubPullsPullsGitUser author = 2;
    GitHubPullsPullsGitUser committer = 3;
    string message = 4;
    int64 comment_count = 5;
    Tree tree = 6;
    GitHubPullsPullsVerification verification = 7;
  }

  message Parents {
    string sha = 1;
    string url = 2;
    string html_url = 3;
  }

  message Stats {
    int64 additions = 1;
    int64 deletions = 2;
    int64 total = 3;
  }

  string url = 1;
  string sha = 2;
  string node_id = 3;
  string html_url = 4;
  string comments_url = 5;
  Commit commit = 6;
  GitHubPullsPullsSimpleUser author = 7;
  GitHubPullsPullsSimpleUser committer = 8;
  repeated Parents parents = 9;
  Stats stats = 10;
  repeated GitHubPullsPullsDiffEntry files = 11;
}

// Git User
message GitHubPullsPullsGitUser {
  string name = 1;
  string email = 2;
  string date = 3;
}

// Verification
message GitHubPullsPullsVerification {
  bool verified = 1;
  string reason = 2;
  string payload = 3;
  string signature = 4;
  string verified_at = 5;
}

// Diff Entry
message GitHubPullsPullsDiffEntry {
  string sha = 1;
  string filename = 2;
  string status = 3;
  int64 additions = 4;
  int64 deletions = 5;
  int64 changes = 6;
  string blob_url = 7;
  string raw_url = 8;
  string contents_url = 9;
  string patch = 10;
  string previous_filename = 11;
}
