syntax = "proto3";

package protocol;

import "google/protobuf/struct.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043
// https://docs.github.com/en/rest/checks/suites?apiVersion=2026-03-10

message GitHubChecksSuitesCreateACheckSuiteRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string head_sha = 4;
}

message GitHubChecksSuitesCreateACheckSuiteResponse {
  bool success = 1;
  string error = 2;
  int64 id = 3;
  string node_id = 4;
  string head_branch = 5;
  string head_sha = 6;
  string status = 7;
  string conclusion = 8;
  string url = 9;
  string before = 10;
  string after = 11;
  repeated GitHubChecksSuitesPullRequestMinimal pull_requests = 12;
  GitHubChecksSuitesGitHubApp app = 13;
  GitHubChecksSuitesMinimalRepository repository = 14;
  string created_at = 15;
  string updated_at = 16;
  GitHubChecksSuitesSimpleCommit head_commit = 17;
  int64 latest_check_runs_count = 18;
  string check_runs_url = 19;
  bool rerequestable = 20;
  bool runs_rerequestable = 21;
}

message GitHubChecksSuitesUpdateRepositoryPreferencesForCheckSuitesRequest {
  message AutoTriggerChecks {
    int64 app_id = 1;
    bool setting = 2;
  }
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  repeated AutoTriggerChecks auto_trigger_checks = 4;
}

message GitHubChecksSuitesUpdateRepositoryPreferencesForCheckSuitesResponse {
  message Preferences {
    message AutoTriggerChecks {
      int64 app_id = 1;
      bool setting = 2;
    }
    repeated AutoTriggerChecks auto_trigger_checks = 1;
  }
  bool success = 1;
  string error = 2;
  Preferences preferences = 3;
  GitHubChecksSuitesMinimalRepository repository = 4;
}

message GitHubChecksSuitesGetACheckSuiteRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_suite_id = 4;
}

message GitHubChecksSuitesRerequestACheckSuiteRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_suite_id = 4;
}

message GitHubChecksSuitesRerequestACheckSuiteResponse {
  bool success = 1;
  string error = 2;
}

message GitHubChecksSuitesListCheckSuitesForAGitReferenceRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string ref = 4;
  int64 app_id = 5;
  string check_name = 6;
  int64 per_page = 7;
  int64 page = 8;
}

message GitHubChecksSuitesListCheckSuitesForAGitReferenceResponse {
  bool success = 1;
  string error = 2;
  int64 total_count = 3;
  repeated GitHubChecksSuitesCheckSuite check_suites = 4;
}

message GitHubChecksSuitesPullRequestMinimal {
  message Head {
    message Repo {
      int64 id = 1;
      string url = 2;
      string name = 3;
    }
    string ref = 1;
    string sha = 2;
    Repo repo = 3;
  }
  message Base {
    message Repo {
      int64 id = 1;
      string url = 2;
      string name = 3;
    }
    string ref = 1;
    string sha = 2;
    Repo repo = 3;
  }
  int64 id = 1;
  int64 number = 2;
  string url = 3;
  Head head = 4;
  Base base = 5;
}

message GitHubChecksSuitesSimpleUser {
  string name = 1;
  string email = 2;
  string login = 3;
  int64 id = 4;
  string node_id = 5;
  string avatar_url = 6;
  string gravatar_id = 7;
  string url = 8;
  string html_url = 9;
  string followers_url = 10;
  string following_url = 11;
  string gists_url = 12;
  string starred_url = 13;
  string subscriptions_url = 14;
  string organizations_url = 15;
  string repos_url = 16;
  string events_url = 17;
  string received_events_url = 18;
  string type = 19;
  bool site_admin = 20;
  string starred_at = 21;
  string user_view_type = 22;
}

message GitHubChecksSuitesEnterprise {
  string description = 1;
  string html_url = 2;
  string website_url = 3;
  int64 id = 4;
  string node_id = 5;
  string name = 6;
  string slug = 7;
  string created_at = 8;
  string updated_at = 9;
  string avatar_url = 10;
}

message GitHubChecksSuitesGitHubApp {
  int64 id = 1;
  string slug = 2;
  string node_id = 3;
  string client_id = 4;
  google.protobuf.Value owner = 5;
  string name = 6;
  string description = 7;
  string external_url = 8;
  string html_url = 9;
  string created_at = 10;
  string updated_at = 11;
  map<string, string> permissions = 12;
  repeated string events = 13;
  int64 installations_count = 14;
}

message GitHubChecksSuitesCodeOfConduct {
  string key = 1;
  string name = 2;
  string url = 3;
  string body = 4;
  string html_url = 5;
}

