syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043
// https://docs.github.com/en/rest/pulls/review-requests?apiVersion=2026-03-10

message GitHubPullsReviewRequestsGetAllRequestedReviewersForAPullRequestRequest {
  string namespace = 1;
}

message GitHubPullsReviewRequestsGetAllRequestedReviewersForAPullRequestResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubPullsReviewRequestsSimpleUser users = 3;
  repeated GitHubPullsReviewRequestsTeam teams = 4;
}

message GitHubPullsReviewRequestsRequestReviewersForAPullRequestRequest {
  string namespace = 1;
}

message GitHubPullsReviewRequestsRequestReviewersForAPullRequestResponse {
  message Labels {
    int64 id = 1;
    string node_id = 2;
    string url = 3;
    string name = 4;
    string description = 5;
    string color = 6;
    bool default = 7;
    GitHubPullsReviewRequestsSimpleUser archived_by = 8;
  }
  message Head {
    string label = 1;
    string ref = 2;
    GitHubPullsReviewRequestsRepository repo = 3;
    string sha = 4;
    GitHubPullsReviewRequestsSimpleUser user = 5;
  }
  message Base {
    string label = 1;
    string ref = 2;
    GitHubPullsReviewRequestsRepository repo = 3;
    string sha = 4;
    GitHubPullsReviewRequestsSimpleUser user = 5;
  }
  message Links {
    GitHubPullsReviewRequestsLink comments = 1;
    GitHubPullsReviewRequestsLink commits = 2;
    GitHubPullsReviewRequestsLink statuses = 3;
    GitHubPullsReviewRequestsLink html = 4;
    GitHubPullsReviewRequestsLink issue = 5;
    GitHubPullsReviewRequestsLink review_comments = 6;
    GitHubPullsReviewRequestsLink review_comment = 7;
    GitHubPullsReviewRequestsLink self = 8;
  }
  bool success = 1;
  string error = 2;
  string url = 3;
  int64 id = 4;
  string node_id = 5;
  string html_url = 6;
  string diff_url = 7;
  string patch_url = 8;
  string issue_url = 9;
  string commits_url = 10;
  string review_comments_url = 11;
  string review_comment_url = 12;
  string comments_url = 13;
  string statuses_url = 14;
  int64 number = 15;
  string state = 16;
  bool locked = 17;
  string title = 18;
  GitHubPullsReviewRequestsSimpleUser user = 19;
  string body = 20;
  repeated Labels labels = 21;
  GitHubPullsReviewRequestsMilestone milestone = 22;
  string active_lock_reason = 23;
  string created_at = 24;
  string updated_at = 25;
  string closed_at = 26;
  string merged_at = 27;
  repeated GitHubPullsReviewRequestsSimpleUser assignees = 28;
  repeated GitHubPullsReviewRequestsSimpleUser requested_reviewers = 29;
  repeated GitHubPullsReviewRequestsTeam requested_teams = 30;
  Head head = 31;
  Base base = 32;
  Links _links = 33;
  string author_association = 34;
  GitHubPullsReviewRequestsAutoMerge auto_merge = 35;
  GitHubPullsReviewRequestsPullRequestStack stack = 36;
  bool draft = 37;
}

message GitHubPullsReviewRequestsRemoveRequestedReviewersFromAPullRequestRequest {
  string namespace = 1;
}

message GitHubPullsReviewRequestsSimpleUser {
  string name = 1;
  string email = 2;
  string login = 3;
  int64 id = 4;
  string node_id = 5;
  string avatar_url = 6;
  string gravatar_id = 7;
  string url = 8;
  string html_url = 9;
  string followers_url = 10;
  string following_url = 11;
  string gists_url = 12;
  string starred_url = 13;
  string subscriptions_url = 14;
  string organizations_url = 15;
  string repos_url = 16;
  string events_url = 17;
  string received_events_url = 18;
  string type = 19;
  bool site_admin = 20;
  string starred_at = 21;
  string user_view_type = 22;
}

message GitHubPullsReviewRequestsTeamSimple {
  int64 id = 1;
  string node_id = 2;
  string url = 3;
  string members_url = 4;
  string name = 5;
  string description = 6;
  string permission = 7;
