syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// What a datapunt records when somebody arrives (ADR-035). The shape is the
// industry's: Plausible's `events_v2` and Umami's `website_event` agree on
// nearly all of it, and site analytics is finished work.
message Arrival {
  // When the datapunt fired. The only field the node authors, because it is the
  // only one the visitor cannot claim.
  string at = 1;

  // The datapunt. Every other tool calls this site_id.
  string market = 2;
  string slug = 3;

  // A person, durable across visits.
  string visitor = 4;

  // One sitting, ending when the tab does. Umami carries both ids; without
  // this one a person is a single visit forever.
  string visit = 5;

  // The page. Path is what gets grouped, query is read once.
  string path = 6;
  string query = 7;

  // The event the pixel side named. Naming none is a page view, and page_view
  // is Google's word for it — borrowed, so a site firing gtag needs no
  // translation, rather than a word the node invented.
  string event = 8;

  // Split on arrival. Grouping by domain is the question people ask, and a
  // whole URL answers it only after being taken apart again every time.
  string referrer_domain = 9;
  string referrer_path = 10;

  // The campaign five. Fields rather than params because every tool and every
  // ad platform already agrees on these names.
  string utm_source = 11;
  string utm_medium = 12;
  string utm_campaign = 13;
  string utm_content = 14;
  string utm_term = 15;

  // Derived at ingest from a user agent the node then drops. Nobody stores the
  // raw string: it identifies, it is unbounded, and this is what gets queried.
  string browser = 16;
  string browser_version = 17;
  string operating_system = 18;
  string operating_system_version = 19;
  string device = 20;

  // Sent by the snippet, because a server cannot see it. A bucket rather than
  // a pixel count, by convention.
  string screen = 21;

  // Derived at ingest from an address the node then drops. The answer is what
  // gets asked for; the source of it is what identifies a person.
  string country = 22;
  string region = 23;
  string city = 24;

  // The language the browser asked in.
  string language = 25;

  // What the site attached, verbatim. The node never learns what a key means —
  // the line between analytics for anyone and analytics for one customer.
  map<string, string> params = 26;

  // What the node decided rather than read. A hit from a bot still happened;
  // only the judgement is ours.
  bool bot = 27;
}

// One sitting, derived from the arrivals carrying its visit id. Nothing writes
// a Visit — it is a projection and the arrivals stay the record, the same way
// Plausible maintains sessions as a view over its event table.
message Visit {
  string visit = 1;
  string visitor = 2;

  string market = 3;
  string slug = 4;

  // Duration is the difference, carried because it is asked for constantly and
  // derived identically by everyone.
  string started = 5;
  string ended = 6;
  uint32 duration_seconds = 7;

  // The two pages worth naming out of however many they saw.
  string entry_path = 8;
  string exit_path = 9;

  uint32 views = 10;
  uint32 events = 11;

  // One arrival and gone. A convention, not a measurement: defining it
  // differently makes the number incomparable to everyone else's.
  bool bounce = 12;
}

// DatapuntCreated is what datapunts create answers.
message DatapuntCreated {
  // The datapunt that was created.
  string slug = 1;
  // The path its pixel is fired at.
  string url = 2;
}

// DatapuntTakenDown is what datapunts take-down answers.
message DatapuntTakenDown {
  // The datapunt that was taken down.
  string slug = 1;
  // removed.
  string status = 2;
}

// Datapunt is one datapunt as the datapunts element sees it. Beyond what it is (slug,
// namespace, URL) it carries its defining system attestation — the ASID, when
// it was created, and the DID that created it — the door it inherits from its
// namespace, the sites reporting back, and its activity: arrivals recorded
// against arrivals the rate limit refused, and when the last landed.
//
// defId and lastSeen are named as the view has always read them.
message Datapunt {
  string slug = 1;
  string market = 2;
  string url = 3;
  string origin = 4;
  string creator = 5;
  string defId = 6;
  string created = 7;
  repeated string sites = 8;
  uint32 arrivals = 9;
  uint32 visitors = 10;
  uint32 dropped = 11;
  string lastSeen = 12;
  repeated DatapuntSeen events = 13;
  repeated DatapuntSeen pages = 14;
  // How the people who arrived actually walked — what the counts above are a
  // fold of.
  repeated DatapuntWalk walks = 15;
}

// DatapuntSeen is an event or a page and every moment it was attested, in unix
// milliseconds. "The axis of time is more useful than a tally": the view draws
// these as a line over time, and a count is not sent.
message DatapuntSeen {
  string name = 1;
  // A JSON number, as the view reads it: protojson writes a 64-bit integer as
  // text, and a millisecond is exact in a double.
  repeated double seen = 2;
}

// DatapuntStep is one arrival read as a step rather than as a number: when it
// landed, the page it was about, and the event the pixel named.
message DatapuntStep {
  string at = 1;
  string page = 2;
  string event = 3;
}

// DatapuntWalk is one person's steps past the datapunt, in the order they took
// them. The visitor id is theirs and persists (the snippet keeps it in
// localStorage), so this is a person's whole path across every visit, not one
// sitting.
message DatapuntWalk {
  string who = 1;
  repeated DatapuntStep steps = 2;
}

// DatapuntCount is one row the metrics sigil answers with: a value of the
// dimension asked for and how many arrivals carried it, Umami's metrics shape.
message DatapuntCount {
  string name = 1;
  uint32 count = 2;
}

// DatapuntActivityRow is one arrival read as a line rather than as a number.
// The shape is Umami's session activity: one row per event, newest first, and
// the reading of it is left to whoever asked (ADR-036).
message DatapuntActivityRow {
  string at = 1;
  string visit = 2;
  string visitor = 3;
  string path = 4;
  string query = 5;
  string referrer_domain = 6;
  string event = 7;
}

// Datapunts is what datapunts list answers.
message Datapunts {
  // One row per datapunt that has not been taken down.
  repeated Datapunt datapunts = 1;
}

// DatapuntMetrics is what datapunts metrics answers.
message DatapuntMetrics {
  // What the arrivals were grouped by.
  string type = 1;
  // One row per value, most first: its name and its count.
  repeated DatapuntCount counts = 2;
  // The market that was asked about.
  string market = 3;
  // The datapunt that was asked about.
  string slug = 4;
}

// DatapuntActivity is what datapunts activity answers.
message DatapuntActivity {
  // One row per arrival, five hundred at most: when, the visit, the visitor,
  // the page, where they came from, and the event.
  repeated DatapuntActivityRow activity = 1;
  // The market that was asked about.
  string market = 2;
  // The datapunt that was asked about.
  string slug = 3;
}

// DatapuntVisits is what datapunts visits answers.
message DatapuntVisits {
  // One row per sitting: who, when it started and ended, how long, the first
  // and last page, how many views and events, and whether it was a bounce.
  repeated Visit visits = 1;
  // The market that was asked about.
  string market = 2;
  // The datapunt that was asked about.
  string slug = 3;
}
