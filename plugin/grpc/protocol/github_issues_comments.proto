syntax = "proto3";

package protocol;

import "google/protobuf/struct.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043
// https://docs.github.com/en/rest/issues/comments?apiVersion=2026-03-10

// GET /repos/{owner}/{repo}/issues/comments
message GitHubListIssueCommentsForARepositoryRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string sort = 4;
  string direction = 5;
  string since = 6;
  int64 per_page = 7;
  int64 page = 8;
}

message GitHubListIssueCommentsForARepositoryResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubIssuesCommentsIssueComment items = 3;
}

// GET /repos/{owner}/{repo}/issues/comments/{comment_id}
message GitHubGetAnIssueCommentRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 comment_id = 4;
}

message GitHubGetAnIssueCommentResponse {
  bool success = 1;
  string error = 2;
  int64 id = 3;
  string node_id = 4;
  string url = 5;
  string body = 6;
  string body_text = 7;
  string body_html = 8;
  string html_url = 9;
  GitHubIssuesCommentsSimpleUser user = 10;
  string created_at = 11;
  string updated_at = 12;
  string issue_url = 13;
  string author_association = 14;
  GitHubIssuesCommentsGitHubApp performed_via_github_app = 15;
  GitHubIssuesCommentsReactionRollup reactions = 16;
  GitHubIssuesCommentsPinnedIssueComment pin = 17;
  GitHubIssuesCommentsMinimizedIssueComment minimized = 18;
}

// PATCH /repos/{owner}/{repo}/issues/comments/{comment_id}
// Response: same response schema as Get an issue comment.
message GitHubUpdateAnIssueCommentRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 comment_id = 4;
  string body = 5;
}

// DELETE /repos/{owner}/{repo}/issues/comments/{comment_id}
message GitHubDeleteAnIssueCommentRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 comment_id = 4;
}

message GitHubDeleteAnIssueCommentResponse {
  bool success = 1;
  string error = 2;
}

// PUT /repos/{owner}/{repo}/issues/comments/{comment_id}/pin
// Response: same response schema as Get an issue comment.
message GitHubPinAnIssueCommentRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 comment_id = 4;
}

// DELETE /repos/{owner}/{repo}/issues/comments/{comment_id}/pin
message GitHubUnpinAnIssueCommentRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 comment_id = 4;
}

message GitHubUnpinAnIssueCommentResponse {
  bool success = 1;
  string error = 2;
}

// GET /repos/{owner}/{repo}/issues/{issue_number}/comments
// Response: same response schema as List issue comments for a repository.
message GitHubListIssueCommentsRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  string since = 5;
  int64 per_page = 6;
  int64 page = 7;
}

// POST /repos/{owner}/{repo}/issues/{issue_number}/comments
// Response: same response schema as Get an issue comment.
message GitHubCreateAnIssueCommentRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 issue_number = 4;
  string body = 5;
}

// Issue Comment
message GitHubIssuesCommentsIssueComment {
  int64 id = 1;
  string node_id = 2;
  string url = 3;
  string body = 4;
  string body_text = 5;
  string body_html = 6;
  string html_url = 7;
  GitHubIssuesCommentsSimpleUser user = 8;
  string created_at = 9;
  string updated_at = 10;
  string issue_url = 11;
  string author_association = 12;
  GitHubIssuesCommentsGitHubApp performed_via_github_app = 13;
  GitHubIssuesCommentsReactionRollup reactions = 14;
  GitHubIssuesCommentsPinnedIssueComment pin = 15;
  GitHubIssuesCommentsMinimizedIssueComment minimized = 16;
}

// Simple User
message GitHubIssuesCommentsSimpleUser {
  string name = 1;
  string email = 2;
  string login = 3;
  int64 id = 4;
  string node_id = 5;
  string avatar_url = 6;
  string gravatar_id = 7;
  string url = 8;
  string html_url = 9;
  string followers_url = 10;
  string following_url = 11;
  string gists_url = 12;
  string starred_url = 13;
  string subscriptions_url = 14;
  string organizations_url = 15;
  string repos_url = 16;
  string events_url = 17;
  string received_events_url = 18;
  string type = 19;
  bool site_admin = 20;
  string starred_at = 21;
  string user_view_type = 22;
}

// GitHub app
message GitHubIssuesCommentsGitHubApp {
  int64 id = 1;
  string slug = 2;
  string node_id = 3;
  string client_id = 4;
  // One of Simple User or Enterprise.
  google.protobuf.Struct owner = 5;
  string name = 6;
  string description = 7;
  string external_url = 8;
  string html_url = 9;
  string created_at = 10;
  string updated_at = 11;
  map<string, string> permissions = 12;
  repeated string events = 13;
  int64 installations_count = 14;
}

// Reaction Rollup
message GitHubIssuesCommentsReactionRollup {
  string url = 1;
  int64 total_count = 2;
  int64 plus_1 = 3 [json_name = "+1"];
  int64 minus_1 = 4 [json_name = "-1"];
  int64 laugh = 5;
  int64 confused = 6;
  int64 heart = 7;
  int64 hooray = 8;
  int64 eyes = 9;
  int64 rocket = 10;
}

// Pinned Issue Comment
message GitHubIssuesCommentsPinnedIssueComment {
  string pinned_at = 1;
  GitHubIssuesCommentsSimpleUser pinned_by = 2;
}

// Minimized Issue Comment
message GitHubIssuesCommentsMinimizedIssueComment {
  string reason = 1;
}
