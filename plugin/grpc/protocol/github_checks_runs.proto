syntax = "proto3";

package protocol;

import "google/protobuf/struct.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043
// https://docs.github.com/en/rest/checks/runs?apiVersion=2026-03-10

message GitHubChecksRunsCreateACheckRunRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string status = 4;
}

message GitHubChecksRunsCreateACheckRunResponse {
  message Output {
    string title = 1;
    string summary = 2;
    string text = 3;
    int64 annotations_count = 4;
    string annotations_url = 5;
  }
  message CheckSuite {
    int64 id = 1;
  }
  bool success = 1;
  string error = 2;
  int64 id = 3;
  string head_sha = 4;
  string node_id = 5;
  string external_id = 6;
  string url = 7;
  string html_url = 8;
  string details_url = 9;
  string status = 10;
  string conclusion = 11;
  string started_at = 12;
  string completed_at = 13;
  Output output = 14;
  string name = 15;
  CheckSuite check_suite = 16;
  GitHubChecksRunsGitHubApp app = 17;
  repeated GitHubChecksRunsPullRequestMinimal pull_requests = 18;
  GitHubChecksRunsDeployment deployment = 19;
}

message GitHubChecksRunsGetACheckRunRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_run_id = 4;
}

message GitHubChecksRunsUpdateACheckRunRequest {
  message Output {
    message Annotations {
      string path = 1;
      int64 start_line = 2;
      int64 end_line = 3;
      int64 start_column = 4;
      int64 end_column = 5;
      string annotation_level = 6;
      string message = 7;
      string title = 8;
      string raw_details = 9;
    }
    message Images {
      string alt = 1;
      string image_url = 2;
      string caption = 3;
    }
    string title = 1;
    string summary = 2;
    string text = 3;
    repeated Annotations annotations = 4;
    repeated Images images = 5;
  }
  message Actions {
    string label = 1;
    string description = 2;
    string identifier = 3;
  }
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_run_id = 4;
  string name = 5;
  string details_url = 6;
  string external_id = 7;
  string started_at = 8;
  string status = 9;
  string conclusion = 10;
  string completed_at = 11;
  Output output = 12;
  repeated Actions actions = 13;
}

message GitHubChecksRunsListCheckRunAnnotationsRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_run_id = 4;
  int64 per_page = 5;
  int64 page = 6;
}

message GitHubChecksRunsListCheckRunAnnotationsResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubChecksRunsCheckAnnotation items = 3;
}

message GitHubChecksRunsRerequestACheckRunRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_run_id = 4;
}

message GitHubChecksRunsRerequestACheckRunResponse {
  bool success = 1;
  string error = 2;
}

message GitHubChecksRunsListCheckRunsInACheckSuiteRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  int64 check_suite_id = 4;
  string check_name = 5;
  string status = 6;
  string filter = 7;
  int64 per_page = 8;
  int64 page = 9;
}

message GitHubChecksRunsListCheckRunsInACheckSuiteResponse {
  bool success = 1;
  string error = 2;
  int64 total_count = 3;
  repeated GitHubChecksRunsCheckRun check_runs = 4;
}

message GitHubChecksRunsListCheckRunsForAGitReferenceRequest {
  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string ref = 4;
  string check_name = 5;
  string status = 6;
  string filter = 7;
  int64 per_page = 8;
  int64 page = 9;
  int64 app_id = 10;
}

message GitHubChecksRunsSimpleUser {
  string name = 1;
  string email = 2;
  string login = 3;
  int64 id = 4;
  string node_id = 5;
  string avatar_url = 6;
  string gravatar_id = 7;
  string url = 8;
  string html_url = 9;
  string followers_url = 10;
  string following_url = 11;
  string gists_url = 12;
  string starred_url = 13;
  string subscriptions_url = 14;
  string organizations_url = 15;
  string repos_url = 16;
  string events_url = 17;
  string received_events_url = 18;
  string type = 19;
  bool site_admin = 20;
  string starred_at = 21;
  string user_view_type = 22;
}

message GitHubChecksRunsEnterprise {
  string description = 1;
  string html_url = 2;
  string website_url = 3;
  int64 id = 4;
  string node_id = 5;
  string name = 6;
  string slug = 7;
  string created_at = 8;
  string updated_at = 9;
  string avatar_url = 10;
}

message GitHubChecksRunsGitHubApp {
  int64 id = 1;
  string slug = 2;
  string node_id = 3;
  string client_id = 4;
  google.protobuf.Value owner = 5;
  string name = 6;
  string description = 7;
  string external_url = 8;
  string html_url = 9;
  string created_at = 10;
  string updated_at = 11;
  map<string, string> permissions = 12;
  repeated string events = 13;
  int64 installations_count = 14;
}

message GitHubChecksRunsPullRequestMinimal {
  message Head {
    message Repo {
      int64 id = 1;
      string url = 2;
      string name = 3;
    }
    string ref = 1;
    string sha = 2;
    Repo repo = 3;
  }
  message Base {
    message Repo {
      int64 id = 1;
      string url = 2;
      string name = 3;
    }
    string ref = 1;
    string sha = 2;
    Repo repo = 3;
  }
  int64 id = 1;
  int64 number = 2;
  string url = 3;
  Head head = 4;
  Base base = 5;
}

message GitHubChecksRunsDeployment {
  string url = 1;
  int64 id = 2;
  string node_id = 3;
  string task = 4;
  string original_environment = 5;
  string environment = 6;
  string description = 7;
  string created_at = 8;
  string updated_at = 9;
  string statuses_url = 10;
  string repository_url = 11;
  bool transient_environment = 12;
  bool production_environment = 13;
  GitHubChecksRunsGitHubApp performed_via_github_app = 14;
}

message GitHubChecksRunsCheckAnnotation {
  string path = 1;
  int64 start_line = 2;
  int64 end_line = 3;
  int64 start_column = 4;
  int64 end_column = 5;
  string annotation_level = 6;
  string title = 7;
  string message = 8;
  string raw_details = 9;
  string blob_href = 10;
}

message GitHubChecksRunsCheckRun {
  message Output {
    string title = 1;
    string summary = 2;
    string text = 3;
    int64 annotations_count = 4;
    string annotations_url = 5;
  }
  message CheckSuite {
    int64 id = 1;
  }
  int64 id = 1;
  string head_sha = 2;
  string node_id = 3;
  string external_id = 4;
  string url = 5;
  string html_url = 6;
  string details_url = 7;
  string status = 8;
  string conclusion = 9;
  string started_at = 10;
  string completed_at = 11;
  Output output = 12;
  string name = 13;
  CheckSuite check_suite = 14;
  GitHubChecksRunsGitHubApp app = 15;
  repeated GitHubChecksRunsPullRequestMinimal pull_requests = 16;
  GitHubChecksRunsDeployment deployment = 17;
}
