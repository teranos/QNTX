syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// VectorSearchService provides nearest-neighbor search over dense vector indexes.
// Backed by a FAISS provider plugin (ADR-016).
service VectorSearchService {
  // Search finds the nearest neighbors to a query vector in a named index.
  rpc Search(VectorSearchRequest) returns (VectorSearchResponse);

  // AddVectors inserts vectors into a named index.
  rpc AddVectors(AddVectorsRequest) returns (AddVectorsResponse);

  // CreateIndex creates a new named vector index.
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);

  // DeleteVectors removes vectors from a named index by their ids. An id the
  // index does not hold is no error.
  rpc DeleteVectors(DeleteVectorsRequest) returns (DeleteVectorsResponse);

  // Holds answers which of some ids a named index holds, each with the
  // revision it was added with. An index that is not there holds none.
  rpc Holds(HoldsRequest) returns (HoldsResponse);
}

message HoldsRequest {
  string auth_token = 1;
  string index = 2;          // the index asked
  repeated string ids = 3;   // the ids asked about
}

message HoldsResponse {
  // The ids asked about that the index holds, each with its revision. An id
  // asked about and not here is not held.
  repeated HeldVector held = 1;
}

message HeldVector {
  // The id the vector was added under.
  string id = 1;
  // The revision it was added with.
  int64 revision = 2;
}

message DeleteVectorsRequest {
  string auth_token = 1;
  string index = 2;          // target index
  repeated string ids = 3;   // ids of the vectors to remove
}

message DeleteVectorsResponse {
  // How many ids were handed to the index to take out.
  int32 deleted = 1;
}

message VectorSearchRequest {
  string auth_token = 1;
  string index = 2;                 // which index to search
  repeated float query_vector = 3;  // query vector
  int32 top_k = 4;
}

message VectorSearchResponse {
  // The nearest vectors, nearest first.
  repeated VectorSearchHit results = 1;
}

message VectorSearchHit {
  // The id the vector was added under.
  string id = 1;
  // Its distance from the query vector: 0 is the same direction.
  float distance = 2;
}

message AddVectorsRequest {
  string auth_token = 1;
  string index = 2;                    // target index
  repeated VectorEntry vectors = 3;    // vectors to add
}

message VectorEntry {
  string id = 1;                // identifier for this vector
  repeated float vector = 2;   // the vector data
  // A number the caller keeps beside the vector, answered back by Holds: what
  // the vector was made from, so the caller knows when to add it again.
  int64 revision = 3;
}

message AddVectorsResponse {
  // How many vectors the index took.
  int32 added = 1;
}

message CreateIndexRequest {
  string auth_token = 1;
  string name = 2;          // index name
  int32 dimensions = 3;     // vector dimensionality
}

message CreateIndexResponse {
  // The index, by its name.
  string name = 1;
}
