syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

import "plugin/grpc/protocol/sigil.proto";

// DomainPluginService is the gRPC service for external domain plugins
service DomainPluginService {
  // Metadata returns plugin metadata
  rpc Metadata(Empty) returns (MetadataResponse);

  // Initialize initializes the plugin with config and ATS endpoint.
  // Called once per process lifetime. Plugins must handle re-init: stop previous state first.
  // See ADR-018 for the full lifecycle contract.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);

  // Shutdown shuts down the plugin
  rpc Shutdown(Empty) returns (Empty);

  // HandleHTTP handles an HTTP request
  rpc HandleHTTP(HTTPRequest) returns (HTTPResponse);

  // HandleWebSocket handles a WebSocket connection (bidirectional streaming).
  // QNTX sends PING messages on the incoming stream and expects PONG responses.
  // Plugins must read the incoming stream and reply to PING with PONG.
  // See ADR-018 for the keepalive contract.
  rpc HandleWebSocket(stream WebSocketMessage) returns (stream WebSocketMessage);

  // Health checks plugin health
  rpc Health(Empty) returns (HealthResponse);

  // ConfigSchema returns the configuration schema for this plugin
  rpc ConfigSchema(Empty) returns (ConfigSchemaResponse);

  // RegisterElements returns custom element type definitions provided by this plugin
  rpc RegisterElements(Empty) returns (ElementDefResponse);

  // ExecuteJob executes an async job
  // Used by Pulse to route jobs to plugin-registered handlers
  rpc ExecuteJob(ExecuteJobRequest) returns (ExecuteJobResponse);
}

message Empty {}

message MetadataResponse {
  string name = 1;
  string version = 2;
  string qntx_version = 3;
  string description = 4;
  string author = 5;
  string license = 6;
}

message InitializeRequest {
  // Service endpoints the plugin can call back to QNTX core
  // Format: "host:port" for TCP (e.g., "localhost:50051")
  //
  // Note: Database access is not provided - database is a hard boundary.
  // Plugins should use attestations via ats_store_endpoint instead.

  // ats_store_endpoint: gRPC endpoint for [ATSStoreService](https://qntx.sbvh.nl/api/grpc-atsstore.html)
  // Provides: Attestation creation, querying, and streaming
  string ats_store_endpoint = 1;

  // queue_endpoint: gRPC endpoint for [QueueService](https://qntx.sbvh.nl/api/grpc-queue.html)
  // Provides: Async job enqueue, status, and management
  string queue_endpoint = 2;

  // auth_token: Simple token for authenticating with service endpoints
  // Plugins must include this token in all service RPC calls
  string auth_token = 3;

  // Plugin-specific configuration values
  // Simple types (string, int, bool) passed as string representations
  // Complex types (maps, slices) JSON-encoded as strings
  // Plugins should parse and validate values appropriate to their schema
  map<string, string> config = 4;

  // schedule_endpoint: gRPC endpoint for [ScheduleService](https://qntx.sbvh.nl/api/grpc-schedule.html)
  // Provides: Runtime schedule creation, pause, resume, delete
  string schedule_endpoint = 5;

  // file_service_endpoint: gRPC endpoint for [FileService](https://qntx.sbvh.nl/api/grpc-fileservice.html)
  // Provides: Read stored files (for multimodal attachments)
  string file_service_endpoint = 6;

  // llm_endpoint: gRPC endpoint for [LLMService](https://qntx.sbvh.nl/api/grpc-llm.html)
  // Provides: Provider-agnostic LLM chat (routed through core to provider plugins)
  string llm_endpoint = 7;

  // embedding_endpoint: gRPC endpoint for [EmbeddingService](https://qntx.sbvh.nl/api/grpc-embedding.html)
  // Provides: Text-to-vector embedding generation
  string embedding_endpoint = 8;

  // vector_search_endpoint: gRPC endpoint for [VectorSearchService](https://qntx.sbvh.nl/api/grpc-vectorsearch.html)
  // Provides: Nearest-neighbor search over dense vector indexes (ADR-016)
  string vector_search_endpoint = 9;

  // ground_endpoint: gRPC endpoint for [GroundService](https://qntx.sbvh.nl/api/grpc-ground.html)
  // Provides: Write attestations to Ground's deferred news database
  string ground_endpoint = 10;

  // search_endpoint: gRPC endpoint for [SearchService](https://qntx.sbvh.nl/api/grpc-search.html)
  // Provides: Full-text search over indexed documents (routed through core to provider plugin)
  string search_endpoint = 11;

  // fetch_endpoint: gRPC endpoint for [FetchService](https://qntx.sbvh.nl/api/grpc-fetch.html)
  // Provides: HTTP GET with attestation — QNTX fetches and attests, plugins stay pure orchestration
  string fetch_endpoint = 12;

  // mail_endpoint: gRPC endpoint for MailService (plugin/grpc/protocol/mail.proto, ADR-041)
  // Provides: mail to a User, from the plugin's template — QNTX sends and attests
  string mail_endpoint = 13;
}

message HTTPRequest {
  string method = 1;
  string path = 2;
  repeated HTTPHeader headers = 3;
  bytes body = 4;
}

message HTTPResponse {
  int32 status_code = 1;
  repeated HTTPHeader headers = 2;
  bytes body = 3;
}

// HTTPHeader represents an HTTP header with support for multiple values.
// HTTP headers can have multiple values (e.g., Set-Cookie, Accept).
message HTTPHeader {
  string name = 1;
  repeated string values = 2;
}

message WebSocketMessage {
  enum Type {
    CONNECT = 0;
    DATA = 1;
    CLOSE = 2;
    PING = 3;   // Client/Server can send for keepalive
    PONG = 4;   // Response to PING
    ERROR = 5;  // Error notification
  }

  Type type = 1;
  bytes data = 2;
  map<string, string> headers = 3;  // Optional headers/metadata
  int64 timestamp = 4;              // For latency measurement (Unix timestamp in nanoseconds)
}

message HealthResponse {
  bool healthy = 1;
  string message = 2;
  map<string, string> details = 3;
}

message ConfigSchemaResponse {
  // Map of config field name to schema definition
  map<string, ConfigFieldSchema> fields = 1;
}

message ConfigFieldSchema {
  // Field type: "string", "number", "boolean", "array"
  string type = 1;

  // Human-readable description of what this field does
  string description = 2;

  // Default value (as string representation)
  string default_value = 3;

  // Whether this field is required
  bool required = 4;

  // For number types: minimum value (optional)
  string min_value = 5;

  // For number types: maximum value (optional)
  string max_value = 6;

  // For string types: validation pattern (regex, optional)
  string pattern = 7;

  // For array types: element type (optional)
  string element_type = 8;
}

// ScheduleInfo describes a schedule that a plugin wants QNTX to create
message ScheduleInfo {
  string handler_name = 1;        // Handler to invoke
  int32 interval_seconds = 2;     // Execution interval (0 = disabled)
  bool enabled_by_default = 3;    // Whether schedule starts active
  string description = 4;         // Human-readable description
  reserved 5;
  reserved "ats_code";
}

// InitializeResponse is returned by Initialize RPC
message InitializeResponse {
  // Handler names this plugin can execute
  // Examples: ["python.script", "python.webhook", "ixgest.git"]
  // Empty list means plugin provides no async handlers (backward compatible)
  repeated string handler_names = 1;

  // Schedules this plugin wants QNTX to create
  // QNTX will auto-create schedule.Job entries for these
  repeated ScheduleInfo schedules = 2;

  // llm_provider indicates this plugin implements LLMProvider (Chat RPC).
  // Core registers it as an LLM backend in the service mesh.
  bool llm_provider = 3;

  // Watchers this plugin wants registered on its behalf.
  // Core creates watchers with action_type=plugin_execute targeting this plugin.
  // On match, core calls ExecuteJob with the matching attestation as payload.
  repeated WatcherRegistration watchers = 4;

  // vector_search_provider indicates this plugin implements VectorSearchService (ADR-016).
  // Core registers it as a vector search backend in the service mesh.
  bool vector_search_provider = 5;

  // search_provider indicates this plugin implements SearchProvider (Search RPCs).
  // Core registers it as the search backend in the service mesh.
  bool search_provider = 6;

  // embedding_provider indicates this plugin implements EmbeddingService (Embed, BatchEmbed, Cluster, ModelInfo RPCs).
  // Core routes embedding calls to it instead of using the builtin CGO/FFI path.
  bool embedding_provider = 7;

  // The routes this plugin answers through HandleHTTP (ADR-001).
  repeated RouteInfo http_routes = 8;

  // python_provider indicates this plugin can execute Python code.
  // Core registers "py" element type when any loaded plugin declares this.
  bool python_provider = 9;

  // What this plugin does, as signa (ADR-039). Each sigil is bound to a path
  // under /api/{plugin}/ and answered by HandleHTTP there; the node serves it as
  // an endpoint and an MCP tool, behind the same gate as its own.
  repeated Signum signa = 10;
}

// RouteInfo is one route a plugin declares.
message RouteInfo {
  string method = 1;       // HTTP method: GET, POST, PUT, DELETE
  string path = 2;         // Path relative to plugin root (e.g., "/status")
  string description = 3;
}

// WatcherRegistration declares a watcher a plugin wants core to manage.
// Core creates/updates the watcher on Initialize and routes matches
// to the plugin via ExecuteJob.
message WatcherRegistration {
  string id = 1;                    // Watcher ID (scoped to plugin: "{plugin}-{id}")
  string handler_name = 2;          // ExecuteJob handler to invoke on match
  repeated string subjects = 3;     // Structural filter: subjects
  repeated string predicates = 4;   // Structural filter: predicates
  repeated string contexts = 5;     // Structural filter: contexts
  repeated string actors = 6;       // Structural filter: actors
  int32 max_fires_per_second = 7;   // Rate limit (0 = no action, structural only)
}

// ExecuteJobRequest is sent to plugins to execute an async job
message ExecuteJobRequest {
  string job_id = 1;           // For logging/tracking
  string handler_name = 2;     // Which handler to invoke
  bytes payload = 3;           // Job-specific data (JSON)
  optional int64 timeout_secs = 4;  // Execution timeout. If not set, no timeout.
  string store_token = 5;      // Reaches the store of the namespace the schedule's creator acted in, for this run. Empty is a job no caller made.
  string user_id = 6;          // The User whose sigil call created the schedule
}

// ExecuteJobResponse is returned after job execution
message ExecuteJobResponse {
  bool success = 1;
  string error = 2;            // Error message if failed
  bytes result = 3;            // Optional result data (JSON)

  // Progress tracking (optional) - Pulse updates job.Progress
  int32 progress_current = 4;
  int32 progress_total = 5;

  reserved 6;
  reserved "cost_actual";

  // Execution logs — written to task_logs table by PluginProxyHandler
  repeated JobLogEntry log_entries = 7;

  // Plugin version that produced this result (e.g., "0.2.14")
  string plugin_version = 8;
}

// JobLogEntry is a single log line from plugin job execution
message JobLogEntry {
  string timestamp = 1;  // RFC3339
  string level = 2;      // "info", "warn", "error", "debug"
  string message = 3;
  string stage = 4;      // optional execution phase grouping
  string metadata = 5;   // optional JSON blob
}

// ElementDefResponse contains custom element type definitions from a plugin
message ElementDefResponse {
  repeated ElementDef elements = 1;
}

// ElementDef defines a custom element type provided by a plugin
message ElementDef {
  // Symbol is the element identifier (e.g., "⚗" for a chemistry plugin)
  string symbol = 1;

  // Title is the human-readable name shown in the title bar
  string title = 2;

  // Label is a short identifier for logs and the spawn menu
  string label = 3;

  // ContentPath is the HTTP path (relative to /api/{plugin}/) that
  // returns the HTML fragment for this element's content area
  string content_path = 4;

  // CSSPath is an optional HTTP path to a stylesheet for this element type
  string css_path = 5;

  // DefaultWidth and DefaultHeight in pixels. "For 'use default', omit the
  // field."
  optional int32 default_width = 6;
  optional int32 default_height = 7;

  // ModulePath is the HTTP path to a JS/TS module exporting a render function.
  // When set, the frontend dynamically imports it with SDK injection,
  // bypassing the server-rendered HTML pipeline.
  string module_path = 8;
}

// PluginElement is one element definition a running plugin makes, with where
// its content, style and module are served.
message PluginElement {
  string plugin = 1;
  string symbol = 2;
  string title = 3;
  string label = 4;
  string content_url = 5;
  string css_url = 6;
  string module_url = 7;
  // In pixels, when the plugin names one: "For 'use default', omit the
  // field."
  optional int32 default_width = 8;
  optional int32 default_height = 9;
}

// PluginElements is what plugins elements answers.
message PluginElements {
  // One row per element definition.
  repeated PluginElement elements = 1;
}

// PluginAction is what plugins pause, resume, restart, enable and disable
// answer.
message PluginAction {
  // The plugin acted on.
  string name = 1;
  // Its state after the action. A restart says restarting: the outcome is seen
  // in its health.
  string state = 2;
  // The action taken.
  string action = 3;
}

// SigilReach is who the lines say reaches a sigil over one surface. ROOT
// reaches everything and is never listed: nothing here, and not anyone, is
// ROOT only.
message SigilReach {
  bool anyone = 1;
  repeated string levels = 2;
  repeated string roles = 3;
}

// SigilRow is one sigil a plugin handed the node, as the plugin panel draws it:
// what it is, and who reaches it over each surface.
message SigilRow {
  string signum = 1;
  string sigil = 2;
  string tool = 3;
  string method = 4;
  string path = 5;
  string does = 6;
  repeated Param takes = 7;
  repeated Field gives = 8;
  // Per surface: http, mcp and a2a.
  map<string, SigilReach> reach = 9;
}

// PluginInfo is one plugin plugins list knows.
message PluginInfo {
  string name = 1;
  string version = 2;
  string qntx_version = 3;
  string description = 4;
  string author = 5;
  string license = 6;
  bool healthy = 7;
  // Whether the last probe saw this plugin. Unprobed is not unhealthy: it
  // started after the probe was taken.
  bool probed = 8;
  string message = 9;
  // What the plugin's health said besides, as it crossed gRPC.
  map<string, string> details = 10;
  string state = 11;
  bool pausable = 12;
  // Identifies the element module this plugin serves, so the browser can
  // import a replaced one instead of the module record it already holds for
  // that URL. Empty for anything not serving a module.
  string module_digest = 13;
  // What the plugin does, as the node serves it (ADR-039).
  repeated SigilRow sigils = 14;
  // Why a signum it handed is served nowhere.
  repeated string signa_refused = 15;
  // The plugin's record: where it was added from, and whether it is switched
  // on.
  string repo = 16;
  bool enabled = 17;
}

// PluginHealthProbe is when the health in plugins list was probed. Health here
// is a probe with an age. Saying when it was taken is what keeps a stale answer
// from reading as a current one.
message PluginHealthProbe {
  string probed_at = 1;
  // How old that probe is.
  double age_ms = 2;
}

// PluginsList is what plugins list answers.
message PluginsList {
  // One row per plugin.
  repeated PluginInfo plugins = 1;
  // When the health in the rows was probed. Null before the first probe.
  PluginHealthProbe health = 2;
  // Why the last probe did not complete, when it did not.
  string health_probe_failure = 3;
  // Why the node's plugin records did not read, when they did not.
  string records_failure = 4;
}

// RouteEndpoint is a core endpoint a plugin's role is asked through.
message RouteEndpoint {
  string method = 1;
  string path = 2;
  string description = 3;
}

// PluginRoute is what one running plugin serves.
message PluginRoute {
  string name = 1;
  string http = 2;
  // Its socket path, when it serves one.
  string ws = 3;
  // The roles it plays: llm-provider, search-provider, embedding-provider.
  repeated string roles = 4;
  repeated string handlers = 5;
  uint32 schedules = 6;
  uint32 watchers = 7;
  repeated RouteEndpoint endpoints = 8;
}

// PluginRoutes is what plugins routes answers.
message PluginRoutes {
  // One row per running plugin.
  repeated PluginRoute routes = 1;
}

// PluginAdded is what plugins add answers.
message PluginAdded {
  // The plugin's name.
  string name = 1;
  // The repository it was added from.
  string repo = 2;
  // An added plugin starts disabled.
  bool enabled = 3;
}

// PluginChecked is what plugins check answers.
message PluginChecked {
  // The plugin's name.
  string name = 1;
  // The repository URL checked.
  string repo = 2;
  // The repository as GitHub names it, owner/repo.
  string repository = 3;
  // Whether GitHub keeps the repository private.
  bool private = 4;
  // The branch the plugin is read from: the tree URL's, or the repository's
  // default.
  string ref = 5;
  // Where in the repository the plugin is. Empty for a plugin that is the
  // whole repository.
  string path = 6;
  // "I expected to also see the plugin README if there is one."
  string readme = 7;
  // Where that README is in the repository.
  string readme_path = 8;
  // What GitHub answered when no README came back.
  string readme_said = 9;
}
