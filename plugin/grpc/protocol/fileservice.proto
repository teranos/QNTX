syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// FileService provides file access for gRPC plugins.
// Plugins use this to read files stored on the core server's filesystem.
service FileService {
  // ReadFileBase64 reads a stored file and returns its MIME type and base64-encoded content.
  rpc ReadFileBase64(ReadFileRequest) returns (ReadFileResponse);

  // "in reality, the photo syncs to my iCloud" "and iPluk picks it up"
  // KeepFile hands the node a file to keep, as a person brings one to
  // /api/files: the node names it by its bytes and attests that it holds it.
  rpc KeepFile(KeepFileRequest) returns (KeepFileResponse);
}

message ReadFileRequest {
  string auth_token = 1;
  string file_id = 2;
}

message ReadFileResponse {
  bool success = 1;
  string error = 2;
  string mime_type = 3;
  string base64_data = 4;
}

message KeepFileRequest {
  string auth_token = 1;
  // Who brought it: the actor of the node's held line, e.g. "ipluk".
  string by = 2;
  // The file's name; its extension says what kind it is, and the bytes must agree.
  string filename = 3;
  // The file whole. One gRPC message carries it, so it is at most what one carries.
  bytes content = 4;
  // "to me it feels like k should own my Media Assets"
  // The peer that is to hold it, as the primary calls it, e.g. "k". The node
  // keeps the file and brings it there through the primary. Empty: it stays here.
  string bring_to = 5;
}

message KeepFileResponse {
  bool success = 1;
  string error = 2;
  string file_id = 3;       // Where the node serves the bytes: /api/files/<file_id>
  string asset = 4;         // "sha256:<hex>" of the bytes
  string content_type = 5;
  int64 size = 6;
  // Where the file was brought, when bring_to named a peer and the peer kept it,
  // and the id that peer serves it under.
  string brought_to = 7;
  string brought_file_id = 8;
  // Why the file was not brought to the peer bring_to named. The node still keeps it.
  string not_brought = 9;
}
