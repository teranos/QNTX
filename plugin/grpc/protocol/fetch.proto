syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// FetchService provides HTTP fetching for plugins.
// QNTX performs the HTTP request and attests the result — plugins
// stay pure orchestration with no outbound network access.
service FetchService {
  // Fetch performs an HTTP GET and attests the response body
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

message FetchRequest {
  string auth_token = 1;
  string url = 2;                    // URL to fetch
  reserved 3, 4, 5, 7, 8;
  reserved "subjects", "predicate", "context", "actor", "source";
  bool fresh = 6;                   // Skip the record, always fetch from remote
  // What becomes of the fetch: attested as named, or not recorded at all. A
  // request naming neither is refused.
  oneof record {
    FetchRecord attest = 9;
    bool unrecorded = 10;           // Neither attested nor answered from a record. False is refused.
  }
}

// FetchRecord is the attestation a fetch is kept as. A fetch already attested
// under the same subjects and predicate is answered from its record unless
// fresh is set.
message FetchRecord {
  repeated string subjects = 1;     // At least one
  string predicate = 2;             // e.g. "http:get"
  string context = 3;               // e.g. the URL itself
  // Who wrote it: an actor the plugin names, or the node.
  oneof by {
    string actor = 4;               // e.g. "myplugin:pipeline"
    bool node = 5;                  // The node authors it. False is refused.
  }
  string source = 6;                // The plugin fetching: the attestation's source, and its version's.
}

message FetchResponse {
  bool success = 1;
  string error = 2;
  string body = 3;                   // Response body
  int32 status_code = 4;            // HTTP status code
  string attestation_id = 5;        // ID of created attestation
}
