syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// LLMService provides provider-agnostic LLM access for plugins.
// Provider plugins (OpenRouter, llama.cpp) register as backends.
// Core routes requests to the appropriate provider.
service LLMService {
  rpc Chat(LLMChatRequest) returns (LLMChatResponse);
  rpc StreamChat(LLMChatRequest) returns (stream LLMChatChunk);
}

message ChatMessage {
  string role = 1;     // "system", "user", "assistant"
  string content = 2;
}

message LLMChatRequest {
  // Deprecated: use messages field for new callers.
  string system_prompt = 1 [deprecated = true];
  // Deprecated: use messages field for new callers.
  string user_prompt = 2 [deprecated = true];
  string model = 3;
  double temperature = 4;
  int32 max_tokens = 5;
  string provider = 6;
  repeated Attachment attachments = 7;
  // Multi-turn conversation history. When populated, takes precedence
  // over system_prompt/user_prompt which remain for single-turn callers.
  repeated ChatMessage messages = 8;
  // Queuing priority. Lower value = higher priority.
  // 0 = interactive (user-initiated), 10 = background (generators, batch).
  int32 priority = 9;
}

message Attachment {
  string mime_type = 1;
  string data = 2;
  string filename = 3;
}

message LLMChatResponse {
  string content = 1;
  string model = 2;
  int32 prompt_tokens = 3;
  int32 completion_tokens = 4;
  int32 total_tokens = 5;
  // How the call was served, when the provider reports more than its own
  // name: a gateway provider says where it sent the call. Absent when the
  // provider reports nothing past `model` and the token counts.
  LLMServed served = 6;
}

// What a call asked for beside what served it, as the provider that served it
// reports it. Each field is the provider's report, never a guess: one it cannot
// tell is left empty, and empty means "not reported", not "the same as asked".
message LLMServed {
  // The QNTX provider the call named: LLMChatRequest.provider, as received.
  string requested_provider = 1;
  // The model or routing policy the call named: LLMChatRequest.model, as received.
  string requested_model = 2;
  // The upstream provider that served the call, by the name the provider
  // gives it (for otari, its Otari-Provider header: a configured instance name).
  string upstream_provider = 3;
  // The model the upstream provider was sent (for otari, its Otari-Model header).
  string executed_model = 4;
  // The model the provider's own response named, unaltered (for otari, the
  // body's `model`: the upstream's name for a model asked for directly, the
  // policy or alias name for one that was routed).
  string response_model = 5;
  // The provider's id for the call, by which its usage record is found
  // (for otari, Otari-Request-ID).
  string request_id = 6;
  // The cost the provider settled for the call, in US dollars, as the decimal
  // text it reported (for otari, usage.cost_usd). Absent when none was reported.
  optional string cost_usd = 7;
  // Where that cost's price came from, as the provider names it
  // (for otari, usage.pricing_source).
  string pricing_source = 8;
  // How many candidates the call was sent to, the serving one included
  // (for otari, Otari-Attempt-Count). 0 when not reported.
  int32 attempt_count = 9;
  // Whether a candidate other than the first planned one served the call
  // (for otari, Otari-Fallback).
  bool fallback = 10;
}

// Streaming: one chunk per generated token
message LLMChatChunk {
  string token = 1;                        // The generated token text
  bool done = 2;                           // True on final chunk
  string model = 3;                        // Model name: the final chunk names it, others may
  int32 prompt_tokens = 4;                 // Sent on final chunk
  int32 completion_tokens = 5;             // Sent on final chunk
  int32 total_tokens = 6;                  // Sent on final chunk
  // Per-token signal data, or that this chunk carries none. A chunk naming
  // neither is refused.
  oneof signal_of {
    TokenSignalProto signal = 7;
    bool no_signal = 8;                    // False is refused.
  }
  // How the call was served (see LLMChatResponse.served). Sent on the final
  // chunk, by a provider that reports it.
  LLMServed served = 9;
}

message TokenSignalProto {
  float confidence = 1;                    // P(chosen) from raw distribution
  float entropy = 2;                       // Shannon entropy in bits
  float top_gap = 3;                       // P(top1) - P(top2)
  repeated TokenCandidateProto top_k = 4;  // Top-k candidates
  repeated float full_distribution = 5;    // Full softmax distribution (vocab_size floats)
  repeated SamplerStageProto sampler_stages = 6;  // Per-stage snapshots through sampler chain
}

message TokenCandidateProto {
  int32 id = 1;
  string text = 2;
  float prob = 3;
}

// Snapshot of token distribution after a sampler stage
message SamplerStageProto {
  string name = 1;                         // Stage name: "logits", "top_k", "top_p", "temp", etc.
  int32 active_count = 2;                  // Tokens remaining with nonzero probability
  float top1_prob = 3;                     // P(top token) after this stage
  float entropy = 4;                       // Shannon entropy after this stage
  repeated TokenCandidateProto top_k = 5;  // Top-5 candidates after this stage
}
