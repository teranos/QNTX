    Status secret_scanning_delegated_alert_dismissal = 7;
    Status secret_scanning_delegated_bypass = 8;
    SecretScanningDelegatedBypassOptions secret_scanning_delegated_bypass_options = 9;
  }

  string namespace = 1;
  string owner = 2;
  string repo = 3;
  string name = 4;
  string description = 5;
  string homepage = 6;
  bool private = 7;
  string visibility = 8;
  SecurityAndAnalysis security_and_analysis = 9;
  bool has_issues = 10;
  bool has_projects = 11;
  bool has_wiki = 12;
  bool has_pull_requests = 13;
  string pull_request_creation_policy = 14;
  bool is_template = 15;
  string default_branch = 16;
  bool allow_squash_merge = 17;
  bool allow_merge_commit = 18;
  bool allow_rebase_merge = 19;
  bool allow_auto_merge = 20;
  bool delete_branch_on_merge = 21;
  bool allow_update_branch = 22;
  bool use_squash_pr_title_as_default = 23;
  string squash_merge_commit_title = 24;
