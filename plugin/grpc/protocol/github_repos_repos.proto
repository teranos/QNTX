}

// PATCH /repos/{owner}/{repo}
// Response: same response schema as Create an organization repository.
message GitHubUpdateARepositoryRequest {
  message SecurityAndAnalysis {
    message Status {
      string status = 1;
    }

    message SecretScanningDelegatedBypassOptions {
      message Reviewers {
        int64 reviewer_id = 1;
        string reviewer_type = 2;
        string mode = 3;
      }

      repeated Reviewers reviewers = 1;
    }

    Status advanced_security = 1;
    Status code_security = 2;
    Status secret_scanning = 3;
    Status secret_scanning_push_protection = 4;
    Status secret_scanning_ai_detection = 5;
