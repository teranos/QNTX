syntax = "proto3";

package protocol;

import "plugin/grpc/protocol/github_rate_limit.proto";
import "plugin/grpc/protocol/github_commits_statuses.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043: GitHubService
service GitHubService {
  // https://docs.github.com/en/rest/rate-limit/rate-limit?apiVersion=2026-03-10
  rpc RateLimit(GitHubRateLimitRequest) returns (GitHubRateLimitResponse);

  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#get-the-combined-status-for-a-specific-reference
  rpc GetCombinedStatus(GitHubGetCombinedStatusRequest) returns (GitHubGetCombinedStatusResponse);
  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#list-commit-statuses-for-a-reference
  rpc ListCommitStatuses(GitHubListCommitStatusesRequest) returns (GitHubListCommitStatusesResponse);
  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#create-a-commit-status
  rpc CreateCommitStatus(GitHubCreateCommitStatusRequest) returns (GitHubCreateCommitStatusResponse);
}
