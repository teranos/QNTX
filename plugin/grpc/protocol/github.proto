syntax = "proto3";

package protocol;

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// GitHubService does GitHub things on a plugin's behalf (ADR-043). QNTX holds
// the namespace's tokens, so a plugin keeps no client or credential of its own.
service GitHubService {
  // RateLimit is where the namespace's GitHub rate limit stands.
  rpc RateLimit(GitHubRateLimitRequest) returns (GitHubRateLimitResponse);
}

message GitHubRateLimitRequest {
  string auth_token = 1;
  string source = 2;     // The plugin asking.
  string namespace = 3;  // Whose GitHub it is.
}

// GitHubRate is one of GitHub's rate limit resources, as GitHub states it.
message GitHubRate {
  string resource = 1;  // core, search, graphql, …
  int64 limit = 2;
  int64 remaining = 3;
  int64 used = 4;
  int64 reset = 5;      // Unix seconds at which remaining is back to limit.
}

message GitHubRateLimitResponse {
  bool success = 1;
  string error = 2;
  repeated GitHubRate rates = 3;
}
