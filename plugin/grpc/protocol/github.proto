syntax = "proto3";

package protocol;

import "plugin/grpc/protocol/github_commits_statuses.proto";
import "plugin/grpc/protocol/github_commits_comments.proto";
import "plugin/grpc/protocol/github_commits_commits.proto";
import "plugin/grpc/protocol/github_branches_branches.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043: GitHubService
service GitHubService {
  // https://docs.github.com/en/rest/rate-limit/rate-limit?apiVersion=2026-03-10
  rpc RateLimit(GitHubRateLimitRequest) returns (GitHubRateLimitResponse);

  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#get-the-combined-status-for-a-specific-reference
  rpc GetTheCombinedStatusForASpecificReference(GitHubGetTheCombinedStatusForASpecificReferenceRequest) returns (GitHubGetTheCombinedStatusForASpecificReferenceResponse);
  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#list-commit-statuses-for-a-reference
  rpc ListCommitStatusesForAReference(GitHubListCommitStatusesForAReferenceRequest) returns (GitHubListCommitStatusesForAReferenceResponse);
  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#create-a-commit-status
  rpc CreateACommitStatus(GitHubCreateACommitStatusRequest) returns (GitHubCreateACommitStatusResponse);

  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#list-commit-comments-for-a-repository
  rpc ListCommitCommentsForARepository(GitHubListCommitCommentsForARepositoryRequest) returns (GitHubListCommitCommentsForARepositoryResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#get-a-commit-comment
  rpc GetACommitComment(GitHubGetACommitCommentRequest) returns (GitHubGetACommitCommentResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#update-a-commit-comment
  rpc UpdateACommitComment(GitHubUpdateACommitCommentRequest) returns (GitHubGetACommitCommentResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#delete-a-commit-comment
  rpc DeleteACommitComment(GitHubDeleteACommitCommentRequest) returns (GitHubDeleteACommitCommentResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#list-commit-comments
  rpc ListCommitComments(GitHubListCommitCommentsRequest) returns (GitHubListCommitCommentsForARepositoryResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#create-a-commit-comment
  rpc CreateACommitComment(GitHubCreateACommitCommentRequest) returns (GitHubGetACommitCommentResponse);

  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#list-commits
  rpc ListCommits(GitHubListCommitsRequest) returns (GitHubListCommitsResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#list-branches-for-head-commit
  rpc ListBranchesForHEADCommit(GitHubListBranchesForHEADCommitRequest) returns (GitHubListBranchesForHEADCommitResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#list-pull-requests-associated-with-a-commit
  rpc ListPullRequestsAssociatedWithACommit(GitHubListPullRequestsAssociatedWithACommitRequest) returns (GitHubListPullRequestsAssociatedWithACommitResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#get-a-commit
  rpc GetACommit(GitHubGetACommitRequest) returns (GitHubGetACommitResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#compare-two-commits
  rpc CompareTwoCommits(GitHubCompareTwoCommitsRequest) returns (GitHubCompareTwoCommitsResponse);

  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#list-branches
  rpc ListBranches(GitHubListBranchesRequest) returns (GitHubListBranchesResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#get-a-branch
  rpc GetABranch(GitHubGetABranchRequest) returns (GitHubGetABranchResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#rename-a-branch
  rpc RenameABranch(GitHubRenameABranchRequest) returns (GitHubGetABranchResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#sync-a-fork-branch-with-the-upstream-repository
  rpc SyncAForkBranchWithTheUpstreamRepository(GitHubSyncAForkBranchWithTheUpstreamRepositoryRequest) returns (GitHubSyncAForkBranchWithTheUpstreamRepositoryResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#merge-a-branch
  rpc MergeABranch(GitHubMergeABranchRequest) returns (GitHubMergeABranchResponse);
}

message GitHubRateLimitRequest {
  string auth_token = 1;
  string source = 2;
  string namespace = 3;
}

message GitHubRate {
  int64 limit = 1;
  int64 remaining = 2;
  int64 reset = 3;
  int64 used = 4;
}

message GitHubRateLimitResponse {
  bool success = 1;
  string error = 2;
  map<string, GitHubRate> resources = 3;
}
