syntax = "proto3";

package protocol;

import "plugin/grpc/protocol/github_commits_statuses.proto";
import "plugin/grpc/protocol/github_commits_comments.proto";
import "plugin/grpc/protocol/github_commits_commits.proto";
import "plugin/grpc/protocol/github_branches_branches.proto";
import "plugin/grpc/protocol/github_pulls_review_requests.proto";
import "plugin/grpc/protocol/github_pulls_reviews.proto";
import "plugin/grpc/protocol/github_pulls_comments.proto";
import "plugin/grpc/protocol/github_pulls_pulls.proto";
import "plugin/grpc/protocol/github_actions_workflows.proto";

option go_package = "github.com/teranos/QNTX/plugin/grpc/protocol";

// ADR-043: GitHubService
service GitHubService {
  // https://docs.github.com/en/rest/rate-limit/rate-limit?apiVersion=2026-03-10
  rpc RateLimit(GitHubRateLimitRequest) returns (GitHubRateLimitResponse);

  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#get-the-combined-status-for-a-specific-reference
  rpc GetTheCombinedStatusForASpecificReference(GitHubGetTheCombinedStatusForASpecificReferenceRequest) returns (GitHubGetTheCombinedStatusForASpecificReferenceResponse);
  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#list-commit-statuses-for-a-reference
  rpc ListCommitStatusesForAReference(GitHubListCommitStatusesForAReferenceRequest) returns (GitHubListCommitStatusesForAReferenceResponse);
  // https://docs.github.com/en/rest/commits/statuses?apiVersion=2026-03-10#create-a-commit-status
  rpc CreateACommitStatus(GitHubCreateACommitStatusRequest) returns (GitHubCreateACommitStatusResponse);

  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#list-commit-comments-for-a-repository
  rpc ListCommitCommentsForARepository(GitHubListCommitCommentsForARepositoryRequest) returns (GitHubListCommitCommentsForARepositoryResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#get-a-commit-comment
  rpc GetACommitComment(GitHubGetACommitCommentRequest) returns (GitHubGetACommitCommentResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#update-a-commit-comment
  rpc UpdateACommitComment(GitHubUpdateACommitCommentRequest) returns (GitHubGetACommitCommentResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#delete-a-commit-comment
  rpc DeleteACommitComment(GitHubDeleteACommitCommentRequest) returns (GitHubDeleteACommitCommentResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#list-commit-comments
  rpc ListCommitComments(GitHubListCommitCommentsRequest) returns (GitHubListCommitCommentsForARepositoryResponse);
  // https://docs.github.com/en/rest/commits/comments?apiVersion=2026-03-10#create-a-commit-comment
  rpc CreateACommitComment(GitHubCreateACommitCommentRequest) returns (GitHubGetACommitCommentResponse);

  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#list-commits
  rpc ListCommits(GitHubListCommitsRequest) returns (GitHubListCommitsResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#list-branches-for-head-commit
  rpc ListBranchesForHEADCommit(GitHubListBranchesForHEADCommitRequest) returns (GitHubListBranchesForHEADCommitResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#list-pull-requests-associated-with-a-commit
  rpc ListPullRequestsAssociatedWithACommit(GitHubListPullRequestsAssociatedWithACommitRequest) returns (GitHubListPullRequestsAssociatedWithACommitResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#get-a-commit
  rpc GetACommit(GitHubGetACommitRequest) returns (GitHubGetACommitResponse);
  // https://docs.github.com/en/rest/commits/commits?apiVersion=2026-03-10#compare-two-commits
  rpc CompareTwoCommits(GitHubCompareTwoCommitsRequest) returns (GitHubCompareTwoCommitsResponse);

  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#list-branches
  rpc ListBranches(GitHubListBranchesRequest) returns (GitHubListBranchesResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#get-a-branch
  rpc GetABranch(GitHubGetABranchRequest) returns (GitHubGetABranchResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#rename-a-branch
  rpc RenameABranch(GitHubRenameABranchRequest) returns (GitHubGetABranchResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#sync-a-fork-branch-with-the-upstream-repository
  rpc SyncAForkBranchWithTheUpstreamRepository(GitHubSyncAForkBranchWithTheUpstreamRepositoryRequest) returns (GitHubSyncAForkBranchWithTheUpstreamRepositoryResponse);
  // https://docs.github.com/en/rest/branches/branches?apiVersion=2026-03-10#merge-a-branch
  rpc MergeABranch(GitHubMergeABranchRequest) returns (GitHubMergeABranchResponse);

  // https://docs.github.com/en/rest/pulls/review-requests?apiVersion=2026-03-10#get-all-requested-reviewers-for-a-pull-request
  rpc GetAllRequestedReviewersForAPullRequest(GitHubGetAllRequestedReviewersForAPullRequestRequest) returns (GitHubGetAllRequestedReviewersForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/review-requests?apiVersion=2026-03-10#request-reviewers-for-a-pull-request
  rpc RequestReviewersForAPullRequest(GitHubRequestReviewersForAPullRequestRequest) returns (GitHubRequestReviewersForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/review-requests?apiVersion=2026-03-10#remove-requested-reviewers-from-a-pull-request
  rpc RemoveRequestedReviewersFromAPullRequest(GitHubRemoveRequestedReviewersFromAPullRequestRequest) returns (GitHubRequestReviewersForAPullRequestResponse);

  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#list-reviews-for-a-pull-request
  rpc ListReviewsForAPullRequest(GitHubListReviewsForAPullRequestRequest) returns (GitHubListReviewsForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#create-a-review-for-a-pull-request
  rpc CreateAReviewForAPullRequest(GitHubCreateAReviewForAPullRequestRequest) returns (GitHubCreateAReviewForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#get-a-review-for-a-pull-request
  rpc GetAReviewForAPullRequest(GitHubGetAReviewForAPullRequestRequest) returns (GitHubCreateAReviewForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#update-a-review-for-a-pull-request
  rpc UpdateAReviewForAPullRequest(GitHubUpdateAReviewForAPullRequestRequest) returns (GitHubCreateAReviewForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#delete-a-pending-review-for-a-pull-request
  rpc DeleteAPendingReviewForAPullRequest(GitHubDeleteAPendingReviewForAPullRequestRequest) returns (GitHubCreateAReviewForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#list-comments-for-a-pull-request-review
  rpc ListCommentsForAPullRequestReview(GitHubListCommentsForAPullRequestReviewRequest) returns (GitHubListCommentsForAPullRequestReviewResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#dismiss-a-review-for-a-pull-request
  rpc DismissAReviewForAPullRequest(GitHubDismissAReviewForAPullRequestRequest) returns (GitHubCreateAReviewForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/reviews?apiVersion=2026-03-10#submit-a-review-for-a-pull-request
  rpc SubmitAReviewForAPullRequest(GitHubSubmitAReviewForAPullRequestRequest) returns (GitHubCreateAReviewForAPullRequestResponse);

  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#list-review-comments-in-a-repository
  rpc ListReviewCommentsInARepository(GitHubListReviewCommentsInARepositoryRequest) returns (GitHubListReviewCommentsInARepositoryResponse);
  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#get-a-review-comment-for-a-pull-request
  rpc GetAReviewCommentForAPullRequest(GitHubGetAReviewCommentForAPullRequestRequest) returns (GitHubGetAReviewCommentForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#update-a-review-comment-for-a-pull-request
  rpc UpdateAReviewCommentForAPullRequest(GitHubUpdateAReviewCommentForAPullRequestRequest) returns (GitHubGetAReviewCommentForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#delete-a-review-comment-for-a-pull-request
  rpc DeleteAReviewCommentForAPullRequest(GitHubDeleteAReviewCommentForAPullRequestRequest) returns (GitHubDeleteAReviewCommentForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#list-review-comments-on-a-pull-request
  rpc ListReviewCommentsOnAPullRequest(GitHubListReviewCommentsOnAPullRequestRequest) returns (GitHubListReviewCommentsInARepositoryResponse);
  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#create-a-review-comment-for-a-pull-request
  rpc CreateAReviewCommentForAPullRequest(GitHubCreateAReviewCommentForAPullRequestRequest) returns (GitHubGetAReviewCommentForAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/comments?apiVersion=2026-03-10#create-a-reply-for-a-review-comment
  rpc CreateAReplyForAReviewComment(GitHubCreateAReplyForAReviewCommentRequest) returns (GitHubGetAReviewCommentForAPullRequestResponse);

  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#list-pull-requests
  rpc ListPullRequests(GitHubListPullRequestsRequest) returns (GitHubListPullRequestsResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#create-a-pull-request
  rpc CreateAPullRequest(GitHubCreateAPullRequestRequest) returns (GitHubCreateAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#get-a-pull-request
  rpc GetAPullRequest(GitHubGetAPullRequestRequest) returns (GitHubCreateAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#update-a-pull-request
  rpc UpdateAPullRequest(GitHubUpdateAPullRequestRequest) returns (GitHubCreateAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#list-commits-on-a-pull-request
  rpc ListCommitsOnAPullRequest(GitHubListCommitsOnAPullRequestRequest) returns (GitHubListCommitsOnAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#list-pull-requests-files
  rpc ListPullRequestsFiles(GitHubListPullRequestsFilesRequest) returns (GitHubListPullRequestsFilesResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#check-if-a-pull-request-has-been-merged
  rpc CheckIfAPullRequestHasBeenMerged(GitHubCheckIfAPullRequestHasBeenMergedRequest) returns (GitHubCheckIfAPullRequestHasBeenMergedResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#merge-a-pull-request
  rpc MergeAPullRequest(GitHubMergeAPullRequestRequest) returns (GitHubMergeAPullRequestResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#merge-a-pull-request-asynchronously
  rpc MergeAPullRequestAsynchronously(GitHubMergeAPullRequestAsynchronouslyRequest) returns (GitHubMergeAPullRequestAsynchronouslyResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#get-the-result-of-an-asynchronous-merge
  rpc GetTheResultOfAnAsynchronousMerge(GitHubGetTheResultOfAnAsynchronousMergeRequest) returns (GitHubMergeAPullRequestAsynchronouslyResponse);
  // https://docs.github.com/en/rest/pulls/pulls?apiVersion=2026-03-10#update-a-pull-request-branch
  rpc UpdateAPullRequestBranch(GitHubUpdateAPullRequestBranchRequest) returns (GitHubUpdateAPullRequestBranchResponse);

  // https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#list-repository-workflows
  rpc ListRepositoryWorkflows(GitHubListRepositoryWorkflowsRequest) returns (GitHubListRepositoryWorkflowsResponse);
  // https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#get-a-workflow
  rpc GetAWorkflow(GitHubGetAWorkflowRequest) returns (GitHubGetAWorkflowResponse);
  // https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#disable-a-workflow
  rpc DisableAWorkflow(GitHubDisableAWorkflowRequest) returns (GitHubDisableAWorkflowResponse);
  // https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#create-a-workflow-dispatch-event
  rpc CreateAWorkflowDispatchEvent(GitHubCreateAWorkflowDispatchEventRequest) returns (GitHubCreateAWorkflowDispatchEventResponse);
  // https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#enable-a-workflow
  rpc EnableAWorkflow(GitHubEnableAWorkflowRequest) returns (GitHubEnableAWorkflowResponse);
  // https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#get-workflow-usage
  rpc GetWorkflowUsage(GitHubGetWorkflowUsageRequest) returns (GitHubGetWorkflowUsageResponse);
}

message GitHubRateLimitRequest {
  string auth_token = 1;
  string source = 2;
  string namespace = 3;
}

message GitHubRate {
  int64 limit = 1;
  int64 remaining = 2;
  int64 reset = 3;
  int64 used = 4;
}

message GitHubRateLimitResponse {
  bool success = 1;
  string error = 2;
  map<string, GitHubRate> resources = 3;
}
