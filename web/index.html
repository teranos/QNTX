    <!-- Code editor components -->

</head>
<body class="disconnected">
    <main id="container">
        <div id="left-panel">
            <!-- Virtue #4: Semantic HTML - Use <header> for page header -->
            <header id="header" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;">
                <div style="display: block; width: 24px; height: 24px; transition: all 0.2s ease; flex-shrink: 0;" onmouseover="this.style.filter='invert(1)'" onmouseout="this.style.filter='none'">
                    <img src="/qntx.jpg" alt="QNTX" style="width: 100%; height: 100%; display: block;">
                </div>
                <div style="font-size: 11px; color: #888; white-space: nowrap;">
                    <span id="build-hash"></span>
                </div>
            </header>

            <div id="query-container">
                <div id="query-drop-zone">
                    <!-- CodeMirror 6 Editor Container -->
                    <div id="codemirror-container"></div>

                    <div id="drop-indicator" style="display: none;">
                        <div class="drop-icon">📄</div>
                        <div class="drop-text">Drop to create ix command</div>
                    </div>
                </div>
                <button id="run-ix-button" style="display: none;">
                    <span class="button-icon">▶</span>
                    <span class="button-text">Run</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" role="status" aria-live="polite"></div>

    <!-- Pulse Configuration Panel (Daily + Monthly Budget) -->
    <!-- Unified Search Drawer -->
    <div id="system-drawer">
        <div id="system-drawer-header">
            <!-- Status indicators and search input inserted dynamically by TypeScript -->
            <div class="controls">
                <span id="system-version" style="font-size: 9px; color: #555; margin-right: 8px;"></span>
            </div>
        </div>
        <div id="search-results-container"></div>
    </div>

    <!-- Panel skeleton - cloned by BasePanel for all standard panels -->
    <template id="panel-skeleton">
        <div class="panel-header">
            <h3 class="panel-title"></h3>
            <div class="panel-header-actions">
                <button class="panel-fullscreen-toggle" type="button" aria-label="Enter fullscreen">⛶</button>
                <button class="panel-close" type="button" aria-label="Close">✕</button>
            </div>
        </div>
        <div class="panel-search" hidden>
            <input type="text" class="panel-search-input" placeholder="Filter...">
        </div>
        <div class="panel-content">
            <div class="panel-loading"><p>Loading...</p></div>
        </div>
    </template>

    <!-- Empty state template - cloned by BasePanel.createEmptyState() -->
    <template id="empty-state-template">
        <div class="panel-empty">
            <p class="panel-empty-title"></p>
            <p class="panel-empty-hint"></p>
        </div>
    </template>

    <!-- Load app after DOM is ready (type="module" defers automatically) -->
    <script type="module" src="/ts/main.ts"></script>

    <!-- TIMING: Track module script execution -->
    <script>
    console.log('[TIMING] HTML parsing complete:', Date.now() - (performance.timeOrigin || Date.now()), 'ms');
    </script>

</body>
</html>
