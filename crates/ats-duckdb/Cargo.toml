[package]
name = "ats-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parquet storage backend for QNTX attestations (embedded DuckDB)"

[lints]
workspace = true

[dependencies]
# Proto-generated types (ADR-006)
qntx-proto.workspace = true

# Core QNTX types (traits, Attestation, AxFilter)
ats.workspace = true

# Shared FFI utilities
qntx-ffi-common = { path = "../qntx-ffi-common" }

# duckdb-rs Rust bindings. NO cargo features enabled:
#   - `parquet` feature transitively enables `bundled`, which forces
#     source-compiling DuckDB (15+ min). Nix-provided libduckdb already
#     includes Parquet and httpfs as first-party extensions.
#
# This version determines which DuckDB C library the process must link:
# libduckdb-sys generates its bindings against one release. flake.nix pins
# libduckdb to match, and EXPECTED_DUCKDB_VERSION in lib.rs fails the process
# if the linked library ever disagrees. Bump all three together or none.
#
# The crate tracked DuckDB's own version through 1.4.x, then switched to an
# encoded scheme at 1.5.0 (1.10500.0 = DuckDB 1.5.0). So this plain 1.4.3 is
# DuckDB 1.4.3, not an older crate release.
#
# Staying on 1.4.x is a glibc decision, not a DuckDB one — see flake.nix.
duckdb = { version = "=1.4.3" }

# Serialization
serde.workspace = true
serde_json.workspace = true

# A namespace is defined by its ns.toml (ADR-026), which DuckDB cannot read.
toml = "=1.1.3"

# The one typed value an error crosses every layer as, FFI included.
laye-error = { path = "../laye-error" }

# UUID for Parquet flush filenames
uuid = { version = "1.20.0", features = ["v4"] }

# One JSON object per token, User, namespace definition and node identity is
# a PUT and a GET, not a query. Through DuckDB the answer S3 gave came back as
# a status code and a phrase, the body one field away and never handed over.
# The SDK hands the whole response back on its error, so what S3 said is what
# the error carries. DuckDB keeps the Parquet.
# TLS is rustls on ring, which this workspace already builds; the SDK's
# default client wants aws-lc-rs and a cmake the Nix shell does not carry.
# These are the newest releases that build on the rustc flake.nix carries,
# 1.91.1; the SDK moved its floor to 1.94.1 after them.
aws-config = { version = "=1.8.18", default-features = false, features = ["rt-tokio", "behavior-version-latest", "credentials-process"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "=1.1.13", default-features = false, features = ["rustls-ring"] }
aws-credential-types = { version = "=1.2.14" }
aws-smithy-types = { version = "=1.5.0" }
aws-smithy-runtime-api = { version = "=1.12.3" }
tokio = { version = "=1.53.1", default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = "3.0"
pretty_assertions = "1.4"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ffi = []
