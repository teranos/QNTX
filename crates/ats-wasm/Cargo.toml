[package]
name = "ats-wasm"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "QNTX WASM bridge - exposes ats functions for Go via wazero and browser"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:ats-indexeddb", "dep:console_error_panic_hook"]

[lints]
workspace = true

[dependencies]
# Proto types - demonstrates WASM can use proto without gRPC dependencies (ADR-006)
qntx-proto = { path = "../qntx-proto" }
ats = { path = "../ats", default-features = false, features = ["wasm"] }
ats-id = { path = "../ats-id" }
serde = { workspace = true }
serde_json = { workspace = true }

# Browser-specific dependencies (only with 'browser' feature)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
ats-indexeddb = { path = "../ats-indexeddb", optional = true }

# Browser panic debugging: routes panic messages to console.error
# Without this, panics show as "RuntimeError: unreachable" with no useful info
console_error_panic_hook = { version = "0.1", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
